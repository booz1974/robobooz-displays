          }
          id(fav_names).clear();
          id(fav_uris).clear();
          id(fav_urls).clear();
          id(fav_btns).clear();
          id(fav_dsc) = keep;
          for (size_t k = 0; k < cnt; k++) {
            std::string nm = clean(nw[k * 3]);
            const std::string &uri = nw[k * 3 + 1];
            bool radio = uri.find("://radio/") != std::string::npos;
            id(fav_names).push_back(nm);
            id(fav_uris).push_back(uri);
            id(fav_urls).push_back(nw[k * 3 + 2]);
            lv_obj_t *b = lv_button_create(radio ? cols[0] : cols[1]);
            lv_obj_set_size(b, 222, 54);
            lv_obj_remove_flag(b, LV_OBJ_FLAG_SCROLLABLE);
            lv_obj_set_style_radius(b, 12, 0);
            lv_obj_set_style_pad_all(b, 0, 0);
            lv_obj_set_style_clip_corner(b, true, 0);
            lv_obj_set_style_border_width(b, 0, 0);
            lv_obj_set_style_shadow_width(b, 0, 0);
            lv_obj_set_style_bg_opa(b, LV_OPA_COVER, 0);
            lv_obj_set_style_bg_color(b, col(1), LV_STATE_DEFAULT);
            lv_obj_set_style_bg_color(b, col(2), LV_STATE_PRESSED);
            lv_obj_set_style_bg_color(b, col(20), LV_STATE_CHECKED);
            lv_obj_set_style_bg_color(b, col(20), (lv_style_selector_t) (LV_STATE_CHECKED | LV_STATE_PRESSED));
            // 0: hoesje, 1: muzieknoot als er (nog) geen hoesje is, 2: naam
            lv_obj_t *im = lv_image_create(b);
            lv_obj_align(im, LV_ALIGN_LEFT_MID, 0, 0);
            lv_obj_remove_flag(im, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_t *ic = lv_label_create(b);
            lv_obj_set_style_text_font(ic, ficon, 0);
            lv_obj_set_style_text_color(ic, col(4), 0);
            lv_label_set_text(ic, "${mdi_music}");
            lv_obj_align(ic, LV_ALIGN_LEFT_MID, 13, 0);
            if (keep[k] != nullptr) {
              lv_image_set_src(im, keep[k]);
              lv_obj_add_flag(ic, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(im, LV_OBJ_FLAG_HIDDEN);
            }
            lv_obj_t *lb = lv_label_create(b);
            lv_obj_set_style_text_font(lb, fmono, 0);
            lv_obj_set_style_text_color(lb, col(3), 0);
            lv_obj_set_width(lb, 148);
            lv_label_set_long_mode(lb, LV_LABEL_LONG_WRAP);
            lv_label_set_text(lb, nm.c_str());
            lv_obj_align(lb, LV_ALIGN_LEFT_MID, 66, 0);
            lv_obj_add_event_cb(b, [](lv_event_t *e) {
              id(fav_click) = (int) (intptr_t) lv_event_get_user_data(e);
              id(fav_tap).execute();
            }, LV_EVENT_SHORT_CLICKED, (void *) (intptr_t) k);
            id(fav_btns).push_back(b);
          }
          nw.clear();
          ESP_LOGI("fav", "%u favorieten op het scherm", (unsigned) cnt);
      - script.execute: fav_mark
      - script.execute: fav_art_kick

  # ---- favorieten: volgende hoes ophalen (via de gedeelde download-wachtrij)
  - id: fav_art_kick
    then:
      - lambda: |-
          if (id(qimg_pending) & ((1u << 29) | (1u << 30))) return;
          if (id(qimg_busy) && (id(qimg_cur) == 29 || id(qimg_cur) == 30)) return;
          for (size_t i = 0; i < id(fav_btns).size(); i++) {
            if (id(fav_dsc)[i] != nullptr || id(fav_urls)[i].empty()) continue;
            const std::string &u = id(fav_urls)[i];
            id(fav_live_url) = u;
            if (u.rfind("${ma_url}", 0) == 0) {
              id(favart_ma)->set_url(u);
              id(qimg_pending) |= (1u << 29);
            } else {
              id(favart_ext)->set_url(u);
              id(qimg_pending) |= (1u << 30);
            }
            id(qimg_next).execute();
            return;
          }

  # ---- favorieten: hoes binnen (src 0/1) of mislukt (-1)
  - id: fav_art_done
    mode: queued
    parameters:
      src: int
    then:
      - lambda: |-
          std::string u = id(fav_live_url);
          id(fav_live_url) = "";
          online_image::OnlineImage *img = src == 1 ? id(favart_ext) : id(favart_ma);
          const lv_image_dsc_t *sd = src >= 0 ? img->get_lv_image_dsc() : nullptr;
          bool ok = sd != nullptr && sd->data != nullptr && sd->header.cf == LV_COLOR_FORMAT_RGB565 && sd->header.w > 0 && sd->header.h > 0;
          for (size_t i = 0; i < id(fav_btns).size(); i++) {
            if (id(fav_dsc)[i] != nullptr || id(fav_urls)[i] != u || u.empty()) continue;
            if (!ok) { id(fav_urls)[i] = ""; continue; }   // mislukt: muzieknoot laten staan
            int w = sd->header.w, h = sd->header.h;
            int st = sd->header.stride ? sd->header.stride : w * 2;
            uint8_t *buf = (uint8_t *) heap_caps_malloc(w * h * 2, MALLOC_CAP_SPIRAM);
            if (buf == nullptr) { id(fav_urls)[i] = ""; continue; }
            for (int y = 0; y < h; y++) memcpy(buf + y * w * 2, sd->data + y * st, w * 2);
            auto *d = new lv_image_dsc_t();
            memset(d, 0, sizeof(*d));
            d->header.magic = LV_IMAGE_HEADER_MAGIC;
            d->header.cf = LV_COLOR_FORMAT_RGB565;
            d->header.w = w;
            d->header.h = h;
            d->header.stride = w * 2;
            d->data = buf;
            d->data_size = w * h * 2;
            id(fav_dsc)[i] = d;
            lv_obj_t *b = id(fav_btns)[i];
            lv_obj_t *im = lv_obj_get_child(b, 0);
            lv_image_set_src(im, d);
            lv_obj_remove_flag(im, LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(lv_obj_get_child(b, 1), LV_OBJ_FLAG_HIDDEN);
          }
          if (src >= 0) img->release();
      # niet binnen de download-callback van hetzelfde plaatje een nieuwe download starten
      - delay: 100ms
      - script.execute: fav_art_kick
      - script.execute: qimg_next

  # ---- favorieten: getikt (nog een keer tikken op de gekozen tegel = pauze)
  - id: fav_tap
    then:
      - lambda: |-
          int i = id(fav_click);
          id(fav_act) = 0;
          if (i < 0 || i >= (int) id(fav_uris).size()) return;
          const std::string &u = id(fav_uris)[i];
          if (u == id(fav_sel)) { id(fav_act) = 1; return; }
          id(fav_sel) = u;
          id(fav_act) = (u.find("://playlist/") != std::string::npos) ? 3 : 2;
      - script.execute: fav_mark
      - if:
          condition:
            lambda: 'return id(fav_act) == 1;'
          then:
            - homeassistant.action:
                action: media_player.media_play_pause
                data:
                  entity_id: media_player.kijkpaal_woonkamer
      - if:
          condition:
            lambda: 'return id(fav_act) == 3;'
          then:
            # playlists altijd in willekeurige volgorde starten
            - homeassistant.action:
                action: media_player.shuffle_set
                data:
                  entity_id: media_player.kijkpaal_woonkamer
                  shuffle: "true"
      - if:
          condition:
            lambda: 'return id(fav_act) >= 2;'
          then:
            - homeassistant.action:
                action: music_assistant.play_media
                data:
                  entity_id: media_player.kijkpaal_woonkamer
                  media_id: !lambda 'return id(fav_sel);'
                  media_type: !lambda 'return std::string(id(fav_act) == 3 ? "playlist" : "radio");'
                  enqueue: replace

  # favorieten: gekozen tegel blijft gemarkeerd
  - id: fav_mark
    then:
      - lambda: |-
          std::string t;
          for (size_t i = 0; i < id(fav_btns).size(); i++) {
            if (id(fav_uris)[i] == id(fav_sel)) {
              lv_obj_add_state(id(fav_btns)[i], LV_STATE_CHECKED);
              t = "NU: " + id(fav_names)[i];
            } else {
              lv_obj_remove_state(id(fav_btns)[i], LV_STATE_CHECKED);
            }
          }
          lv_label_set_text(id(r_fav_now), t.c_str());
  - id: bell_hide
    then:
      - lambda: |-
          id(bell_active) = false;
          // deurbelfoto (345 KB) weer vrijgeven
          lv_obj_add_flag(id(bell_view), LV_OBJ_FLAG_HIDDEN);
          id(cam_img)->release();
      - lvgl.page.show:
