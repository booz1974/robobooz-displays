            x: 18
            y: 42
            text: "KACHEL"
            text_font: r_title
            text_color: 0x2B2F36
        - label:
            id: pc_state
            x: 20
            y: 84
            text: ""
            text_font: pl_t16
            text_color: ${c_sub}
