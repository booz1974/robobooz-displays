text_sensor:
  # ---- intercom
  - platform: homeassistant
    id: ic_log
    entity_id: input_text.intercom_log
    internal: true
    on_value:
      - lambda: |-
          // "HH:MM|kanaal|duur in s|tekst"
          const std::string &v = x;
          size_t a = v.find('|'), b = a == std::string::npos ? a : v.find('|', a + 1);
          size_t c = b == std::string::npos ? b : v.find('|', b + 1);
          if (c == std::string::npos) return;
          // ElevenLabs-audiotags ([WHISPERS], [LAUGHS], ...) nooit tonen
          std::string txt, raw = v.substr(c + 1);
          bool tag = false;
          for (char ch : raw) {
            if (ch == '[') { tag = true; continue; }
            if (ch == ']') { tag = false; continue; }
            if (tag) continue;
            if (ch == ' ' && !txt.empty() && txt.back() == ' ') continue;
            txt += ch;
          }
          std::string line = v.substr(0, a) + "  K" + v.substr(a + 1, b - a - 1) + "  " + txt;
          if (line == id(ic_l0)) return;
          id(ic_l1) = id(ic_l0); id(ic_l0) = line;
          id(ic_dur) = std::max(3, std::min(30, atoi(v.substr(b + 1, c - b - 1).c_str())));
          if (id(ic_t0)) id(ic_reply) = millis();
      - script.execute: r_ic_render
  # script.intercom_zend: "on" zolang er gezonden wordt (ruis + bericht + ruis)
  - platform: homeassistant
    id: ic_run
    entity_id: script.intercom_zend
    internal: true
  # ---- serverkamer
  - platform: homeassistant
    id: srv_info
    entity_id: input_text.server_info_display
    internal: true
    on_value:
      - script.execute: r_srv_render
  - platform: homeassistant
    id: srv_hc
    entity_id: input_text.server_hist_cpu
    internal: true
    on_value:
      - script.execute: r_srv_render
  - platform: homeassistant
    id: srv_ht
    entity_id: input_text.server_hist_temp
    internal: true
    on_value:
      - script.execute: r_srv_render
  # ROBOBOOZ-commentaar (AI) voor de LIVE-balk
  - platform: homeassistant
    id: ai_roast
    entity_id: input_text.display_roast
    internal: true
    on_value:
      - script.execute: r_ticker
  # regen komende 2 uur: "VVV|HH:MM VVV|HH:MM ..." per 5 minuten (Neerslag-app, bron Buienradar)
  - platform: homeassistant
    id: wx_regen
    entity_id: sensor.neerslag_buienradar_regen_data
    attribute: data
    internal: true
    on_value:
      - script.execute: r_regen_render
  # nieuws voor het klokvak (automatisering 'Displays - NOS-nieuws bijwerken')
  - platform: homeassistant
    id: ha_nieuws
    entity_id: input_text.nieuws_display
    internal: true
    on_value:
      - lambda: |-
          lv_obj_t *nl[] = {id(r_news0), id(r_news1), id(r_news2)};
          std::string v = x; size_t a = 0;
          for (int k = 0; k < 3; k++) {
            std::string part;
            if (a != std::string::npos && a <= v.size()) {
              size_t b = v.find('|', a);
              part = v.substr(a, b == std::string::npos ? std::string::npos : b - a);
              a = (b == std::string::npos) ? std::string::npos : b + 1;
            }
            if (part == "unknown" || part == "unavailable") part = "";
            lv_obj_set_style_anim_duration(nl[k], std::max<uint32_t>(4000, (uint32_t) (part.size() * 7.2f / 26.0f * 1000.0f)), 0);
            lv_label_set_text(nl[k], part.c_str());
          }
  # RETRO: thema-keuze (input_select.display_thema)
  - platform: homeassistant
    id: ha_thema
    entity_id: input_select.display_thema
    internal: true
    on_value:
      - lambda: |-
          int t = -1;
          if (!x.empty()) { char c = x[0]; if (c >= 'A' && c <= 'H') t = c - 'A'; }
          return;   // display Jip volgt input_select.display_thema niet (eigen thema, standaard RACE)
          if (t < 0 || t == id(theme_idx)) return;
          id(theme_idx) = t;
          id(r_theme_mark).execute();
          id(night_switch).execute();
  # speelt de kijkpaal? (alleen dan automatisch naar het muziekscherm)
  - platform: homeassistant
    id: studio_mini_state
    entity_id: media_player.kijkpaal_woonkamer
    internal: true
  # kleur van de lamp(scène) -> kleur van de helderheidsbalk op de lampenpagina
  - platform: homeassistant
    id: lt_all_rgb
    entity_id: light.slaapkamer_jip_2
    attribute: rgb_color
    internal: true
  - platform: homeassistant
    id: lt_eettafel_rgb
    entity_id: light.slaapkamer_jip
    attribute: rgb_color
    internal: true
  - platform: homeassistant
    id: lt_keuken_rgb
    entity_id: light.lichtstrip_jip
    attribute: rgb_color
    internal: true
  - platform: homeassistant
    id: lt_buro_rgb
    entity_id: light.hue_color_light_1
    attribute: rgb_color
    internal: true
  # goedemorgen-scherm (automatisering "Ochtendinfo voor displays bijwerken")
  - platform: homeassistant
    id: am_agenda
    entity_id: input_text.ochtend_agenda_display
    internal: true
    on_value:
      - script.execute: am_render
  - platform: homeassistant
    id: am_info
    entity_id: input_text.ochtend_info_display
    internal: true
    on_value:
      - script.execute: am_render
  # weerpagina: verwachting per uur en per dag (gevuld door de automatisering "Weer voor displays bijwerken")
  - platform: homeassistant
    id: wx_hours
    entity_id: input_text.weer_uren_display
    internal: true
    on_value:
      - script.execute: r_weer_render
  - platform: homeassistant
    id: wx_days
    entity_id: input_text.weer_dagen_display
    internal: true
    on_value:
      - script.execute: r_weer_render
  # welke app staat er open op de tv (Android TV Remote)
  - platform: homeassistant
    id: pers_1
    entity_id: ${persoon_1_entity}
    internal: true
    on_value:
      - script.execute: people_render
  - platform: homeassistant
    id: pers_2
    entity_id: ${persoon_2_entity}
    internal: true
    on_value:
      - script.execute: people_render
  - platform: homeassistant
    id: pers_3
    entity_id: ${persoon_3_entity}
    internal: true
    on_value:
      - script.execute: people_render
  - platform: homeassistant
    id: sun_state
    entity_id: sun.sun
    internal: true
    on_value:
      then:
        - lambda: |-
            // RETRO: geen dag/nacht-wissel; het thema bepaalt de kleuren
            return;
  - platform: homeassistant
    id: cam_pic
    entity_id: camera.voordeur
    attribute: entity_picture
    internal: true
  # Eufy-snapshot bij aanbellen (image-entiteit): URL en tijdstempel
  - platform: homeassistant
    id: ev_pic
    entity_id: image.voordeur_event_image
    attribute: entity_picture
    internal: true
  - platform: homeassistant
    id: ev_state
    entity_id: image.voordeur_event_image
    internal: true
  - platform: homeassistant
    id: info_weather
    entity_id: weather.de_scholekster
    internal: true
    on_value:
      - script.execute: weather_render
      - script.execute: r_weer_render

lvgl:
  id: lvgl_main
  buffer_size: 25%     # standaard 100% (450 KB); in 4 stukken tekenen scheelt ~340 KB PSRAM
  style_definitions:
    - id: pl_page
      bg_color: ${c_bg}
      bg_opa: COVER
      pad_all: 0
      text_color: ${c_text}
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  page_wrap: true
  theme:
    obj:
      border_width: 0
      scrollable: false
      pad_all: 0
      bg_opa: TRANSP
      radius: 0
    label:
      text_color: ${c_text}
    button:
      shadow_width: 0
      border_width: 0
  on_idle:
    - timeout: 1min
      then:
        - if:
            condition:
              lambda: 'return !id(page_nacht)->is_showing() && !id(onair).state;'
            then:
              - light.turn_on:
                  id: display_backlight
                  brightness: 65%
    - timeout: 2min
      then:
        - if:
            condition:
              lambda: 'return !id(page_nacht)->is_showing() && !id(onair).state;'
            then:
              - light.turn_on:
                  id: display_backlight
                  brightness: 35%
    - timeout: 30min
      then:
        - if:
            condition:
              lambda: 'return !id(page_nacht)->is_showing() && !id(mp_any) && !id(bell_active) && !id(onair).state;'
            then:
              - lvgl.page.show:
                  id: page_nacht
                  animation: FADE_IN
                  time: 600ms
