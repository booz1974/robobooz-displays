            int cx = 66 + g * 102, cy = 198, R = 40;
            const int seg[3][2] = {{180, 306}, {306, 342}, {342, 360}};
            const uint32_t sc[3] = {0x245C48, 0xE8745C, 0xE5534B};
            // schaalboog als polylijn (geen lv_arc nodig)
            static lv_point_precise_t bo[3][3][24];
            for (int z = 0; z < 3; z++) {
              int a0 = seg[z][0], a1 = seg[z][1], np = 0;
              int rr = z == 0 ? R - 1 : R - 2;
              for (int a = a0; np < 24; a += 6) {
                if (a > a1) a = a1;
                float an = a * 3.14159265f / 180.0f;
                bo[g][z][np++] = {(lv_value_precise_t) lroundf(cx + rr * cosf(an)), (lv_value_precise_t) lroundf(cy + rr * sinf(an))};
                if (a == a1) break;
              }
              lv_obj_t *a = lv_line_create(pg);
              lv_line_set_points(a, bo[g][z], np);
              lv_obj_set_style_line_width(a, z == 0 ? 2 : 4, 0);
              lv_obj_set_style_line_color(a, z == 0 ? col(19, sc[0]) : (z == 1 ? col(20, sc[1]) : lv_color_hex(sc[2])), 0);
              lv_obj_remove_flag(a, LV_OBJ_FLAG_CLICKABLE);
            }
            for (int k = 0; k <= 10; k++) {
              float an = (180 - k * 18) * 3.14159265f / 180.0f;
              int r2 = R - (k % 5 == 0 ? 11 : 7);
              tick[g][k][0] = {(lv_value_precise_t) (cx + (R - 3) * cosf(an)), (lv_value_precise_t) (cy - (R - 3) * sinf(an))};
              tick[g][k][1] = {(lv_value_precise_t) (cx + r2 * cosf(an)), (lv_value_precise_t) (cy - r2 * sinf(an))};
              lv_obj_t *l = lv_line_create(pg);
              lv_line_set_points(l, tick[g][k], 2);
              lv_obj_set_style_line_width(l, 2, 0);
              lv_obj_set_style_line_color(l, k < 7 ? col(19, 0x245C48) : (k < 9 ? col(20, 0xE8745C) : lv_color_hex(0xE5534B)), 0);
            }
            lv_obj_t *nd = lv_line_create(pg);
            lv_obj_set_style_line_width(nd, 3, 0);
            lv_obj_set_style_line_rounded(nd, true, 0);
            lv_obj_set_style_line_color(nd, col(3, 0x2B2F36), 0);
            id(srv_needle)[g] = nd;
            lv_obj_t *dot = lv_obj_create(pg);
            lv_obj_set_size(dot, 10, 10); lv_obj_set_pos(dot, cx - 5, cy - 5);
            lv_obj_set_style_radius(dot, 5, 0); lv_obj_set_style_border_width(dot, 0, 0);
            lv_obj_set_style_bg_opa(dot, LV_OPA_COVER, 0); lv_obj_set_style_bg_color(dot, col(20, 0xE8745C), 0);
            lv_obj_remove_flag(dot, LV_OBJ_FLAG_CLICKABLE);
          }
          // raster van de grafiek
          static lv_point_precise_t gr[15][2];
          int n = 0;
          for (int x = 28; x <= 452 && n < 9; x += 53, n++) { gr[n][0] = {(lv_value_precise_t) x, 274}; gr[n][1] = {(lv_value_precise_t) x, 344}; }
          for (int y = 274; y <= 344 && n < 15; y += 14, n++) { gr[n][0] = {28, (lv_value_precise_t) y}; gr[n][1] = {452, (lv_value_precise_t) y}; }
          for (int k = 0; k < n; k++) {
            lv_obj_t *l = lv_line_create(pg);
            lv_line_set_points(l, gr[k], 2);
            lv_obj_set_style_line_width(l, 1, 0);
            lv_obj_set_style_line_color(l, col(19, 0x245C48), 0);
          }
          for (int t = 0; t < 2; t++) {
            lv_obj_t *l = lv_line_create(pg);
            lv_obj_set_style_line_width(l, 2, 0);
            lv_obj_set_style_line_rounded(l, true, 0);
            lv_obj_set_style_line_color(l, t == 0 ? lv_color_hex(0x5E9BE0) : col(20, 0xE8745C), 0);
            id(srv_trace)[t] = l;
          }
          // terminal en titel boven de grafieklijnen houden
          lv_obj_move_foreground(id(srv_term));
          lv_obj_move_foreground(id(srv_v0)); lv_obj_move_foreground(id(srv_v1));
          lv_obj_move_foreground(id(srv_prompt)); lv_obj_move_foreground(id(srv_cur));
      - script.execute: r_srv_render

