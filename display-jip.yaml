              - label:
                  id: pc_badge_lbl
                  align: CENTER
                  text: "–"
                  text_font: pl_t30
                  text_color: 0xFFFFFE
        # aan: paneel aan met timer (script.paneel_jip_timer_starten)
        - button:
            id: pc_on_btn
            x: 12
            y: 118
            width: 456
            height: 104
            radius: 14
            pad_all: 18
            bg_color: ${c_tile}
            shadow_ofs_y: 6
            border_width: 0
            pressed:
              bg_color: ${c_tile_on}
            widgets:
              - label:
                  align: LEFT_MID
                  text: "${mdi_power}"
                  text_font: pl_icon72
                  text_color: ${c_accent}
              - label:
                  align: LEFT_MID
                  x: 96
                  y: -16
                  text: "Kachel aan"
                  text_font: pl_t30
                  text_color: ${c_text}
              - label:
                  id: pc_on_hint
                  align: LEFT_MID
                  x: 96
                  y: 22
                  text: "PANEEL AAN MET TIMER"
                  text_font: r_mono
                  text_color: 0x8B9099
              # rechts: knop met kamertemperatuur (groot) en gewenst (klein); tik = temperatuur aanpassen
              - button:
                  id: pc_t_btn
                  align: RIGHT_MID
                  x: 6
                  width: 124
                  height: 84
                  radius: 12
                  pad_all: 0
                  bg_color: 0xDDE0E5   # themakleur (wordt donker in een donker thema)
                  shadow_opa: TRANSP
                  border_width: 2
                  border_color: ${c_accent}
                  pressed:
                    bg_color: ${c_tile_on}
                  widgets:
                    - label:
                        id: pc_t_nu
                        align: CENTER
                        y: -12
                        text: "–°"
                        text_font: pl_t30
                        text_color: ${c_text}
                    - label:
                        id: pc_t_set
                        align: CENTER
                        y: 22
                        text: "GEWENST –°"
                        text_font: r_mono
                        text_color: 0x8B9099
                  on_click:
                    - lambda: |-
                        float t = id(pc_set_temp).state;
                        id(pc_tw) = std::isnan(t) ? 20 : (int) lroundf(t);
                    - script.execute: pc_tw_render
                    - lvgl.widget.show: pc_temp
            # eerst kiezen hoe lang: 15, 30 of 60 minuten (keuzevenster pc_keuze)
            on_click:
              - lvgl.widget.show: pc_keuze
        # uit: kachel uit met één tik (script.paneel_jip_uit)
        - button:
            id: pc_off_btn
            x: 12
            y: 232
            width: 456
            height: 104
            radius: 14
            pad_all: 18
            bg_color: ${c_tile}
            shadow_ofs_y: 6
            border_width: 0
