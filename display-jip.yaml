  # @zon-begin
  - id: zs_render
    then:
      - lambda: |-
          float pv = id(zs_pv).has_state() && !std::isnan(id(zs_pv).state) ? std::max(0.0f, id(zs_pv).state) : 0.0f;
          float grid = id(zs_grid).has_state() && !std::isnan(id(zs_grid).state) ? id(zs_grid).state : 0.0f;
          float huis = std::max(0.0f, pv + grid);
          // getal en eenheid apart (groot getal, kleine eenheid)
          auto put = [](lv_obj_t *v, lv_obj_t *u, float w) {
            char b[16]; float a = fabsf(w);
            if (a >= 1000.0f) { snprintf(b, sizeof(b), "%.1f", a / 1000.0f); for (char *c = b; *c; c++) if (*c == '.') *c = ','; lv_label_set_text(u, "kW"); }
            else { snprintf(b, sizeof(b), "%d", (int) lroundf(a)); lv_label_set_text(u, "W"); }
            lv_label_set_text(v, b);
          };
          auto fmt = [](float w) {
            char b[20]; float a = fabsf(w);
            if (a >= 1000.0f) { snprintf(b, sizeof(b), "%.1f kW", a / 1000.0f); for (char *c = b; *c; c++) if (*c == '.') *c = ','; }
            else snprintf(b, sizeof(b), "%d W", (int) lroundf(a));
            return std::string(b);
          };
          put(id(zs_zon_v), id(zs_zon_u), pv);
          put(id(zs_huis_v), id(zs_huis_u), huis);
          put(id(zs_net_v), id(zs_net_u), grid);
          bool terug = grid < -20.0f, van = grid > 20.0f;
          lv_label_set_text(id(zs_net_t), terug ? "Teruglevering" : (van ? "Van het net" : "Net"));
          // nettegel groen bij teruglevering
          lv_obj_set_style_bg_color(id(zs_net_tile), lv_color_hex(terug ? ${c_tile_on} : ${c_tile}), 0);
          lv_obj_set_style_text_color(id(zs_net_v), lv_color_hex(terug ? ${c_dark} : ${c_text}), 0);
          lv_obj_set_style_text_color(id(zs_net_t), lv_color_hex(terug ? ${c_dark} : ${c_sub}), 0);
          lv_obj_set_style_text_color(id(zs_net_u), lv_color_hex(terug ? ${c_dark} : ${c_sub}), 0);
          // statuspil
          lv_label_set_text(id(zs_pill_lbl), terug ? "Teruglevering" : (van ? "Van het net" : "In balans"));
          lv_obj_set_style_bg_color(id(zs_pill), lv_color_hex(terug ? ${c_tile_on} : 0xDDE2E8), 0);
          lv_obj_set_style_text_color(id(zs_pill_lbl), lv_color_hex(terug ? ${c_dark} : 0x5A6270), 0);
          // stromen (W) voor de bewegende bolletjes: zon->huis, zon->net, net->huis
          id(zs_flow)[0] = std::min(pv, huis);
          id(zs_flow)[1] = std::max(0.0f, -grid);
          id(zs_flow)[2] = std::max(0.0f, grid);
          // goed moment om te wassen: minstens ${zs_was_w} W teruglevering
          bool was = grid <= -${zs_was_w};
          lv_obj_t *fr = id(zs_frame);
          if (was) {
            lv_obj_set_style_border_side(fr, LV_BORDER_SIDE_FULL, 0); lv_obj_set_style_border_width(fr, 3, 0);
            lv_obj_set_style_border_color(fr, lv_color_hex(0x2EB872), 0);
            lv_obj_set_style_border_width(fr, 3, 0);
            lv_obj_set_style_border_opa(fr, LV_OPA_COVER, 0);
            lv_obj_set_style_shadow_color(fr, lv_color_hex(0x2EB872), 0);
            lv_obj_set_style_shadow_opa(fr, 110, 0);
            lv_obj_set_style_shadow_offset_x(fr, 0, 0);
            lv_obj_set_style_shadow_offset_y(fr, 0, 0);
            lv_obj_set_style_shadow_width(fr, 28, 0);
            lv_obj_set_style_bg_color(id(zs_bar), lv_color_hex(0x2EB872), 0);
            lv_obj_set_style_text_color(id(zs_status), lv_color_hex(id(r_tcol)[8]), 0);
            lv_obj_remove_flag(id(zs_wash), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(zs_status), "Goed moment om te wassen");
          } else {
            lv_obj_set_style_border_side(fr, (lv_border_side_t) (LV_BORDER_SIDE_TOP | LV_BORDER_SIDE_LEFT), 0);
            lv_obj_set_style_border_width(fr, 0, 0);
            lv_obj_set_style_border_width(fr, 2, 0);
            lv_obj_set_style_border_opa(fr, 230, 0);
            lv_obj_set_style_shadow_color(fr, lv_color_hex(id(r_tcol)[7]), 0);
            lv_obj_set_style_shadow_opa(fr, 115, 0);
            lv_obj_set_style_shadow_offset_x(fr, 6, 0);
            lv_obj_set_style_shadow_offset_y(fr, 6, 0);
            lv_obj_set_style_shadow_width(fr, 22, 0);
            lv_obj_set_style_bg_color(id(zs_bar), lv_color_hex(id(r_tcol)[1]), 0);
            lv_obj_set_style_text_color(id(zs_status), lv_color_hex(terug ? 0x2E8B65 : ${c_sub}), 0);
            lv_obj_add_flag(id(zs_wash), LV_OBJ_FLAG_HIDDEN);
            std::string st = terug ? "Je levert " + fmt(-grid) + " terug" : (van ? "Je haalt " + fmt(grid) + " van het net" : "Zon en verbruik in balans");
            lv_label_set_text(id(zs_status), st.c_str());
          }
