  # na 2 minuten niets aanraken: het juiste rustscherm kiezen
  #   NIET STOREN > muziek > nachtstand (23-06, niet als er lampen aan zijn) > goedemorgen (06:30-09:30) > thuispagina
  - interval: 5s
    then:
      - lambda: |-
          static uint32_t last_play = 0;
          bool kijkpaal_speelt = id(studio_mini_state).has_state() && id(studio_mini_state).state == "playing";
          if (kijkpaal_speelt) last_play = millis();
          if (id(bell_active)) return;
          if (lv_display_get_inactive_time(nullptr) < 120000) return;   // na 2 minuten niets aanraken
          auto show = [](esphome::lvgl::LvPageType *pg) {
            if (!pg->is_showing()) id(lvgl_main)->show_page(pg->index, LV_SCREEN_LOAD_ANIM_FADE_IN, 300);
          };
          auto t = id(system_time).now();
          int hm = t.is_valid() ? t.hour * 60 + t.minute : -1;
          // nachtstand 23:00-06:00, maar niet zolang er nog lampen aan zijn (muziek gaat hieronder al voor)
          bool lampen_aan = (id(lt_all_on).has_state() && id(lt_all_on).state) || (id(lt_buro_on).has_state() && id(lt_buro_on).state) || (id(lt_eettafel_on).has_state() && id(lt_eettafel_on).state) || (id(lt_keuken_on).has_state() && id(lt_keuken_on).state);
          bool nacht = hm >= 0 && (hm >= 23 * 60 || hm < 6 * 60) && !lampen_aan;
          bool ochtend = hm >= 6 * 60 + 30 && hm < 9 * 60 + 30;
          if (id(onair).state) { show(id(page_onair)); return; }
          if (kijkpaal_speelt) {
            if (!id(page_music)->is_showing() && !id(page_player)->is_showing()) show(id(page_music));
            return;
          }
          if (millis() - last_play < 30000) return;   // net gestopt: even laten staan
          if (nacht) {
            if (!id(page_nacht)->is_showing()) {
              if (id(lvgl_main)->is_paused()) id(lvgl_main)->set_paused(false, false);   // scherm sliep al: dimme klok aan
              show(id(page_nacht));
            }
            return;
          }
          if (ochtend) {
            if (!id(page_morgen)->is_showing()) {
              if (id(lvgl_main)->is_paused()) {
                id(lvgl_main)->set_paused(false, false);
                auto lc = id(display_backlight).turn_on(); lc.set_brightness(0.35f); lc.perform();
              }
              show(id(page_morgen));
            }
            return;
          }
          bool rust = id(page_music)->is_showing() || id(page_player)->is_showing() || id(page_nacht)->is_showing() || id(page_morgen)->is_showing();
          if (!rust) return;
          if (lv_display_get_inactive_time(nullptr) > 1800000) {
            // al 30 minuten niemand geweest: nachtstand (dimme klok)
            show(id(page_nacht));
            return;
          }
          show(id(page_rhome));   // thuispagina (retro)
