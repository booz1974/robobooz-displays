            if (y < 40) continue;   // kop, knoppen bovenin: laten staan
            if (title == nullptr && lv_obj_check_type(c, &lv_label_class)) {
              const lv_font_t *f = lv_obj_get_style_text_font(c, LV_PART_MAIN);
              if (f && f->line_height >= 30) title = c;
            }
            lv_anim_t a; lv_anim_init(&a); lv_anim_set_var(&a, c);
            lv_anim_set_values(&a, 26, 0); lv_anim_set_duration(&a, 300); lv_anim_set_delay(&a, std::min(step, 9) * 35);
            lv_anim_set_exec_cb(&a, [](void *o, int32_t v) { lv_obj_set_style_translate_y((lv_obj_t *) o, v, 0); });
