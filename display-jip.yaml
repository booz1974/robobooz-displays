  - id: ma_cmd
    mode: queued
    parameters:
      cmd: string
      idx: int
    then:
      - http_request.post:
          url: "${ma_url}/api"
          request_headers:
            Content-Type: application/json
            Authorization: "Bearer ${ma_token}"
          body: !lambda |-
            std::string pid;
            switch (idx) {
              case 0: pid = id(ma_pid_0); break;
              case 1: pid = id(ma_pid_1); break;
              case 2: pid = id(ma_pid_2); break;
              case 3: pid = id(ma_pid_3); break;
              case 4: pid = id(ma_pid_4); break;
              case 5: pid = id(ma_pid_5); break;
            }
            return std::string("{\"message_id\": \"2\", \"command\": \"players/cmd/") + cmd +
                   "\", \"args\": {\"player_id\": \"" + pid + "\"}}";
          on_response:
            then:
              - delay: 400ms
              - script.execute: ma_poll

  # ---- volume van de speler op het schermvullende muziekscherm
  - id: ma_vol_set
    mode: restart
    parameters:
      lvl: int
    then:
      - delay: 150ms
      - if:
          condition:
            # Yamaha (speler "woonkamer"): volume op de receiver zelf zetten
            lambda: 'return strcasecmp(lv_label_get_text(id(mp_big_name)), "woonkamer") == 0;'
          then:
            - homeassistant.action:
                action: media_player.volume_set
                data:
                  entity_id: media_player.yamaha_receiver_woonkamer
                  volume_level: !lambda 'return lvl / 100.0f;'
          else:
            - http_request.post:
                url: "${ma_url}/api"
                request_headers:
                  Content-Type: application/json
                  Authorization: "Bearer ${ma_token}"
                body: !lambda |-
                  std::string pids[] = {id(ma_pid_0), id(ma_pid_1), id(ma_pid_2), id(ma_pid_3), id(ma_pid_4), id(ma_pid_5)};
                  int i = id(mp_view);
                  std::string pid = (i >= 0 && i <= 5) ? pids[i] : "";
                  switch (i) {
                    case 0: id(ma_vol_0) = lvl; break;
                    case 1: id(ma_vol_1) = lvl; break;
                    case 2: id(ma_vol_2) = lvl; break;
                    case 3: id(ma_vol_3) = lvl; break;
                    case 4: id(ma_vol_4) = lvl; break;
                    case 5: id(ma_vol_5) = lvl; break;
                  }
                  return std::string("{\"message_id\": \"6\", \"command\": \"players/cmd/volume_set\", \"args\": {\"player_id\": \"") +
                         pid + "\", \"volume_level\": " + std::to_string(lvl) + "}}";

  # ---- lichttegels: vegen in een tegel = dimmen
  # naar rechts = feller, naar links = zachter, helemaal naar links = uit.
  # idx: 0 = Alles (light.slaapkamer_jip_2), 1 = Lamp, 2 = Ledstrip, 3 = Vitrine
  # vulling in de tegel tonen (v = 0..255)
  # vulling gelijkzetten met Home Assistant (niet tijdens het vegen)
  # na het loslaten: nieuwe helderheid naar Home Assistant sturen

  # ---- sfeertegels: vegen in een tegel = dimmen van de lampen van die scène
  # idx: 0 Helder, 1 Gedimd, 2 Oranje, 3 Lezen, 4 Concentreren, 5 Jip blauw
  - id: sc_drag
    parameters:
      idx: int
      phase: int    # 0 = aanraken, 1 = slepen, 2 = loslaten
    then:
      - lambda: |-
          if (idx < 0 || idx > 5) return;
          lv_obj_t *bar[] = {id(sc_woonkamer_bar), id(sc_wk_eettafel_bar), id(sc_oranje_bar), id(sc_tafel_bar), id(sc_concentreren_bar), id(sc_fairfax_bar)};
          lv_obj_t *sub[] = {id(sc_woonkamer_sub), id(sc_wk_eettafel_sub), id(sc_oranje_sub), id(sc_tafel_sub), id(sc_concentreren_sub), id(sc_fairfax_sub)};
          if (phase == 2) {
            // loslaten: tegel weer normaal
            static const char *txt[] = {"Scène", "Scène", "Alle lampen", "Scène", "Scène", "Scène"};
            lv_obj_add_flag(bar[idx], LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(sub[idx], txt[idx]);
            return;
          }
          lv_indev_t *in = lv_indev_active();
          if (in == nullptr) return;
          lv_point_t p;
          lv_indev_get_point(in, &p);
          if (phase == 0) {
            id(dim_x0) = p.x;
            id(dim_dragged) = false;
            // beginwaarde: huidige helderheid van de woonkamer
            float b = id(lt_all_bri).state;
            id(dim_b0) = (id(lt_all_on).state && !std::isnan(b)) ? (int) b : 0;
            id(dim_val) = id(dim_b0);
            return;
          }
          int dx = p.x - id(dim_x0);
          if (!id(dim_dragged)) {
            if (abs(dx) < 12) return;   // een klein beetje bewegen is nog gewoon tikken
            id(dim_dragged) = true;
            id(dim_x0) = p.x;
            dx = 0;
          }
          // 200 px vegen = van uit naar vol
          int v = id(dim_b0) + dx * 255 / 200;
          if (v < 0) v = 0;
          if (v > 255) v = 255;
          id(dim_val) = v;
          if (v == 0) {
            lv_obj_add_flag(bar[idx], LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(sub[idx], "Uit");
          } else {
            lv_obj_set_width(bar[idx], std::max(4, 222 * v / 255));
            lv_obj_remove_flag(bar[idx], LV_OBJ_FLAG_HIDDEN);
            char b[20];
            snprintf(b, sizeof(b), "Licht %d%%", (int) (v / 2.55f + 0.5f));
            lv_label_set_text(sub[idx], b);
          }

  # na het loslaten: de lampen van die scène op de nieuwe helderheid zetten
  - id: sc_apply
    parameters:
      idx: int
    then:
      - if:
          condition:
            lambda: 'return id(dim_val) <= 0;'
          then:
            - homeassistant.action:
                action: light.turn_off
                data:
                  entity_id: !lambda |-
                    static const char *e[] = {"light.slaapkamer_jip_2", "light.slaapkamer_jip_2", "light.slaapkamer_jip_2", "light.slaapkamer_jip_2", "light.slaapkamer_jip_2", "light.slaapkamer_jip_2"};
                    return std::string(e[idx < 0 || idx > 5 ? 3 : idx]);
          else:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda |-
                    static const char *e[] = {"light.slaapkamer_jip_2", "light.slaapkamer_jip_2", "light.slaapkamer_jip_2", "light.slaapkamer_jip_2", "light.slaapkamer_jip_2", "light.slaapkamer_jip_2"};
                    return std::string(e[idx < 0 || idx > 5 ? 3 : idx]);
                  brightness: !lambda 'return id(dim_val);'

  - id: weather_render
    then:
      - lvgl.label.update:
          id: info_weather_val
          text: !lambda |-
            std::string c = id(info_weather).state;
            const char *pairs[][2] = {
              {"clear-night", "Helder"}, {"cloudy", "Bewolkt"}, {"fog", "Mist"}, {"hail", "Hagel"},
              {"lightning", "Onweer"}, {"lightning-rainy", "Onweer en regen"}, {"partlycloudy", "Half bewolkt"},
              {"pouring", "Stortregen"}, {"rainy", "Regen"}, {"snowy", "Sneeuw"}, {"snowy-rainy", "Natte sneeuw"},
              {"sunny", "Zonnig"}, {"windy", "Winderig"}, {"windy-variant", "Winderig"}, {"exceptional", "Uitzonderlijk"}};
            std::string txt = c;
            for (auto &pr : pairs) if (c == pr[0]) { txt = pr[1]; break; }
            float t = id(info_out_temp).state;
            if (!std::isnan(t)) {
              char b[16]; snprintf(b, sizeof(b), " · %.1f°", t);
              std::string tb(b); for (auto &ch : tb) if (ch == '.') ch = ',';
              txt += tb;
            }
            return txt;

interval:
  # @zon-begin
  # zonnestroom: bolletjes over de lijnen laten lopen (sneller bij meer vermogen)
  - interval: 50ms
    then:
      - lambda: |-
          if (!id(page_zon)->is_showing()) return;
          static const int P[3][4] = {{76, 104, 380, 104}, {76, 104, 228, 188}, {228, 188, 380, 104}};
          static float ph[3] = {0, 0, 0};
          lv_obj_t *o[3][3] = {{id(zs_a0), id(zs_a1), id(zs_a2)}, {id(zs_b0), id(zs_b1), id(zs_b2)}, {id(zs_c0), id(zs_c1), id(zs_c2)}};
          for (int k = 0; k < 3; k++) {
            float w = id(zs_flow)[k];
            bool on = w >= 20.0f;
            if (!on) { for (int i = 0; i < 3; i++) lv_obj_add_flag(o[k][i], LV_OBJ_FLAG_HIDDEN); continue; }
            ph[k] += std::min(0.004f + w * 0.000008f, 0.03f);
            if (ph[k] >= 1.0f) ph[k] -= 1.0f;
            float dx = P[k][2] - P[k][0], dy = P[k][3] - P[k][1];
            float len = sqrtf(dx * dx + dy * dy);
            float f0 = 40.0f / len, f1 = 1.0f - f0;   // alleen tussen de cirkels
            for (int i = 0; i < 3; i++) {
              float t = ph[k] + i / 3.0f; if (t >= 1.0f) t -= 1.0f;
              float f = f0 + (f1 - f0) * t;
              lv_obj_set_pos(o[k][i], (int) (P[k][0] + dx * f) - 5, (int) (P[k][1] + dy * f) - 7);
              lv_obj_remove_flag(o[k][i], LV_OBJ_FLAG_HIDDEN);
            }
          }
