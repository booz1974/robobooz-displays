            static const uint32_t cw[3] = {0xFF8C32, 0xFFC85A, 0xFF6E28}, cc[3] = {0xC8E1FF, 0x96C3FA, 0xE6F0FF};
            for (int k = 0; k < 12; k++) lv_obj_set_style_bg_color(p[k], lv_color_hex(warm ? cw[k % 3] : cc[k % 3]), 0);
            lv_label_set_text(id(r_binlbl), warm ? "KAMER · KACHEL AAN" : "KAMER · KACHEL UIT");
            lv_obj_set_style_text_color(id(r_binlbl), lv_color_hex(warm ? id(r_tcol)[20] : 0x96C3FA), 0);
          }
          for (int k = 0; k < 12; k++) {
            float v = 0.9f + (k % 4) * 0.35f;
            py[k] += warm ? -v : v * 0.7f;
            if (py[k] < -4) { py[k] = 126; lv_obj_set_x(p[k], 6 + (int) (random_uint32() % 124)); }
            if (py[k] > 130) { py[k] = -4; lv_obj_set_x(p[k], 6 + (int) (random_uint32() % 124)); }
            lv_obj_set_y(p[k], (int) py[k]);
