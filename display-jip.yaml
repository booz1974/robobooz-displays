  # RETRO 2: bij elke paginawissel tegels laten inschuiven, kop-streep laten groeien en de titel even laten glitchen
  - interval: 60ms
    then:
      - lambda: |-
          static lv_obj_t *last = nullptr;
          lv_obj_t *scr = lv_screen_active();
          if (scr == last) return;
          last = scr;
          if (scr == id(page_music)->obj || scr == id(page_bell)->obj || scr == id(page_nacht)->obj) return;
          uint32_t n = lv_obj_get_child_count(scr);
          if (n > 60) return;
          int step = 0;
          lv_obj_t *title = nullptr;
          for (uint32_t i = 0; i < n; i++) {
            lv_obj_t *c = lv_obj_get_child(scr, i);
            if (lv_obj_has_flag(c, LV_OBJ_FLAG_HIDDEN)) continue;
