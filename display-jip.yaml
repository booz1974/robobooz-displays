    resize: 222x84
  # animaties klimaatpagina: bestanden in /config/esphome/display/
  # (152x82, 24 frames; het display vergroot ze zelf 3x). Kleiner = veel minder geheugen:
  # alle frames staan in het PSRAM (228x124 kostte 2,7 MB, dit 1,2 MB)

  # groot hoesje voor het schermvullende muziekscherm
  - platform: online_image
    id: mp_big_img
    url: "${ma_url}/favicon.png"
    format: AUTO
    type: RGB565                # 115 KB; wordt daarna zelf 2x vergroot naar 480x480
    resize: 240x240
    update_interval: never
    request_headers:
      Authorization: "Bearer ${ma_token}"
    on_download_finished:
      then:
        - lambda: 'id(qimg_busy) = false;'
        - script.execute: qimg_next
        - if:
            condition:
              lambda: 'return id(page_player)->is_showing() || id(bell_active);'
            then:
              # inmiddels naar de spelerpagina of deurbel: direct weer vrijgeven
              - lambda: |-
                  id(mp_big_url) = "";
                  id(mp_big_img)->release();
            else:
              - lambda: |-
                  // Eenmalig zelf 2x vergroten (bilineair) naar een eigen 480x480 RGB565-buffer.
                  // LVGL hoeft dan niet bij elke hertekening opnieuw te schalen: dat maakte
                  // het schermvullende hoesscherm traag.
                  static const int DW = 210, DH = 210;   // hoes in een kader: zelf verkleinen (LVGL kan RGB565 niet schalen)
                  static uint16_t *buf = nullptr;
                  static lv_image_dsc_t dsc;
                  auto shown = [&]() {
                    lv_obj_remove_flag(id(mp_big), LV_OBJ_FLAG_HIDDEN);
                    lv_obj_add_flag(id(mp_big_icon), LV_OBJ_FLAG_HIDDEN);
                    id(mp_big_fails) = 0;
                  };
                  const lv_image_dsc_t *src = id(mp_big_img)->get_lv_image_dsc();
                  if (src == nullptr || src->data == nullptr || src->header.w < 1 || src->header.h < 1) {
                    // "klaar" maar zonder beeld: als fout behandelen, volgende ronde opnieuw
                    ESP_LOGW("hoes", "download klaar maar geen beelddata; opnieuw proberen");
                    id(mp_big_fails)++;
                    id(mp_big_retry_at) = millis() + (uint32_t) (id(mp_big_fails) < 3 ? 5000 : (id(mp_big_fails) < 6 ? 60000 : 300000));
                    id(mp_big_url) = "";
                    return;
                  }
                  if (buf == nullptr) {
                    buf = id(big_buf);   // bij het opstarten gereserveerd
                    memset(&dsc, 0, sizeof(dsc));
                    dsc.header.magic = LV_IMAGE_HEADER_MAGIC;
                    dsc.header.cf = LV_COLOR_FORMAT_RGB565;
                    dsc.header.w = DW;
                    dsc.header.h = DH;
                    dsc.header.stride = DW * 2;
                    dsc.data = (const uint8_t *) buf;
                    dsc.data_size = DW * DH * 2;
                  }
                  int bpp = 0;
                  if (src->header.cf == LV_COLOR_FORMAT_RGB565) bpp = 2;
                  else if (src->header.cf == LV_COLOR_FORMAT_RGB888) bpp = 3;
                  else if (src->header.cf == LV_COLOR_FORMAT_XRGB8888 || src->header.cf == LV_COLOR_FORMAT_ARGB8888) bpp = 4;
                  int SW = src->header.w, SH = src->header.h;
                  ESP_LOGI("hoes", "bron %dx%d cf=%d bpp=%d buf=%s (PSRAM vrij %u KB, grootste blok %u KB)", SW, SH, (int) src->header.cf, bpp, buf ? "ok" : "GEEN",
                           (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024), (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
                  if (buf == nullptr || bpp == 0) {
                    ESP_LOGW("hoes", "terugval op LVGL-schaling (traag)");
                    // onverwacht formaat: terugvallen op LVGL-schaling
                    lv_image_set_src(id(mp_big), src);
                    lv_image_set_antialias(id(mp_big), true);
                    lv_image_set_scale(id(mp_big), 256);
                    shown();
                    return;
                  }
                  int sstride = src->header.stride ? src->header.stride : SW * bpp;
                  const uint8_t *sp = src->data;
                  // c: 0 = blauw, 1 = groen, 2 = rood (8-bit)
                  auto px = [&](int x, int y, int c) -> int {
                    if (x >= SW) x = SW - 1;
                    if (y >= SH) y = SH - 1;
                    const uint8_t *q = sp + y * sstride + x * bpp;
                    if (bpp == 2) {
                      uint16_t v = q[0] | (q[1] << 8);
                      if (c == 0) return (v & 0x1F) << 3;
                      if (c == 1) return ((v >> 5) & 0x3F) << 2;
                      return (v >> 11) << 3;
                    }
                    return q[c];
                  };
                  auto pack = [](int r, int g, int b) -> uint16_t {
                    return (uint16_t) (((r >> 3) << 11) | ((g >> 2) << 5) | (b >> 3));
                  };
                  // niet-vierkante hoes: zwart eromheen, gecentreerd
                  int sc = std::max(SW, SH); int TW = SW * DW / sc, TH = SH * DH / sc; int ox = (DW - TW) / 2, oy = (DH - TH) / 2;
                  if (ox > 0 || oy > 0) memset(buf, 0, DW * DH * 2);
                  // verkleinen met middeling over het bronvlak (240 -> 210)
                  for (int y = 0; y < TH; y++) {
                    uint16_t *d0 = buf + (oy + y) * DW + ox;
                    int y0 = y * SH / TH, y1 = std::max(y0 + 1, (y + 1) * SH / TH);
                    for (int x = 0; x < TW; x++) {
                      int x0 = x * SW / TW, x1 = std::max(x0 + 1, (x + 1) * SW / TW);
                      int r = 0, g = 0, b = 0, n = 0;
                      for (int yy = y0; yy < y1; yy++) for (int xx = x0; xx < x1; xx++) { r += px(xx, yy, 2); g += px(xx, yy, 1); b += px(xx, yy, 0); n++; }
                      d0[x] = pack(r / n, g / n, b / n);
                    }
                  }
                  lv_image_set_scale(id(mp_big), 256);
                  lv_image_set_antialias(id(mp_big), false);
                  lv_image_set_src(id(mp_big), &dsc);
                  lv_obj_invalidate(id(mp_big));
                  // bron is gekopieerd: geheugen direct teruggeven
                  id(mp_big_img)->release();
                  shown();
                  ESP_LOGI("hoes", "verkleind naar 210x210");
    on_error:
      then:
        - lambda: |-
            id(qimg_busy) = false;
            id(mp_big_fails)++;
            id(mp_big_retry_at) = millis() + (uint32_t) (id(mp_big_fails) < 3 ? 5000 : (id(mp_big_fails) < 6 ? 60000 : 300000));   // art_backoff
            ESP_LOGW("hoes", "groot hoesje mislukt (poging %d): %s | intern vrij %u KB (blok %u KB), PSRAM vrij %u KB (blok %u KB)", id(mp_big_fails), id(mp_big_url).c_str(), (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024), (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024), (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024), (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
            id(mp_big_url) = "";   // volgende ronde opnieuw proberen (na de wachttijd)
        - script.execute: qimg_next
        - lvgl.widget.hide: mp_big
        - lvgl.widget.show: mp_big_icon

  - platform: online_image
    id: ma_img_0
    url: "${ma_url}/favicon.png"
    format: AUTO
