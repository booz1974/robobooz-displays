  # ---- goedemorgen-scherm vullen
  - id: am_render
    then:
      - lambda: |-
          auto split = [](const std::string &s, char d) {
            std::vector<std::string> o; size_t a = 0;
            while (true) { size_t b = s.find(d, a); o.push_back(s.substr(a, b == std::string::npos ? std::string::npos : b - a)); if (b == std::string::npos) break; a = b + 1; }
            return o;
          };
          // agenda
          lv_obj_t *ag[] = {id(am_ag_0), id(am_ag_1), id(am_ag_2), id(am_ag_3), id(am_ag_4)};
          std::vector<std::string> ev;
          if (id(am_agenda).has_state() && !id(am_agenda).state.empty() && id(am_agenda).state != "unknown") ev = split(id(am_agenda).state, ';');
          for (int k = 0; k < 5; k++) lv_label_set_text(ag[k], k < (int) ev.size() ? ev[k].c_str() : "");
          if (ev.empty()) lv_label_set_text(ag[0], "Geen afspraken vandaag");
          // weer, advies, afval
          if (!id(am_info).has_state()) return;
          auto f = split(id(am_info).state, '|');
          if (f.size() < 5) return;
          struct C { const char *k, *nl; const char *ico; uint32_t col; };
          static const C conds[] = {
            {"clear-night", "Helder", "${mdi_night}", 0x8E96A1}, {"cloudy", "Bewolkt", "${mdi_wx_cloudy}", 0x8E96A1},
            {"fog", "Mist", "${mdi_wx_fog}", 0x9AA0A6}, {"hail", "Hagel", "${mdi_wx_hail}", 0x6FA8DC},
            {"lightning", "Onweer", "${mdi_wx_lightning}", 0xE5A50A}, {"lightning-rainy", "Onweer en regen", "${mdi_wx_lrain}", 0xE5A50A},
            {"partlycloudy", "Half bewolkt", "${mdi_weather}", 0xE8A33B}, {"pouring", "Stortregen", "${mdi_wx_pouring}", 0x4A90D9},
            {"rainy", "Regen", "${mdi_rain}", 0x4A90D9}, {"snowy", "Sneeuw", "${mdi_wx_snowy}", 0x8FC1EE},
            {"snowy-rainy", "Natte sneeuw", "${mdi_wx_snowrain}", 0x8FC1EE}, {"sunny", "Zonnig", "${mdi_wx_sunny}", 0xF2A93B},
            {"windy", "Winderig", "${mdi_wx_windy}", 0x8E96A1}};
          const C *x = &conds[6];
          for (auto &c : conds) if (f[0] == c.k) x = &c;
          lv_label_set_text(id(am_wx_icon), x->ico);
          lv_obj_set_style_text_color(id(am_wx_icon), lv_color_hex(x->col), 0);
          lv_label_set_text(id(am_wx_cond), x->nl);
          lv_label_set_text(id(am_wx_temp), (f[1] + "° / " + f[2] + "°").c_str());
          lv_label_set_text(id(am_advies), f[3].c_str());
          bool nat = f[3].find("paraplu") != std::string::npos;
          lv_label_set_text(id(am_advies_ico), nat ? "${mdi_umbrella}" : "${mdi_coat}");
          lv_label_set_text(id(am_afval), f[4].empty() ? "Geen afval deze week" : f[4].c_str());
          // vandaag of morgen aan de straat: extra opvallend
          bool urgent = f[4].rfind("Vandaag", 0) == 0 || f[4].rfind("Morgen", 0) == 0;
          lv_obj_set_style_text_color(id(am_afval_ico), lv_color_hex(urgent ? 0xE5534B : ${c_sub}), 0);
  - id: am_clock
    then:
      - lambda: |-
          auto t = id(system_time).now();
          if (!t.is_valid()) return;
          char b[8]; snprintf(b, sizeof(b), "%02d:%02d", t.hour, t.minute);
          lv_label_set_text(id(am_clock_lbl), b);
          lv_label_set_text(id(nt_clock), b);
          static const char *mnd[] = {"januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"};
          static const char *dag[] = {"zondag", "maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag"};
          char d[48]; snprintf(d, sizeof(d), "%s %d %s", dag[(t.day_of_week + 6) % 7], t.day_of_month, mnd[t.month - 1]);
          lv_label_set_text(id(am_date), d);
          lv_label_set_text(id(nt_date), d);
          lv_label_set_text(id(am_hello), t.hour < 12 ? "Goedemorgen" : (t.hour < 18 ? "Goedemiddag" : "Goedenavond"));
