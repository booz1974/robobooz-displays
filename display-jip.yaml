    - id: page_pc
      # @nav-boven
      styles: pl_page
      scrollable: false
      on_unload:
        - lvgl.widget.hide: pc_keuze
        - lvgl.widget.hide: pc_temp
      on_swipe_left:
        - lambda: 'lv_indev_wait_release(lv_indev_active());'
        - lvgl.page.next:
            animation: MOVE_LEFT
            time: 250ms
      on_swipe_right:
        - lambda: 'lv_indev_wait_release(lv_indev_active());'
        - lvgl.page.previous:
            animation: MOVE_RIGHT
            time: 250ms
      widgets:
        # RETRO: altijd terug naar THUIS of het MENU
        - button:
            align: TOP_RIGHT
            x: -10
            y: 6
            width: 78
            height: 28
            radius: 14
            bg_color: 0xE8745C
            bg_opa: COVER
            border_width: 0
            shadow_width: 0
            ext_click_area: 6
            widgets:
              - label:
                  align: CENTER
                  text: "THUIS"
                  text_font: r_mono
                  text_color: 0x46201A
            on_click:
              - lvgl.page.show:
                  id: page_rhome
                  animation: FADE_IN
                  time: 200ms
        - button:
            align: TOP_RIGHT
            x: -92
            y: 6
            width: 74
            height: 28
            radius: 14
            bg_color: 0xECEEF1
            bg_opa: COVER
            border_width: 0
            shadow_width: 0
            ext_click_area: 6
            widgets:
              - label:
                  align: CENTER
                  text: "MENU"
                  text_font: r_mono
                  text_color: 0x2B2F36
            on_click:
              - lvgl.page.show:
                  id: page_rmenu
                  animation: FADE_IN
                  time: 200ms
        - label:
            x: 18
            y: 12
            text: "05 / KACHEL"
            text_font: r_mono
            text_color: 0x8B9099
        - obj:
            id: r_hbx_pc
            x: 18
