# ---------------------------------------------------------------- scripts
script:
  # ================= RETRO =================
  - id: r_all_lights
    mode: single
    then:
      - lambda: |-
          lv_obj_set_style_text_opa(id(r_bigbulb), LV_OPA_60, 0);
      - if:
          condition:
            lambda: 'return id(lt_all_on).state;'
          then:
            - homeassistant.action:
                action: light.turn_off
                data:
                  entity_id: light.slaapkamer_jip_2
          else:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: light.slaapkamer_jip_2
      - delay: 1500ms
      - script.execute: r_home_render
  - id: r_home_render
    then:
      - lambda: |-
          auto t = id(system_time).now();
          if (t.is_valid()) {
            char b[8]; snprintf(b, sizeof(b), "%02d:%02d", t.hour, t.minute);
            lv_label_set_text(id(r_clock_lbl), b);
            static const char *mnd[] = {"JAN", "FEB", "MRT", "APR", "MEI", "JUN", "JUL", "AUG", "SEP", "OKT", "NOV", "DEC"};
            static const char *dag[] = {"ZONDAG", "MAANDAG", "DINSDAG", "WOENSDAG", "DONDERDAG", "VRIJDAG", "ZATERDAG"};
            char d[40]; snprintf(d, sizeof(d), "%s %d %s", dag[(t.day_of_week + 6) % 7], t.day_of_month, mnd[t.month - 1]);
            lv_label_set_text(id(r_date), d);
          }
          {
            float ek = id(e_today).state;
            char eb[64];
            if (std::isnan(ek)) snprintf(eb, sizeof(eb), "ENERGIE");
            else { snprintf(eb, sizeof(eb), "ENERGIE – ENERGIEKOSTEN VANDAAG: € %.2f", ek); for (char *q = eb; *q; q++) if (*q == '.') *q = ','; }
            lv_label_set_text(id(r_elbl), eb);
          }
          {
            bool aan = id(lt_all_on).state;
            if (!id(r_all_lights).is_running()) lv_obj_set_style_text_opa(id(r_bigbulb), aan ? 64 : 18, 0);
            lv_label_set_text(id(r_tlbl), aan ? "TIJD · LICHT AAN" : "TIJD · LICHT UIT");
          }
          float ot = id(info_out_temp).state;
          if (!std::isnan(ot)) { char b[12]; snprintf(b, sizeof(b), "%.0f°", ot); lv_label_set_text(id(r_wtemp), b); }
          struct C { const char *k, *ico; };
          static const C conds[] = {
            {"clear-night", "${mdi_night}"}, {"cloudy", "${mdi_wx_cloudy}"}, {"fog", "${mdi_wx_fog}"}, {"hail", "${mdi_wx_hail}"}, {"lightning", "${mdi_wx_lightning}"},
            {"lightning-rainy", "${mdi_wx_lrain}"}, {"partlycloudy", "${mdi_weather}"}, {"pouring", "${mdi_wx_pouring}"}, {"rainy", "${mdi_rain}"}, {"snowy", "${mdi_wx_snowy}"},
            {"snowy-rainy", "${mdi_wx_snowrain}"}, {"sunny", "${mdi_wx_sunny}"}, {"windy", "${mdi_wx_windy}"}};
          std::string w = id(info_weather).has_state() ? id(info_weather).state : "";
          for (auto &c : conds) if (w == c.k) lv_label_set_text(id(r_wicon), c.ico);
          if (id(am_info).has_state()) {
            std::string v = id(am_info).state; size_t a = v.find('|'), b = a == std::string::npos ? a : v.find('|', a + 1), c = b == std::string::npos ? b : v.find('|', b + 1);
            if (c != std::string::npos) lv_label_set_text(id(r_wminmax), ("MIN " + v.substr(a + 1, b - a - 1) + " · MAX " + v.substr(b + 1, c - b - 1)).c_str());
          }
          int nd = (w == "pouring" || w == "rainy" || w == "lightning-rainy") ? 5 : (w == "cloudy" || w == "fog" || w == "snowy" ? 3 : (w == "partlycloudy" ? 2 : 1));
          lv_obj_t *wd[] = {id(r_wdot0), id(r_wdot1), id(r_wdot2), id(r_wdot3), id(r_wdot4)};
          for (int k = 0; k < 5; k++) lv_obj_set_style_bg_color(wd[k], lv_color_hex(k < nd ? id(r_tcol)[6] : id(r_tcol)[9]), 0);
          float ti = id(room_temp).state, hu = id(room_hum).state;
          if (!std::isnan(ti)) { char b[12]; snprintf(b, sizeof(b), "%.1f°", ti); for (char *p = b; *p; p++) if (*p == '.') *p = ','; lv_label_set_text(id(r_tin), b); }
          if (!std::isnan(hu)) { char b[24]; snprintf(b, sizeof(b), "VOCHT %.0f%%", hu); lv_label_set_text(id(r_hum), b); }
          float pw = id(e_power).state, pv = id(zs_pv).state, gr = id(zs_grid).state;
          if (!std::isnan(pw)) {
            char b[16];
            if (pw >= 1000) { snprintf(b, sizeof(b), "%.1f kW", pw / 1000); for (char *p = b; *p; p++) if (*p == '.') *p = ','; }
            else snprintf(b, sizeof(b), "%.0f W", pw);
            lv_label_set_text(id(r_epow), b);
            int nb = std::min(10, (int) ceilf(pw / 200.0f));
            lv_obj_t *eb[] = {id(r_ebar0), id(r_ebar1), id(r_ebar2), id(r_ebar3), id(r_ebar4), id(r_ebar5), id(r_ebar6), id(r_ebar7), id(r_ebar8), id(r_ebar9)};
            for (int k = 0; k < 10; k++) lv_obj_set_style_bg_color(eb[k], lv_color_hex(k < nb ? id(r_tcol)[20] : id(r_tcol)[9]), 0);
          }
