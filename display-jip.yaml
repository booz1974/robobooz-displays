          for (int i = 0; i < 3; i++) lv_label_set_text(rt[i], (6 + i * 6) < n ? tm[6 + i * 6].c_str() : "");
          if (n == 0) { lv_label_set_text(id(r_wx_tip), "GEEN REGENDATA"); return; }
          std::string t;
          if (val[0] > 0) {
            int e = -1; for (int k = 1; k < n; k++) if (val[k] <= 0) { e = k; break; }
            t = e < 0 ? std::string("REGEN · HOUDT 2 UUR AAN") : "REGEN NU · DROOG OM " + tm[e];
          } else {
            int b = -1; for (int k = 1; k < n; k++) if (val[k] > 0) { b = k; break; }
            if (b < 0) t = "DROOG KOMENDE 2 UUR";
