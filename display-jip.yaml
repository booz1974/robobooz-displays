  - id: ma_poll
    mode: single
    then:
      - http_request.post:
          url: "${ma_url}/api"
          request_headers:
            Content-Type: application/json
            Authorization: "Bearer ${ma_token}"
          body: '{"message_id": "1", "command": "players/all", "args": {}}'
          capture_response: true
          max_response_buffer_size: 65536   # spelerslijst is ~30 KB; 256 KB vond na een tijdje geen vrij blok meer
          on_response:
            then:
              - lambda: |-
                  auto setl = [](lv_obj_t *o, const char *t) { const char *c = lv_label_get_text(o); if (c != nullptr && strcmp(c, t) == 0) return; lv_label_set_text(o, t); };
                  auto showo = [](lv_obj_t *o) { if (lv_obj_has_flag(o, LV_OBJ_FLAG_HIDDEN)) lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN); };
                  (void) setl; (void) showo;
                  if (response->status_code != 200) {
                    ESP_LOGW("ma", "Music Assistant gaf status %d", response->status_code);
                    return;
                  }
                  JsonDocument filter;
                  JsonObject f = filter.add<JsonObject>();
                  f["player_id"] = true;
                  f["display_name"] = true;
                  f["name"] = true;
                  f["playback_state"] = true;
                  f["state"] = true;
                  f["available"] = true;
                  f["enabled"] = true;
                  f["synced_to"] = true;
                  f["volume_level"] = true;
                  f["current_media"]["title"] = true;
                  f["current_media"]["artist"] = true;
                  f["current_media"]["album"] = true;
                  f["current_media"]["image_url"] = true;
                  f["current_media"]["media_type"] = true;
                  JsonDocument doc;
                  DeserializationError err = deserializeJson(doc, body, DeserializationOption::Filter(filter));
                  if (err) {
                    ESP_LOGW("ma", "JSON-fout: %s (%u bytes)", err.c_str(), (unsigned) body.size());
                    return;
                  }
                  // MA geeft de spelerslijst direct terug (array); oudere versies verpakt in {"result": [...]}
                  JsonArray players = doc.as<JsonArray>();
                  JsonDocument doc2;
                  if (players.isNull()) {
                    JsonDocument filter2;
                    filter2["result"] = filter;
                    deserializeJson(doc2, body, DeserializationOption::Filter(filter2));
                    players = doc2["result"].as<JsonArray>();
                  }
                  ESP_LOGI("ma", "%u spelers ontvangen (%u bytes)", (unsigned) players.size(), (unsigned) body.size());
                  struct P { std::string id, name, title, artist, img; bool playing; int vol; };
                  std::vector<P> list;
                  std::vector<std::string> seen;
                  for (int pass = 0; pass < 2; pass++) {
                    for (JsonObject p : players) {
                      if (p["enabled"].is<bool>() && !p["enabled"].as<bool>()) continue;
                      if (p["available"].is<bool>() && !p["available"].as<bool>()) continue;
                      if (!p["synced_to"].isNull()) continue;
                      // alleen kijkpaal Jip: MA kent hem twee keer (cast-speler en dashboard-speler)
                      { std::string pid = p["player_id"] | "";
                        if (pid != "ec5bd534-c65d-79f7-bbf4-953eee6f7b6b" && pid != "dashboard:chromecast_ec5bd534-c65d-79f7-bbf4-953eee6f7b6b") continue; }
                      std::string st = p["playback_state"] | (p["state"] | "");
                      bool playing = st == "playing";
                      if (pass == 0 && !playing) continue;
                      if (pass == 1 && st != "paused") continue;
                      JsonObject cm = p["current_media"];
                      P e;
                      e.id = p["player_id"] | "";
                      e.name = p["display_name"] | (p["name"] | "");
                      e.title = cm["title"] | "";
                      e.artist = cm["artist"] | "";
                      e.img = cm["image_url"] | "";
                      std::string rad_mt = cm["media_type"] | "";
                      if (rad_mt == "radio" && !e.title.empty() && e.img.find("theaudiodb.com") == std::string::npos) {
                        std::string rkey = e.artist + "|" + e.title;
                        auto rc = id(rad_cache).find(rkey);
                        if (rc != id(rad_cache).end()) {
                          if (!rc->second.empty() && rc->second != "-") e.img = rc->second;
                          else if (rc->second.empty()) e.img = "";   // nog aan het zoeken: niet eerst het zenderlogo laden
                        } else if (!id(rad_busy)) {
                          e.img = "";
                          if (id(rad_cache).size() > 12) id(rad_cache).clear();
                          id(rad_cache)[rkey] = "";
                          id(rad_key) = rkey;
                          id(rad_art) = "";
                          id(rad_term) = e.artist.empty() ? e.title : e.artist + " " + e.title;
                          id(rad_busy) = true;
                          id(rad_lookup).execute();
                        } else {
                          e.img = "";
                        }
                      }
                      e.playing = playing;
                      e.vol = p["volume_level"] | -1;
                      std::string key = e.title + "|" + e.artist;
                      if (!e.title.empty()) {
                        if (std::find(seen.begin(), seen.end(), key) != seen.end()) continue;
                        seen.push_back(key);
                      }
                      list.push_back(e);
                    }
                  }
                  int playing_n = 0;
                  for (auto &e : list) if (e.playing) playing_n++;
                  id(mp_any) = playing_n > 0;
                  // ---- spelerpagina: geselecteerde speler + lijst voor 'verplaatsen'
                  if (id(sel_pid).empty() && !list.empty()) id(sel_pid) = list[0].id;
                  std::vector<std::pair<std::string, std::string>> tps;
                  bool sel_found = false;
                  std::string dpid, dlead;
                  for (JsonObject p : players) {
                    if (p["enabled"].is<bool>() && !p["enabled"].as<bool>()) continue;
                    if (p["available"].is<bool>() && !p["available"].as<bool>()) continue;
                    std::string pid = p["player_id"] | "";
                    std::string nm = p["display_name"] | (p["name"] | "");
                    {
                      // Hue disco woonkamer: id onthouden en bij welke speler hij aangesloten is
                      std::string lnm = nm;
                      for (auto &ch : lnm) ch = tolower((unsigned char) ch);
                      if (dpid.empty() && lnm.find("${disco_match}") != std::string::npos) {
                        dpid = pid;
                        dlead = p["synced_to"] | "";
                      }
                    }
                    if (pid == id(sel_pid)) {
                      sel_found = true;
                      JsonObject cm = p["current_media"];
                      std::string st = p["playback_state"] | (p["state"] | "");
                      std::string t = cm["title"] | "";
                      std::string a = cm["artist"] | "";
                      std::string al = cm["album"] | "";
                      std::string sub = a.empty() ? al : (al.empty() ? a : a + " - " + al);
                      std::string cap = nm;
                      for (auto &ch : cap) ch = toupper((unsigned char) ch);
                      setl(id(pv_name), cap.c_str());
                      setl(id(pv_title), t.empty() ? "Niets in de wachtrij" : t.c_str());
                      setl(id(pv_artist), sub.c_str());
                      id(pv_playing) = st == "playing";
                      setl(id(pv_pp), id(pv_playing) ? "${mdi_pause}" : "${mdi_play}");
                      int v = p["volume_level"] | -1;
                      if (v >= 0) {
                        char vb[8];
                        snprintf(vb, sizeof(vb), "%d%%", v);
                        setl(id(pv_volpct), vb);
                      } else {
                        setl(id(pv_volpct), "");
                      }
                      std::string u = cm["image_url"] | "";
                      std::string rad_mt = cm["media_type"] | "";
                      if (rad_mt == "radio" && !t.empty() && u.find("theaudiodb.com") == std::string::npos) {
                        std::string rkey = a + "|" + t;
                        auto rc = id(rad_cache).find(rkey);
                        if (rc != id(rad_cache).end()) {
                          if (!rc->second.empty() && rc->second != "-") u = rc->second;
                          else if (rc->second.empty()) u = "";   // nog aan het zoeken: niet eerst het zenderlogo laden
                        } else if (!id(rad_busy)) {
                          u = "";
                          if (id(rad_cache).size() > 12) id(rad_cache).clear();
                          id(rad_cache)[rkey] = "";
                          id(rad_key) = rkey;
                          id(rad_art) = "";
                          id(rad_term) = a.empty() ? t : a + " " + t;
                          id(rad_busy) = true;
                          id(rad_lookup).execute();
                        } else {
                          u = "";
                        }
                      }
                      if (!u.empty() && u[0] == '/') u = std::string("${ma_url}") + u;
                      if (u.rfind("${ma_url}", 0) != 0 && u.rfind("https://is", 0) != 0) u = u.rfind("http", 0) == 0 ? u : "";
                      if (u.find("theaudiodb.com/images/") != std::string::npos && u.find("/small") == std::string::npos) u += "/small";
                      // Music Assistant-plaatjes altijd verkleind opvragen (zonder size= kwam soms het origineel van ~850 KB)
                      if (u.find("/imageproxy") != std::string::npos) { size_t f = u.find("fmt=jpg"); if (f != std::string::npos && u.compare(f, 8, "fmt=jpeg") != 0) u.replace(f, 7, "fmt=jpeg"); size_t q = u.find("size="); if (q == std::string::npos) u += (u.find('?') == std::string::npos ? "?size=256" : "&size=256"); else { size_t e = u.find('&', q); u.replace(q, (e == std::string::npos ? u.size() : e) - q, "size=256"); } }
                      // alleen laden als de spelerpagina open is (anders houdt dit het grote hoesje op)
                      if (u != id(pv_url) && id(page_player)->is_showing() && (u != id(art_bad_pv) || millis() >= id(art_retry_pv))) {
                        if (u != id(art_bad_pv)) id(art_fail_pv) = 0;
                        id(pv_url) = u;
                        if (u.empty()) {
                          lv_obj_add_flag(id(pv_cover), LV_OBJ_FLAG_HIDDEN);
                          showo(id(pv_icon));
                        } else {
                          { size_t q = u.find("_thumb1200"); if (q != std::string::npos) u.replace(q, 10, "_thumb250"); q = u.find("_thumb500"); if (q != std::string::npos) u.replace(q, 9, "_thumb250"); }  /* art_thumb_fix */ id(pv_img)->set_url(u);
                          id(qimg_pending) |= (1u << 20); id(qimg_next).execute();
                        }
                      }
                    } else if (p["synced_to"].isNull() && tps.size() < 8) {
                      tps.push_back({pid, nm});
                    }
                  }
                  id(disco_pid) = dpid;
                  id(disco_leader) = dlead;
                  if (!sel_found && !id(sel_pid).empty()) {
                    setl(id(pv_title), "Speler niet beschikbaar");
                    setl(id(pv_artist), "");
                  }
                  if (0 < (int) tps.size()) {
                    id(tp_id_0) = tps[0].first;
