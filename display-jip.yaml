  # ---- radio: hoes van het huidige nummer opzoeken
  - id: rad_lookup
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              std::string t = id(rad_term);
              for (auto &c : t) c = tolower(c);
              return t.find("advert") != std::string::npos || t.find("commercial break") != std::string::npos || t.find("reclame") != std::string::npos;
          then:
            # eigen hoes voor reclameblokken (_200x200bb wordt voor het grote plaatje _300x300bb)
            - lambda: |-
                id(rad_busy) = false;
                id(rad_art) = "${ha_url}/local/robobooz/commercial_break_200x200bb.jpg"; id(rad_cache)[id(rad_key)] = id(rad_art);
                ESP_LOGI("ma", "radio: reclame -> eigen hoes");
            - script.execute: ma_poll
          else:
            - http_request.get:
                url: !lambda |-
                  auto enc = [](const std::string &s) {
                    std::string o;
                    char b[4];
                    for (unsigned char c : s) {
                      if (isalnum(c) || c == '-' || c == '_' || c == '.' || c == '~') o += (char) c;
                      else if (c == ' ') o += '+';
                      else { snprintf(b, sizeof(b), "%%%02X", c); o += b; }
                    }
                    return o;
                  };
                  return std::string("https://itunes.apple.com/search?media=music&entity=song&limit=1&term=") + enc(id(rad_term));
                capture_response: true
                max_response_buffer_size: 16384
                on_response:
                  then:
                    - lambda: |-
                        id(rad_busy) = false;
                        if (response->status_code != 200) {
                          ESP_LOGW("ma", "iTunes: status %d", response->status_code);
                          id(rad_art) = "-"; id(rad_cache)[id(rad_key)] = id(rad_art);   // dan het zenderlogo gebruiken
                          return;
                        }
                        JsonDocument filter;
                        filter["results"][0]["artworkUrl100"] = true;
                        JsonDocument doc;
                        if (deserializeJson(doc, body, DeserializationOption::Filter(filter))) { id(rad_art) = "-"; id(rad_cache)[id(rad_key)] = id(rad_art); return; }
                        std::string art = doc["results"][0]["artworkUrl100"] | "";
                        if (art.empty()) {
                          ESP_LOGI("ma", "radio: geen hoes gevonden voor '%s'", id(rad_term).c_str());
                          id(rad_art) = "-"; id(rad_cache)[id(rad_key)] = id(rad_art);
                          return;
                        }
                        size_t p = art.find("100x100bb");
                        if (p != std::string::npos) art.replace(p, 9, "200x200bb");
                        id(rad_art) = art; id(rad_cache)[id(rad_key)] = id(rad_art);
                        ESP_LOGI("ma", "radio: hoes voor '%s' -> %s", id(rad_term).c_str(), art.c_str());
                    - script.execute: ma_poll
                on_error:
                  then:
                    - lambda: |-
                        id(rad_busy) = false;
                        id(rad_art) = "-"; id(rad_cache)[id(rad_key)] = id(rad_art);   // iTunes niet bereikbaar: zenderlogo gebruiken
                    - script.execute: ma_poll

  # ---- spelerpagina: wachtrij ophalen
  - id: ma_qpoll
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(sel_pid).empty();'
          then:
            - http_request.post:
                url: "${ma_url}/api"
                request_headers:
                  Content-Type: application/json
                  Authorization: "Bearer ${ma_token}"
                body: !lambda |-
                  return std::string("{\"message_id\": \"4\", \"command\": \"player_queues/get_active_queue\", \"args\": {\"player_id\": \"") + id(sel_pid) + "\"}}";
                capture_response: true
                max_response_buffer_size: 131072
                on_response:
                  then:
                    - lambda: |-
                        JsonDocument filter;
                        filter["queue_id"] = true;
                        filter["current_index"] = true;
                        filter["shuffle_enabled"] = true;
                        filter["elapsed_time"] = true;
                        filter["current_item"]["duration"] = true;
                        filter["current_item"]["media_item"]["year"] = true;
                        filter["current_item"]["media_item"]["album"]["year"] = true;
                        filter["current_item"]["streamdetails"]["audio_format"]["content_type"] = true;
                        filter["current_item"]["streamdetails"]["audio_format"]["sample_rate"] = true;
                        filter["current_item"]["streamdetails"]["audio_format"]["bit_depth"] = true;
                        JsonDocument doc;
                        if (deserializeJson(doc, body, DeserializationOption::Filter(filter))) {
                          ESP_LOGW("ma", "wachtrij: JSON-fout");
                          return;
                        }
                        if (doc["queue_id"].isNull()) {
                          id(sel_qid) = "";
                          return;
                        }
                        id(sel_qid) = doc["queue_id"].as<std::string>();
                        id(sel_ci) = doc["current_index"] | 0;
                        id(sel_shuffle) = doc["shuffle_enabled"] | false;
                        lv_obj_set_style_text_color(id(pv_shuf), lv_color_hex(id(sel_shuffle) ? ${c_accent} : ${c_sub}), 0);
                        JsonObject cur = doc["current_item"];
                        id(pv_el) = doc["elapsed_time"] | 0.0f;
                        id(pv_el_t) = millis();
                        id(pv_dur) = cur["duration"] | 0;
                        int year = cur["media_item"]["album"]["year"] | (cur["media_item"]["year"] | 0);
                        if (year > 0) {
                          lv_label_set_text(id(pv_year), to_string(year).c_str());
                          lv_obj_remove_flag(lv_obj_get_parent(id(pv_year)), LV_OBJ_FLAG_HIDDEN);
                        } else {
                          lv_obj_add_flag(lv_obj_get_parent(id(pv_year)), LV_OBJ_FLAG_HIDDEN);
                        }
                        JsonObject af = cur["streamdetails"]["audio_format"];
                        std::string ct = af["content_type"] | "";
                        if (!ct.empty()) {
                          for (auto &ch : ct) ch = toupper((unsigned char) ch);
                          int sr = af["sample_rate"] | 0;
                          int bd = af["bit_depth"] | 0;
                          char qb[40];
                          if (sr > 0) {
                            float k = sr / 1000.0f;
                            if (sr % 1000 == 0) snprintf(qb, sizeof(qb), "%s %d/%d", ct.c_str(), sr / 1000, bd);
                            else snprintf(qb, sizeof(qb), "%s %.1f/%d", ct.c_str(), k, bd);
                          } else {
                            snprintf(qb, sizeof(qb), "%s", ct.c_str());
                          }
                          lv_label_set_text(id(pv_qual), qb);
                          lv_obj_remove_flag(lv_obj_get_parent(id(pv_qual)), LV_OBJ_FLAG_HIDDEN);
                        } else {
                          lv_obj_add_flag(lv_obj_get_parent(id(pv_qual)), LV_OBJ_FLAG_HIDDEN);
                        }
                        id(pv_tick).execute();
      - if:
          condition:
            lambda: 'return !id(sel_qid).empty();'
          then:
            - http_request.post:
                url: "${ma_url}/api"
                request_headers:
                  Content-Type: application/json
                  Authorization: "Bearer ${ma_token}"
                body: !lambda |-
                  int off = id(sel_ci) - 2;
                  if (off < 0) off = 0;
                  id(sel_off) = off;
                  return std::string("{\"message_id\": \"6\", \"command\": \"player_queues/items\", \"args\": {\"queue_id\": \"") +
                         id(sel_qid) + "\", \"limit\": 13, \"offset\": " + to_string(off) + "}}";
                capture_response: true
                max_response_buffer_size: 196608
                on_response:
                  then:
                    - lambda: |-
                        auto enc = [](const std::string &s) {
                          std::string o;
                          char b[4];
                          for (unsigned char c : s) {
                            if (isalnum(c) || c == '-' || c == '_' || c == '.' || c == '~') o += (char) c;
                            else { snprintf(b, sizeof(b), "%%%02X", c); o += b; }
                          }
                          return o;
                        };
                        auto mmss = [](int s) {
                          char b[12];
                          if (s < 0) s = 0;
                          snprintf(b, sizeof(b), "%d:%02d", s / 60, s % 60);
                          return std::string(b);
                        };
                        JsonDocument filter;
                        JsonObject fi = filter.add<JsonObject>();
                        fi["queue_item_id"] = true;
                        fi["name"] = true;
                        fi["duration"] = true;
                        fi["image"]["path"] = true;
                        fi["image"]["provider"] = true;
                        fi["image"]["proxy_id"] = true;
                        fi["media_item"]["image"]["path"] = true;
                        fi["media_item"]["image"]["provider"] = true;
                        fi["media_item"]["image"]["proxy_id"] = true;
                        fi["media_item"]["metadata"]["images"][0]["path"] = true;
                        fi["media_item"]["metadata"]["images"][0]["provider"] = true;
                        fi["media_item"]["metadata"]["images"][0]["proxy_id"] = true;
                        fi["media_item"]["album"]["image"]["path"] = true;
                        fi["media_item"]["album"]["image"]["provider"] = true;
                        fi["media_item"]["album"]["image"]["proxy_id"] = true;
                        fi["media_item"]["album"]["metadata"]["images"][0]["path"] = true;
                        fi["media_item"]["album"]["metadata"]["images"][0]["provider"] = true;
                        fi["media_item"]["album"]["metadata"]["images"][0]["proxy_id"] = true;
                        fi["media_item"]["name"] = true;
                        fi["media_item"]["artists"][0]["name"] = true;
                        fi["media_item"]["album"]["name"] = true;
                        JsonDocument doc;
                        if (deserializeJson(doc, body, DeserializationOption::Filter(filter))) {
                          ESP_LOGW("ma", "wachtrij-items: JSON-fout");
                          return;
                        }
                        lv_obj_add_flag(id(qr_0), LV_OBJ_FLAG_HIDDEN);
                        lv_obj_add_flag(id(qr_1), LV_OBJ_FLAG_HIDDEN);
                        lv_obj_add_flag(id(qr_2), LV_OBJ_FLAG_HIDDEN);
                        lv_obj_add_flag(id(qr_3), LV_OBJ_FLAG_HIDDEN);
                        lv_obj_add_flag(id(qr_4), LV_OBJ_FLAG_HIDDEN);
                        lv_obj_add_flag(id(qr_5), LV_OBJ_FLAG_HIDDEN);
                        id(qn_id_0) = "";
                        id(qn_id_1) = "";
                        id(qn_id_2) = "";
                        id(qn_id_3) = "";
                        id(qn_id_4) = "";
                        id(qn_id_5) = "";
                        id(qn_id_6) = "";
                        id(qn_id_7) = "";
                        id(qn_id_8) = "";
                        id(qn_id_9) = "";
                        int ci = id(sel_ci);
                        int k = 0;
                        for (JsonObject it : doc.as<JsonArray>()) {
                          int abs_i = id(sel_off) + k++;
                          int slot;
                          if (abs_i < ci) slot = abs_i - (ci - 2);
                          else if (abs_i > ci) slot = 2 + (abs_i - ci - 1);
                          else continue;
                          if (slot < 0 || slot >= 12) continue;
                          std::string name = it["media_item"]["name"] | (it["name"] | "");
                          std::string art = it["media_item"]["artists"][0]["name"] | "";
                          std::string alb = it["media_item"]["album"]["name"] | "";
                          std::string sub = art.empty() ? alb : (alb.empty() ? art : art + " - " + alb);
                          std::string qid = it["queue_item_id"] | "";
                          int d = it["duration"] | 0;
                          char no[6];
                          snprintf(no, sizeof(no), "%02d", (abs_i + 1) % 100);
                          std::string ip, prov, pxid;
                          JsonObject cands[5] = {it["image"], it["media_item"]["image"], it["media_item"]["metadata"]["images"][0],
                                                 it["media_item"]["album"]["image"], it["media_item"]["album"]["metadata"]["images"][0]};
                          for (auto &c : cands) {
                            if (c.isNull()) continue;
                            std::string px = c["proxy_id"] | "";
                            std::string pth = c["path"] | "";
                            if (px.empty() && pth.empty()) continue;
                            pxid = px;
                            ip = pth;
                            prov = c["provider"] | "";
                            break;
                          }
                          std::string img;
                          if (!pxid.empty()) {
                            // nieuw formaat van Music Assistant: /imageproxy/<id>
                            img = std::string("${ma_url}/imageproxy/") + pxid + "?size=80&fmt=jpeg";
                          } else if (ip.rfind("https://i.scdn.co/image/ab67616d0000b273", 0) == 0) {
                            // Spotify: rechtstreeks de 64px-versie
                            img = ip;
                            img.replace(24, 16, "ab67616d00004851");
                          } else if (ip.rfind("http", 0) == 0) {
                            img = ip;
                          }
                          if (slot == 2) ESP_LOGI("ma", "hoes: id='%s' pad='%s' -> %s", pxid.c_str(), ip.c_str(), img.c_str());
                          switch (slot) {
                            case 0: {
                              lv_label_set_text(id(qr_no_0), no);
                              lv_label_set_text(id(qr_t_0), name.c_str());
                              lv_label_set_text(id(qr_s_0), sub.c_str());
                              lv_label_set_text(id(qr_r_0), d > 0 ? mmss(d).c_str() : "");
                              if (img != id(qimg_url_0)) {
                                id(qimg_url_0) = img;
                                if (img.empty()) {
                                  lv_obj_add_flag(id(qr_cv_0), LV_OBJ_FLAG_HIDDEN);
                                  lv_obj_remove_flag(id(qr_ic_0), LV_OBJ_FLAG_HIDDEN);
                                } else {
                                  id(qimg_0)->set_url(img);
                                  id(qimg_pending) |= (1u << 0);
                                }
                              }
                              lv_obj_remove_flag(id(qr_0), LV_OBJ_FLAG_HIDDEN);
                              break;
                            }
                            case 1: {
                              lv_label_set_text(id(qr_no_1), no);
                              lv_label_set_text(id(qr_t_1), name.c_str());
                              lv_label_set_text(id(qr_s_1), sub.c_str());
                              lv_label_set_text(id(qr_r_1), d > 0 ? mmss(d).c_str() : "");
                              if (img != id(qimg_url_1)) {
                                id(qimg_url_1) = img;
                                if (img.empty()) {
                                  lv_obj_add_flag(id(qr_cv_1), LV_OBJ_FLAG_HIDDEN);
                                  lv_obj_remove_flag(id(qr_ic_1), LV_OBJ_FLAG_HIDDEN);
                                } else {
                                  id(qimg_1)->set_url(img);
                                  id(qimg_pending) |= (1u << 1);
                                }
                              }
                              lv_obj_remove_flag(id(qr_1), LV_OBJ_FLAG_HIDDEN);
                              break;
                            }
                            case 2: {
                              id(qn_id_0) = qid;
                              lv_label_set_text(id(qr_no_2), no);
                              lv_label_set_text(id(qr_t_2), name.c_str());
                              lv_label_set_text(id(qr_s_2), sub.c_str());
                              if (img != id(qimg_url_2)) {
                                id(qimg_url_2) = img;
                                if (img.empty()) {
                                  lv_obj_add_flag(id(qr_cv_2), LV_OBJ_FLAG_HIDDEN);
                                  lv_obj_remove_flag(id(qr_ic_2), LV_OBJ_FLAG_HIDDEN);
                                } else {
                                  id(qimg_2)->set_url(img);
                                  id(qimg_pending) |= (1u << 2);
                                }
                              }
                              lv_obj_remove_flag(id(qr_2), LV_OBJ_FLAG_HIDDEN);
                              break;
                            }
                            case 3: {
                              id(qn_id_1) = qid;
                              lv_label_set_text(id(qr_no_3), no);
                              lv_label_set_text(id(qr_t_3), name.c_str());
                              lv_label_set_text(id(qr_s_3), sub.c_str());
                              if (img != id(qimg_url_3)) {
                                id(qimg_url_3) = img;
                                if (img.empty()) {
                                  lv_obj_add_flag(id(qr_cv_3), LV_OBJ_FLAG_HIDDEN);
                                  lv_obj_remove_flag(id(qr_ic_3), LV_OBJ_FLAG_HIDDEN);
                                } else {
                                  id(qimg_3)->set_url(img);
                                  id(qimg_pending) |= (1u << 3);
                                }
                              }
                              lv_obj_remove_flag(id(qr_3), LV_OBJ_FLAG_HIDDEN);
                              break;
                            }
                            case 4: {
                              id(qn_id_2) = qid;
                              lv_label_set_text(id(qr_no_4), no);
                              lv_label_set_text(id(qr_t_4), name.c_str());
                              lv_label_set_text(id(qr_s_4), sub.c_str());
                              if (img != id(qimg_url_4)) {
                                id(qimg_url_4) = img;
                                if (img.empty()) {
                                  lv_obj_add_flag(id(qr_cv_4), LV_OBJ_FLAG_HIDDEN);
                                  lv_obj_remove_flag(id(qr_ic_4), LV_OBJ_FLAG_HIDDEN);
                                } else {
                                  id(qimg_4)->set_url(img);
                                  id(qimg_pending) |= (1u << 4);
                                }
                              }
                              lv_obj_remove_flag(id(qr_4), LV_OBJ_FLAG_HIDDEN);
                              break;
                            }
                            case 5: {
                              id(qn_id_3) = qid;
                              lv_label_set_text(id(qr_no_5), no);
                              lv_label_set_text(id(qr_t_5), name.c_str());
                              lv_label_set_text(id(qr_s_5), sub.c_str());
                              if (img != id(qimg_url_5)) {
                                id(qimg_url_5) = img;
                                if (img.empty()) {
                                  lv_obj_add_flag(id(qr_cv_5), LV_OBJ_FLAG_HIDDEN);
                                  lv_obj_remove_flag(id(qr_ic_5), LV_OBJ_FLAG_HIDDEN);
                                } else {
                                  id(qimg_5)->set_url(img);
                                  id(qimg_pending) |= (1u << 5);
                                }
                              }
                              lv_obj_remove_flag(id(qr_5), LV_OBJ_FLAG_HIDDEN);
                              break;
                            }
                          }
                        }
                        id(qimg_next).execute();
                        if (id(pv_need_scroll)) {
                          id(pv_need_scroll) = false;
                          lv_obj_update_layout(id(pv_scroll));
                          lv_obj_scroll_to_y(id(pv_scroll), lv_obj_get_y(id(pv_next_hdr)) - 4, LV_ANIM_OFF);
                        }

  # ---- willekeurig commando naar Music Assistant
  - id: ma_send
    mode: queued
    parameters:
      payload: string
    then:
      - http_request.post:
          url: "${ma_url}/api"
          request_headers:
            Content-Type: application/json
            Authorization: "Bearer ${ma_token}"
          body: !lambda 'return payload;'
          on_response:
            then:
              - if:
                  condition:
                    lambda: 'return response->status_code != 200;'
                  then:
                    - logger.log:
                        format: "Music Assistant weigerde commando (status %d)"
                        args: [response->status_code]
              - delay: 400ms
              - script.execute: ma_poll
              - script.execute: ma_qpoll

  # ---- hoesjes één voor één downloaden (anders raakt het geheugen op)
  # volgorde: deurbel (27), groot hoesje (28), spelerpagina (20), dan de rest
  - id: qimg_next
    then:
      - lambda: |-
          if (id(qimg_busy) || id(qimg_pending) == 0) return;
          uint32_t p = id(qimg_pending);
          int k = (p & (1u << 27)) ? 27 : (p & (1u << 28)) ? 28 : (p & (1u << 20)) ? 20 : __builtin_ctz(p);
          id(qimg_pending) &= ~(1u << k);
          id(qimg_busy) = true;
          id(qimg_busy_t) = millis();
          id(qimg_cur) = k;
          switch (k) {
            case 0: id(qimg_0)->update(); break;
            case 1: id(qimg_1)->update(); break;
            case 2: id(qimg_2)->update(); break;
            case 3: id(qimg_3)->update(); break;
            case 4: id(qimg_4)->update(); break;
            case 5: id(qimg_5)->update(); break;
            case 27: id(cam_img)->update(); break;
            case 21: id(ma_img_0)->update(); break;
            case 22: id(ma_img_1)->update(); break;
            case 23: id(ma_img_2)->update(); break;
            case 24: id(ma_img_3)->update(); break;
            case 25: id(ma_img_4)->update(); break;
            case 26: id(ma_img_5)->update(); break;
            case 20: id(pv_img)->update(); break;
            case 28: id(mp_big_img)->update(); break;
            case 29: id(favart_ma)->update(); break;
            case 30: id(favart_ext)->update(); break;
            default: id(qimg_busy) = false; break;
          }

  # ---- voortgangsbalk bijwerken
  - id: pv_tick
    then:
      - lambda: |-
          int dur = id(pv_dur);
          float e = id(pv_el);
          if (id(pv_playing)) e += (millis() - id(pv_el_t)) / 1000.0f;
          if (dur > 0 && e > dur) e = dur;
          char b[12];
          int s = (int) e;
          snprintf(b, sizeof(b), "%d:%02d", s / 60, s % 60);
          lv_label_set_text(id(pv_el_lbl), b);
          if (dur > 0) {
            snprintf(b, sizeof(b), "%d:%02d", dur / 60, dur % 60);
            lv_label_set_text(id(pv_du_lbl), b);
            lv_bar_set_range(id(pv_prog), 0, dur);
            lv_bar_set_value(id(pv_prog), s, LV_ANIM_OFF);
          } else {
            lv_label_set_text(id(pv_du_lbl), "");
            lv_bar_set_value(id(pv_prog), 0, LV_ANIM_OFF);
          }

  # klok bijwerken (elke minuut via time:)

  # aanbellen: Home Assistant start bij aanbellen 30 s een livestream
  # (automatisering "Voordeur camerabeeld verversen", ~2 s na het aanbellen).
  # Tijdens die stream halen we steeds een vers beeld op via camera_proxy, door
  # Home Assistant zelf verkleind tot 480x360 (klein en snel). Lukt dat niet, dan
  # wachten we zoals vroeger op de Eufy-foto (komt ~62 s na het aanbellen).
  - id: bell_show
    mode: restart
    then:
      - lambda: |-
          id(bell_active) = true;
          id(bell_ev_at) = id(ev_state).state;
          id(bell_ev_shown) = false;
          id(bell_got) = false;
          id(bell_t0) = millis();
          lv_display_trigger_activity(nullptr);
          // deurbel gaat voor: groot hoesje vrijgeven zodat de foto past
          id(qimg_pending) &= ~(1u << 28);
          id(mp_big_url) = "";
          lv_obj_add_flag(id(mp_big), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(mp_big_icon), LV_OBJ_FLAG_HIDDEN);
          id(mp_big_img)->release();
      - lvgl.resume:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - lvgl.widget.hide: bell_view
      - lvgl.widget.show: bell_wait
      - lvgl.label.update:
          id: bell_wait
          text: "Live beeld van de voordeur wordt opgehaald…"
      - lvgl.page.show:
          id: page_bell
          animation: FADE_IN
          time: 200ms
      - delay: 4s   # de livestream start ~2 s na het aanbellen
      # live: zolang de stream loopt steeds het nieuwste beeld ophalen
      - while:
          condition:
            lambda: 'return (millis() - id(bell_t0)) < 33000;'
          then:
            - lambda: |-
                if (id(qimg_busy) || (id(qimg_pending) & (1u << 27))) return;   // vorige nog bezig
                std::string pic = id(cam_pic).state;
                if (pic.empty() || pic == "unknown" || pic == "unavailable") return;
                std::string u = pic[0] == '/' ? std::string("${ha_url}") + pic : pic;
                u += std::string(u.find('?') == std::string::npos ? "?" : "&") + "width=480&height=360&t=" + to_string(millis());
                id(cam_img)->set_url(u);
                id(qimg_pending) |= (1u << 27); id(qimg_next).execute();
            - delay: 1s
      - if:
          condition:
            lambda: 'return id(bell_got);'
          then:
            # laatste livebeeld nog 20 s laten staan
            - lambda: 'lv_display_trigger_activity(nullptr);'
            - delay: 20s
          else:
            # geen livebeeld: terugvallen op de Eufy-foto
            - lvgl.label.update:
                id: bell_wait
                text: "Wachten op de foto van de deurbel…"
            - while:
                condition:
                  lambda: 'return !id(bell_ev_shown) && (millis() - id(bell_t0)) < 120000;'
                then:
                  - lambda: |-
                      std::string ev = id(ev_state).state;
                      if (ev.empty() || ev == "unknown" || ev == "unavailable" || ev == id(bell_ev_at)) return;
                      std::string pic = id(ev_pic).state;
                      if (pic.empty() || pic == "unknown" || pic == "unavailable") return;
                      std::string u = pic[0] == '/' ? std::string("${ha_url}") + pic : pic;
                      u += (u.find('?') == std::string::npos ? "?t=" : "&t=") + to_string(millis());
                      id(cam_img)->set_url(u);
                      id(qimg_pending) |= (1u << 27); id(qimg_next).execute();
                      id(bell_ev_shown) = true;
                  - delay: 1500ms
            - if:
                condition:
                  lambda: 'return id(bell_ev_shown);'
                then:
                  - lambda: 'lv_display_trigger_activity(nullptr);'
                  - delay: 30s
                else:
                  - lvgl.label.update:
                      id: bell_wait
                      text: "Geen foto ontvangen"
                  - delay: 5s
      - script.execute: bell_hide

  # ---- schermvullend muziekscherm: toon speler nr. mp_view
  - id: mp_render
    then:
      - lambda: |-
          auto setl = [](lv_obj_t *o, const char *t) { const char *c = lv_label_get_text(o); if (c != nullptr && strcmp(c, t) == 0) return; lv_label_set_text(o, t); };
          auto showo = [](lv_obj_t *o) { if (lv_obj_has_flag(o, LV_OBJ_FLAG_HIDDEN)) lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN); };
          (void) setl; (void) showo;
          int n = id(mp_n);
          if (n <= 0) {
            lv_obj_add_flag(id(mp_full), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          if (id(mp_view) >= n) id(mp_view) = 0;
          if (id(mp_view) < 0) id(mp_view) = n - 1;
          int i = id(mp_view);
          lv_obj_t *nm[] = {id(mp_name_0), id(mp_name_1), id(mp_name_2), id(mp_name_3), id(mp_name_4), id(mp_name_5)};
          lv_obj_t *ti[] = {id(mp_title_0), id(mp_title_1), id(mp_title_2), id(mp_title_3), id(mp_title_4), id(mp_title_5)};
          lv_obj_t *ar[] = {id(mp_artist_0), id(mp_artist_1), id(mp_artist_2), id(mp_artist_3), id(mp_artist_4), id(mp_artist_5)};
          lv_obj_t *pp[] = {id(mp_pp_0), id(mp_pp_1), id(mp_pp_2), id(mp_pp_3), id(mp_pp_4), id(mp_pp_5)};
          std::string urls[] = {id(ma_url_0), id(ma_url_1), id(ma_url_2), id(ma_url_3), id(ma_url_4), id(ma_url_5)};
          setl(id(mp_big_name), lv_label_get_text(nm[i]));
          setl(id(mp_big_title), lv_label_get_text(ti[i]));
          setl(id(mp_big_artist), lv_label_get_text(ar[i]));
          setl(id(mp_big_pp), lv_label_get_text(pp[i]));
          int vols[] = {id(ma_vol_0), id(ma_vol_1), id(ma_vol_2), id(ma_vol_3), id(ma_vol_4), id(ma_vol_5)};
          if (strcasecmp(lv_label_get_text(id(mp_big_name)), "woonkamer") == 0 && !std::isnan(id(fav_vol).state))
            vols[i] = (int) lroundf(id(fav_vol).state * 100.0f);
          if (vols[i] >= 0 && !lv_obj_has_state(id(mp_big_vol), LV_STATE_PRESSED) && millis() - id(mp_vol_ts) > 3000) {
            lv_slider_set_value(id(mp_big_vol), vols[i], LV_ANIM_OFF);
            char vb[8]; snprintf(vb, sizeof(vb), "%d", vols[i]);
            setl(id(mp_big_volpct), vb);
          }
          char cb[12];
          snprintf(cb, sizeof(cb), "%d / %d", i + 1, n);
          setl(id(mp_big_cnt), cb);
          if (n > 1) {
            showo(id(mp_big_prev));
            showo(id(mp_big_next));
            showo(lv_obj_get_parent(id(mp_big_cnt)));
          } else {
            lv_obj_add_flag(id(mp_big_prev), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(mp_big_next), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(lv_obj_get_parent(id(mp_big_cnt)), LV_OBJ_FLAG_HIDDEN);
          }
          // zone-knop alleen bij woonkamer / woonkamer totaal / eettafel; tekst = waar hij heen gaat
          {
            static const char *zid[] = {"${mz_woonkamer}", "${mz_totaal}", "${mz_eettafel}"};
            static const char *znm[] = {"NAAR WOONKAMER", "NAAR TOTAAL", "NAAR EETTAFEL"};
            std::string pids[] = {id(ma_pid_0), id(ma_pid_1), id(ma_pid_2), id(ma_pid_3), id(ma_pid_4), id(ma_pid_5)};
            int z = -1;
            for (int k = 0; k < 3; k++) if (pids[i] == zid[k]) z = k;
            if (z < 0 && id(mp_follow_pid).empty()) {
              lv_obj_add_flag(id(mp_zone_btn), LV_OBJ_FLAG_HIDDEN);
            } else {
              setl(id(mp_zone_lbl), !id(mp_follow_pid).empty() || z < 0 ? "BEZIG..." : znm[(z + 1) % 3]);
              showo(id(mp_zone_btn));
            }
          }
          // disco-knop: alleen als de Hue-speler bestaat (en niet zelf de getoonde speler is)
          {
            std::string pids[] = {id(ma_pid_0), id(ma_pid_1), id(ma_pid_2), id(ma_pid_3), id(ma_pid_4), id(ma_pid_5)};
            static int last = -1;
            if (id(disco_pid).empty() || pids[i].empty() || pids[i] == id(disco_pid)) {
              lv_obj_add_flag(id(mp_disco_btn), LV_OBJ_FLAG_HIDDEN);
            } else {
              bool on = (millis() - id(disco_t) < 6000) ? id(disco_on_ui) : id(disco_leader) == pids[i];
              if ((int) on != last) { last = on; id(disco_style)->execute(on); }
              showo(id(mp_disco_btn));
            }
          }
          std::string u = urls[i];
          // voor het grote plaatje een grotere bron vragen (anders wordt 80/200 px opgeblazen)
          size_t q;
          if ((q = u.find("size=80")) != std::string::npos) u.replace(q, 7, "size=256");   // Music Assistant kent alleen 0/80/160/256/512/1024
          if ((q = u.find("200x200bb")) != std::string::npos) u.replace(q, 9, "300x300bb");
          if ((q = u.find("ab67616d00004851")) != std::string::npos) u.replace(q, 16, "ab67616d00001e02");
          if (id(page_player)->is_showing() || id(bell_active)) {
            // op de spelerpagina is het grote scherm onzichtbaar: geheugen vrijgeven voor de wachtrij
            id(qimg_pending) &= ~(1u << 28);
            if (!id(mp_big_url).empty()) {
              id(mp_big_url) = "";
              lv_obj_add_flag(id(mp_big), LV_OBJ_FLAG_HIDDEN);
              showo(id(mp_big_icon));
              id(mp_big_img)->release();
            }
          } else if (u != id(mp_big_url)) {
            if (u != id(mp_big_try_url)) { id(mp_big_try_url) = u; id(mp_big_fails) = 0; }
            id(mp_big_url) = u;
            if (u.empty()) {
              lv_obj_add_flag(id(mp_big), LV_OBJ_FLAG_HIDDEN);
              showo(id(mp_big_icon));
            } else if (id(mp_big_fails) >= 3 && millis() < id(mp_big_retry_at)) {
              // 3x of vaker mislukt: wachten (1 min, daarna 5 min) en dan opnieuw proberen
              id(mp_big_url) = "";
            } else {
              // oude hoes verbergen terwijl de nieuwe binnenkomt (buffer wordt vervangen)
              lv_obj_add_flag(id(mp_big), LV_OBJ_FLAG_HIDDEN);
              showo(id(mp_big_icon));
              { size_t q = u.find("_thumb1200"); if (q != std::string::npos) u.replace(q, 10, "_thumb250"); q = u.find("_thumb500"); if (q != std::string::npos) u.replace(q, 9, "_thumb250"); }  /* art_thumb_fix */ id(mp_big_img)->set_url(u);
              id(qimg_pending) |= (1u << 28); id(qimg_next).execute();
            }
          }
          showo(id(mp_full));

  # ---- zone-knop: wachtrij verplaatsen woonkamer -> woonkamer totaal -> eettafel -> woonkamer
  - id: mp_zone_next
    mode: single
    then:
      - lambda: |-
          static const char *zid[] = {"${mz_woonkamer}", "${mz_totaal}", "${mz_eettafel}"};
          std::string pids[] = {id(ma_pid_0), id(ma_pid_1), id(ma_pid_2), id(ma_pid_3), id(ma_pid_4), id(ma_pid_5)};
          id(mz_target) = "";
          if (!id(mp_follow_pid).empty()) return;   // vorige verplaatsing nog bezig
          int i = id(mp_view);
          if (i < 0 || i > 5) return;
          int z = -1;
          for (int k = 0; k < 3; k++) if (pids[i] == zid[k]) z = k;
          if (z < 0) return;
          id(mz_src) = pids[i];
          id(mz_target) = zid[(z + 1) % 3];
          id(mp_follow_pid) = id(mz_target);   // hoesscherm gaat mee naar de nieuwe speler
          id(mp_follow_t) = millis();
          lv_label_set_text(id(mp_zone_lbl), "BEZIG...");
          lv_display_trigger_activity(nullptr);
      - if:
          condition:
            lambda: 'return !id(mz_target).empty();'
          then:
            - script.execute:
                id: ma_send
                payload: !lambda |-
                  return std::string("{\"message_id\": \"7\", \"command\": \"player_queues/transfer\", \"args\": {\"source_queue_id\": \"") +
                         id(mz_src) + "\", \"target_queue_id\": \"" + id(mz_target) + "\", \"auto_play\": true}}";

  # ---- disco-knop: Hue disco woonkamer aan de spelergroep toevoegen of eruit halen
  - id: disco_style
    parameters:
      aan: bool   # niet 'on': YAML leest dat als true
    then:
      - lambda: |-
          // knop blijft donker; de schakelaar en de discobal laten de stand zien
          uint32_t c = aan ? 0x2B2F36 : 0x8B9099;   // thema: tekst / gedimd
          lv_obj_t *ico = id(mp_disco_ico);
          for (uint32_t i = 0; i < lv_obj_get_child_count(ico); i++) {
            lv_obj_t *ch = lv_obj_get_child(ico, i);
            if (lv_obj_check_type(ch, &lv_line_class)) lv_obj_set_style_line_color(ch, lv_color_hex(c), 0);
            else lv_obj_set_style_border_color(ch, lv_color_hex(c), 0);
          }
          lv_obj_t *tr = id(mp_disco_lbl);
          lv_obj_set_style_bg_color(tr, lv_color_hex(aan ? ${c_accent} : 0x1E2A3B), 0);
          lv_obj_set_style_border_color(tr, lv_color_hex(aan ? ${c_accent} : 0x2E3D52), 0);
          lv_obj_t *kn = id(mp_disco_knob);
          lv_obj_set_style_bg_color(kn, lv_color_hex(aan ? id(r_tcol)[8] : 0x3A4A62), 0);
          lv_obj_align(kn, LV_ALIGN_LEFT_MID, aan ? 32 : 4, 0);

  - id: disco_toggle
    mode: single
    then:
      - lambda: |-
          std::string pids[] = {id(ma_pid_0), id(ma_pid_1), id(ma_pid_2), id(ma_pid_3), id(ma_pid_4), id(ma_pid_5)};
          id(disco_cmd) = "";
          int i = id(mp_view);
          if (id(disco_pid).empty() || i < 0 || i > 5 || pids[i].empty() || pids[i] == id(disco_pid)) return;
          // huidige stand: kort na een tik geldt wat we zelf net gezet hebben
          bool on = (millis() - id(disco_t) < 6000) ? id(disco_on_ui) : id(disco_leader) == pids[i];
          bool want = !on;
          id(disco_on_ui) = want;
          id(disco_t) = millis();
          id(disco_style)->execute(want);
          lv_display_trigger_activity(nullptr);
          if (want)
            id(disco_cmd) = std::string("{\"message_id\": \"8\", \"command\": \"players/cmd/group\", \"args\": {\"player_id\": \"") +
                            id(disco_pid) + "\", \"target_player\": \"" + pids[i] + "\"}}";
          else
            id(disco_cmd) = std::string("{\"message_id\": \"8\", \"command\": \"players/cmd/ungroup\", \"args\": {\"player_id\": \"") +
                            id(disco_pid) + "\"}}";
      - if:
          condition:
            lambda: 'return !id(disco_cmd).empty();'
          then:
            - script.execute:
                id: ma_send
                payload: !lambda 'return id(disco_cmd);'

  - id: mp_step
    parameters:
      d: int
    then:
      - lambda: |-
          int n = id(mp_n);
          if (n <= 0) return;
          id(mp_view) = ((id(mp_view) + d) % n + n) % n;
          lv_display_trigger_activity(nullptr);
      - script.execute: mp_render

  # ---- favorieten: lijsten ophalen uit Music Assistant (meest gespeeld bovenaan)
  - id: fav_fetch
    mode: single
    then:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 60s
      - lambda: 'id(fav_new).clear(); id(fav_ok) = true;'
      - script.execute:
          id: fav_get
          kind: radio
      - script.wait: fav_get
      - script.execute:
          id: fav_get
          kind: playlist
      - script.wait: fav_get
      - if:
          condition:
            lambda: 'return id(fav_ok) && !id(fav_new).empty();'
          then:
            - script.execute: fav_build
          else:
            - lambda: 'id(fav_new).clear();'

  # ---- favorieten: één lijst ophalen (kind = radio of playlist)
  - id: fav_get
    parameters:
      kind: string
    then:
      - http_request.post:
            url: "${ma_url}/api"
            request_headers:
              Content-Type: application/json
              Authorization: "Bearer ${ma_token}"
            body: !lambda |-
              return std::string("{\"message_id\": \"fav_") + kind + "\", \"command\": \"music/" + kind + "s/library_items\", \"args\": {\"favorite\": true, \"order_by\": \"play_count_desc\", \"limit\": 150}}";
            capture_response: true
            max_response_buffer_size: 262144
            on_response:
              then:
                  - lambda: |-
                      if (response->status_code != 200) {
                        ESP_LOGW("fav", "%s: HTTP %d", kind.c_str(), response->status_code);
                        id(fav_ok) = false;
                        return;
                      }
                      bool arr = false;
                      for (char c : body) {
                        if (c == ' ' || c == '\n' || c == '\r' || c == '\t') continue;
                        arr = (c == '[');
                        break;
                      }
                      JsonDocument filter;
                      JsonObject ef = arr ? filter.add<JsonObject>() : filter["items"].add<JsonObject>();
                      ef["name"] = true;
                      ef["uri"] = true;
                      ef["item_id"] = true;
                      ef["image"]["path"] = true;
                      ef["image"]["provider"] = true;
                      ef["image"]["proxy_id"] = true;
                      ef["metadata"]["images"][0]["path"] = true;
                      ef["metadata"]["images"][0]["provider"] = true;
                      ef["metadata"]["images"][0]["proxy_id"] = true;
                      JsonDocument doc;
                      if (deserializeJson(doc, body, DeserializationOption::Filter(filter))) {
                        ESP_LOGW("fav", "%s: JSON-fout", kind.c_str());
                        id(fav_ok) = false;
                        return;
                      }
                      JsonArray lst = arr ? doc.as<JsonArray>() : doc["items"].as<JsonArray>();
                      int k = 0;
                      for (JsonObject it : lst) {
                        std::string uri = it["uri"] | "";
                        if (uri.empty()) {
                          std::string iid = it["item_id"] | "";
                          if (iid.empty()) continue;
                          uri = std::string("library://") + kind + "/" + iid;
                        }
                        std::string pxid, pth;
                        JsonObject cands[2] = {it["image"], it["metadata"]["images"][0]};
                        for (auto &c : cands) {
                          if (c.isNull()) continue;
                          std::string px = c["proxy_id"] | "";
                          std::string p = c["path"] | "";
                          if (px.empty() && p.empty()) continue;
                          pxid = px;
                          pth = p;
                          break;
                        }
                        std::string img;
                        if (!pxid.empty()) img = std::string("${ma_url}/imageproxy/") + pxid + "?size=80&fmt=jpeg";
                        else if (pth.rfind("https://i.scdn.co/image/ab67616d0000b273", 0) == 0) { img = pth; img.replace(24, 16, "ab67616d00004851"); }
                        else if (pth.rfind("https://mosaic.scdn.co/640/", 0) == 0) { img = pth; img.replace(23, 3, "300"); }
                        else if (pth.rfind("http", 0) == 0) img = pth;
                        id(fav_new).push_back(it["name"] | "");
                        id(fav_new).push_back(uri);
                        id(fav_new).push_back(img);
                        k++;
                      }
                      ESP_LOGI("fav", "%s: %d favorieten", kind.c_str(), k);
            on_error:
              then:
                - lambda: 'id(fav_ok) = false;'

  # ---- favorieten: knoppen (opnieuw) opbouwen; hoesjes die al binnen zijn blijven bewaard
  - id: fav_build
    then:
      - lambda: |-
          auto &nw = id(fav_new);
          id(fav_loaded_ms) = millis();
          std::string sig;
          for (auto &x : nw) { sig += x; sig += '\x1f'; }
          if (sig == id(fav_sig)) { nw.clear(); id(fav_art_kick).execute(); return; }
          id(fav_sig) = sig;
          size_t cnt = nw.size() / 3;
          std::vector<lv_image_dsc_t *> keep(cnt, nullptr);
          for (size_t j = 0; j < id(fav_uris).size(); j++) {
            lv_image_dsc_t *d = id(fav_dsc)[j];
            if (d == nullptr) continue;
            bool used = false;
            for (size_t k = 0; k < cnt; k++) {
              if (keep[k] == nullptr && nw[k * 3 + 1] == id(fav_uris)[j] && nw[k * 3 + 2] == id(fav_urls)[j]) {
                keep[k] = d;
                used = true;
                break;
              }
            }
            if (!used) {
              heap_caps_free((void *) d->data);
              delete d;
            }
          }
          static const uint32_t L[] = {0xE6E8EC, 0xECEEF1, 0x9BE6CC, 0x2B2F36, 0x8B9099, 0x1F3A33, 0x3FAE8E, 0xA7ADB8, 0xFFFFFF, 0xC9CDD4, 0xDDE0E5, 0xD9DCE2, 0xB0B8C0, 0xA1A6AF, 0xF6B8B0, 0x7A1F17, 0xDCEBFF, 0x1E4D3C, 0x19403A, 0x245C48, 0xE8745C, 0x46201A};
          auto col = [](int sl) -> lv_color_t {
            uint32_t v = id(r_tcol)[sl];
            return lv_color_hex(v ? v : L[sl]);
          };
          // alleen tekens die het r_mono-lettertype heeft (hoofdletters)
          auto clean = [](const std::string &in) -> std::string {
            static const char *OKA = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:,.-/% ()+!?'&#=;";
            static const unsigned char OKU[] = {0x89, 0x88, 0x8B, 0x9C, 0x96, 0x84, 0x8F, 0x81, 0x93, 0x9A, 0x82, 0x8A, 0x8E, 0x94, 0x9B, 0x87, 0x91, 0x80, 0x99, 0x8C, 0x92};
            std::string o;
            size_t i = 0;
            while (i < in.size()) {
              unsigned char c = in[i];
              if (c < 0x80) {
                char u = toupper(c);
                o += (u != 0 && strchr(OKA, u)) ? u : ' ';
                i++;
                continue;
              }
              int len = c >= 0xF0 ? 4 : c >= 0xE0 ? 3 : c >= 0xC0 ? 2 : 1;
              if (c == 0xC3 && i + 1 < in.size()) {
                unsigned char d = in[i + 1];
                if (d >= 0xA0 && d <= 0xBE && d != 0xB7) d -= 0x20;
                for (auto okc : OKU) if (okc == d) { o += (char) 0xC3; o += (char) d; break; }
              } else if (c == 0xC2 && i + 1 < in.size() && ((unsigned char) in[i + 1] == 0xB7 || (unsigned char) in[i + 1] == 0xB0)) {
                o += in.substr(i, 2);
              } else if (len == 3 && i + 2 < in.size() && (unsigned char) in[i + 1] == 0x80 && (unsigned char) in[i + 2] == 0x93) {
                o += in.substr(i, 3);
              } else if (len == 3 && i + 2 < in.size() && (unsigned char) in[i + 1] == 0x82 && (unsigned char) in[i + 2] == 0xAC) {
                o += in.substr(i, 3);
              }
              i += len;
            }
            std::string r;
            for (char ch : o) {
              if (ch == ' ' && (r.empty() || r.back() == ' ')) continue;
              r += ch;
            }
            while (!r.empty() && r.back() == ' ') r.pop_back();
            return r.empty() ? std::string("?") : r;
          };
          const lv_font_t *fmono = lv_obj_get_style_text_font(id(r_fav_now), LV_PART_MAIN);
          const lv_font_t *ficon = lv_obj_get_style_text_font(id(fav_vol_ico), LV_PART_MAIN);
          lv_obj_t *cols[2] = {id(fav_list_r), id(fav_list_p)};
