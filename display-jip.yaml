  # ---- nachtstand: kleuren omzetten (full = alle pagina's, anders alleen het actieve scherm)
  - id: night_remap
    mode: queued
    parameters:
      full: bool
    then:
      - lambda: |-
          // RETRO: kleuren altijd volgens het gekozen thema (basiskleuren of vorig thema -> huidig thema)
          static const uint32_t LIGHT[] = {0xE6E8EC, 0xECEEF1, 0x9BE6CC, 0x2B2F36, 0x8B9099, 0x1F3A33, 0x3FAE8E, 0xA7ADB8, 0xFFFFFF, 0xC9CDD4, 0xDDE0E5, 0xD9DCE2, 0xB0B8C0, 0xA1A6AF, 0xF6B8B0, 0x7A1F17, 0xDCEBFF, 0x1E4D3C, 0x19403A, 0x245C48, 0xE8745C, 0x46201A};
          static const uint32_t THEMES[8][22] = {{0x0C101C, 0x161E30, 0xF5A623, 0xD6E2FA, 0x7A8AA8, 0x3C2400, 0xF7B84A, 0x04060C, 0x22304C, 0x2C3A58, 0x22304C, 0x2C3A58, 0x7A8AA8, 0x7A8AA8, 0x5A2622, 0xF2A59C, 0x18263F, 0x1C2C4E, 0x18263F, 0x2C406C, 0xF5A623, 0x3C2400}, {0x100A1A, 0x201632, 0xFF4DA6, 0x96F0FF, 0x9682B4, 0x32001E, 0x00E0FF, 0x05030A, 0x2E2048, 0x3A2A58, 0x2E2048, 0x3A2A58, 0x9682B4, 0x9682B4, 0x5A2236, 0xFFA3C8, 0x2E184C, 0x3A1E5E, 0x2E184C, 0x5C348C, 0xFF4DA6, 0x32001E}, {0x121417, 0x20252B, 0x5ED3AC, 0xE8ECF0, 0x8E96A1, 0x0E3026, 0x7EE0BF, 0x060708, 0x2C333B, 0x3A414A, 0x2C333B, 0x3A414A, 0x8E96A1, 0x8E96A1, 0x5A2622, 0xF2A59C, 0x22282F, 0x282E36, 0x22282F, 0x3C444E, 0x5ED3AC, 0x0E3026}, {0x181210, 0x2C221E, 0xFF7F60, 0xFAE8D6, 0xAA9484, 0x46180E, 0xFFB05C, 0x080504, 0x3A2E28, 0x4A3A32, 0x3A2E28, 0x4A3A32, 0xAA9484, 0xAA9484, 0x5A2622, 0xF2A59C, 0x3A2C26, 0x46342C, 0x3A2C26, 0x624A3E, 0xFF7F60, 0x46180E}, {0x007042, 0x005C36, 0xDE2C22, 0xFAFAFA, 0xBEE1CD, 0xFAFAF8, 0xF5F5F5, 0x002A18, 0x00824E, 0x004A2C, 0x00824E, 0x004A2C, 0xBEE1CD, 0xBEE1CD, 0x5A2622, 0xF2A59C, 0x181818, 0x0E0E0E, 0x181818, 0x303030, 0xDE2C22, 0xFAFAF8}, {0x2C1200, 0x5C2800, 0xFFC446, 0xFFF8F0, 0xFFBE8C, 0x461A00, 0xFFAA3C, 0x140800, 0x783600, 0x803C0C, 0x783600, 0x803C0C, 0xFFBE8C, 0xFFBE8C, 0x5A2622, 0xF2A59C, 0xB04C00, 0xCC5C00, 0xB04C00, 0xE07A20, 0xFFC446, 0x461A00}, {0x68B0E2, 0x80C0EC, 0x10285C, 0x0A1C42, 0x24467C, 0xFAFAFA, 0x14306A, 0x3A78B0, 0x96CEF2, 0x5496CC, 0x96CEF2, 0x5496CC, 0x24467C, 0x24467C, 0x5A2622, 0xF2A59C, 0x8AC6F0, 0xA0D4F6, 0x8AC6F0, 0x5A9AD0, 0x10285C, 0xFAFAFA}, {0x101114, 0x1E2026, 0xE21C21, 0xF2F2F4, 0x969BA6, 0xFFFFFF, 0xFFD21E, 0x060708, 0x2E3138, 0x3E424C, 0x2E3138, 0x3E424C, 0x969BA6, 0x969BA6, 0x5A2622, 0xF2A59C, 0x24262C, 0x2A2C33, 0x24262C, 0x40434C, 0xE21C21, 0xFFFFFF}};
          static const int N = 22;
          int ti = std::max(0, std::min(7, id(theme_idx)));
          int tp = std::max(0, std::min(7, id(theme_prev)));
          const uint32_t *to = THEMES[ti];
          for (int i = 0; i < N; i++) id(r_tcol)[i] = to[i];
          const uint32_t *from = LIGHT;
          const uint32_t *from2 = THEMES[tp];
          static const lv_style_prop_t PROPS_ALL[] = {LV_STYLE_BG_COLOR, LV_STYLE_TEXT_COLOR, LV_STYLE_BORDER_COLOR,
              LV_STYLE_SHADOW_COLOR, LV_STYLE_OUTLINE_COLOR, LV_STYLE_ARC_COLOR, LV_STYLE_LINE_COLOR, LV_STYLE_BG_GRAD_COLOR};
          static const lv_style_prop_t PROPS_FAST[] = {LV_STYLE_BG_COLOR, LV_STYLE_TEXT_COLOR, LV_STYLE_BORDER_COLOR,
              LV_STYLE_SHADOW_COLOR};
          static const lv_part_t PARTS_ALL[] = {LV_PART_MAIN, LV_PART_INDICATOR, LV_PART_KNOB, LV_PART_SCROLLBAR, LV_PART_ITEMS,
              LV_PART_SELECTED};
          static const lv_part_t PARTS_FAST[] = {LV_PART_MAIN, LV_PART_INDICATOR, LV_PART_KNOB};
          static const lv_state_t STATES_ALL[] = {LV_STATE_DEFAULT, LV_STATE_PRESSED, LV_STATE_CHECKED,
              (lv_state_t) (LV_STATE_CHECKED | LV_STATE_PRESSED), LV_STATE_FOCUSED};
          static const lv_state_t STATES_FAST[] = {LV_STATE_DEFAULT, LV_STATE_CHECKED};
          std::function<void(lv_obj_t *, bool)> walk = [&](lv_obj_t *o, bool all) {
            if (o == nullptr) return;
            static uint32_t cnt = 0;
            if ((++cnt & 63) == 0) App.feed_wdt();
            const lv_style_prop_t *props = all ? PROPS_ALL : PROPS_FAST;
            int np = all ? 8 : 4;
            const lv_part_t *parts = all ? PARTS_ALL : PARTS_FAST;
            int npa = all ? 6 : 3;
            const lv_state_t *states = all ? STATES_ALL : STATES_FAST;
            int nst = all ? 5 : 2;
            for (int a = 0; a < npa; a++) {
              for (int b = 0; b < nst; b++) {
                lv_style_selector_t sel = parts[a] | states[b];
                for (int c = 0; c < np; c++) {
                  lv_style_value_t v;
                  if (lv_obj_get_local_style_prop(o, props[c], &v, sel) != LV_RESULT_OK) continue;
                  uint32_t col = lv_color_to_u32(v.color) & 0xFFFFFF;
                  for (int i = 0; i < N; i++) {
                    if (col == from[i] || (tp != ti && col == from2[i])) {
                      v.color = lv_color_hex(to[i]);
                      lv_obj_set_local_style_prop(o, props[c], v, sel);
                      break;
                    }
                  }
                }
              }
            }
            uint32_t n = lv_obj_get_child_count(o);
            for (uint32_t i = 0; i < n; i++) walk(lv_obj_get_child(o, i), all);
          };
          if (full) {
            walk(id(page_rhome)->obj, true);
            walk(id(page_rmenu)->obj, true);
            walk(id(page_rlamp)->obj, true);
            walk(id(page_rweer)->obj, true);
            App.feed_wdt();
            App.feed_wdt();
            walk(id(page_favs)->obj, true);
            App.feed_wdt();
            walk(id(page_music)->obj, true);
            App.feed_wdt();
            walk(id(page_scenes)->obj, true);
            App.feed_wdt();
            App.feed_wdt();
            walk(id(page_info)->obj, true);
            walk(id(page_morgen)->obj, true);
            App.feed_wdt();
            walk(id(page_energy)->obj, true);
            // @zon-begin
            walk(id(page_zon)->obj, true);
            // @zon-einde
            App.feed_wdt();
            walk(id(page_bell)->obj, true);
            App.feed_wdt();
            walk(id(page_player)->obj, true);
            walk(id(page_pc)->obj, true);
            App.feed_wdt();
            App.feed_wdt();
          } else {
            walk(lv_screen_active(), false);
          }

