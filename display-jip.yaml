# =====================================================================
# ROBOBOOZ - retro-thema voor ESPHome / LVGL
# Ontwerp en bouw: Jeroen van Sonsbeek
#
# display-jip - Guition ESP32-S3-4848S040 (480x480) - Slaapkamer Jip
#   (afgeleid van display-studio; standaardthema RACE)
# Pagina's (Menu): Lampen | Favorieten | Muziek (Nu speelt, alleen kijkpaal) |
#           Sfeer | Kachel | Weer | Energie (+ Zonnestroom) | Info | Nachtstand |
#           Home Assistant | Thema
#           (+ verborgen: NIET STOREN, Wachtrij, Deurbel, Goedemorgen, Intercom)
# Navigatie: rechtsboven THUIS (accentkleur) en MENU op elke pagina;
#   vegen naar links/rechts kan ook.
# Thuis: tik op het klokvak = alle lampen van Jip aan/uit; tijd, datum,
#   3 nieuwsregels en een finishvlag; weer, kamertegel (temperatuur kamer;
#   vonkjes = kachel aan, vlokjes = uit; tik = Kachel), energie met
#   energiekosten van vandaag en ZON/NET live, hoes met VU-meter.
# Zonnestroom (@zon-blokken, gelijk aan woonkamer): tik op 'Bespaard door
#   zon vandaag' op Energie; omvormer + P1 live, 'goed moment om te wassen'.
#   Vakjes zon/huis/net in de tegelkleur van het thema (zon was onleesbaar).
#   Knoppen onderin: Lampen | Favoriet | Sfeer | Kachel | Menu.
# Kachel: alleen het paneel (climate.paneel_jip), niet de smartplug.
#   Kachel aan = kiezen uit 15, 30 of 60 min, dan
#   script.paneel_jip_timer_starten (veld minuten; resterende minuten
#   onder de knop; rechts in de tegel kamertemperatuur en gewenst, tik
#   daarop = venster om de gewenste temperatuur in te stellen, 5-30 °C);
#   Kachel uit = één tik (script.paneel_jip_uit);
#   NIET STOREN = input_boolean.jip_niet_storen (rood scherm, deurbel stil).
# Intercom: tik op het gele satellietblok in de LIVE-balk. 12 kanalen zoals
#   op de studio; PUSH TO TALK speelt het bericht op de kijkpaal van Jip
#   (script.intercom_zend met speler). Ontvanger HIER / WOONKAMER / STUDIO:
#   PUSH TO TALK stuurt het kanaal daarheen, het telefoonvak een oproep
#   van Jeroen (script.intercom_bel, op de speaker van die kamer).
#   Berichten met ElevenLabs-audiotags; de tags staan niet in het log,
#   lange logregels lopen door.
# LIVE-balk: ROBOBOOZ-roast (AI), buiten, verbruik en deur.
# Favorieten: alle radiozenders en playlists uit Music Assistant, meest
#   gespeeld bovenaan, scrollbaar.
# Muziek: alleen de kijkpaal, via beide MA-spelers (ec5bd534-... = cast en
#   dashboard:chromecast_ec5bd534-...); volumeslider voor de kijkpaal; radio zoekt de hoes op via iTunes
#   (onthouden per nummer, ook als er meer zenders tegelijk spelen);
#   bij reclame ('Advert') de eigen hoes uit /config/www/robobooz/.
# Lampen: Alles, Lamp, Ledstrip en Vitrine. Tik op het icoontje = aan/uit,
#   tik ernaast = details (helderheid, kleuren); blokjesbalk = helderheid.
# Sfeer: scènes van slaapkamer Jip (Helder, Gedimd, Lezen, Concentreren,
#   Jip blauw; vegen = dimmen), ALLES UIT en RANDOM KLEUREN.
# Weer: nu + temperatuur per uur, regen komende 2 uur met het weericoon van nu als watermerk (Buienradar, 12 balkjes van 10 min), komende dagen.
# Home Assistant: services, CPU/geheugen/schijf, uptime, grafiek, terminal.
# Thema's A-H: Nachtblauw, Paars & neon, Antraciet & mint, Espresso & koraal,
#   NEC, Oranje, NMHC, RACE. Kiezen via Menu > Thema; display Jip volgt
#   input_select.display_thema niet (eigen thema, standaard RACE).
# Scherm: eerste tik maakt alleen wakker; na 1 min 65%, na 2 min 35%,
#   na 30 min nachtstand (niet tijdens NIET STOREN). Tussen 23:00 en 06:00
#   automatisch nachtstand, behalve als er muziek speelt of er lampen aan zijn.
# Watchdog 30 s: het aanmaken van alle pagina's bij het opstarten duurt
#   langer dan de standaard 5 s.
# Diagnose in HA: sensoren 'Stapel hoofdtaak vrij' (B) en 'Intern RAM vrij' (kB).
# Geheugen: hoesbuffer 210x210 (88 KB, was 460 KB). Hoofdtaak-stapel 16 KB
#   (loop_task_stack_size): met 8 KB liep hij bij het opstarten over.
# Aanraken: de touchchip van het nieuwe paneel (1 relais) meldt zich als
#   1024x600 scherm; met calibration 0..479 klopt de plek van elke tik weer.
# Relais: het board heeft 1 relais; nog niet in gebruik.
# secrets.yaml: wifi, ma_api_token, plate03_* (API-/OTA-/AP-sleutels) en de
#   huisgenoten persoon_1..3_naam en persoon_1..3_entity (zie secrets.example.yaml).
#
# Vereist in Home Assistant: ESPHome-integratie -> display-jip -> Configureren ->
# "Sta het apparaat toe Home Assistant-acties uit te voeren" AAN.
# Gebruikt in Home Assistant: light.slaapkamer_jip_2 (groep), light.slaapkamer_jip,
#   light.lichtstrip_jip, light.hue_color_light_1, scene.slaapkamer_jip_*,
#   sensor.thermo_slaapkamer_jip_*, media_player.kijkpaal_woonkamer
#   (Music Assistant-speler van de kijkpaal),
#   climate.paneel_jip, binary_sensor.paneel_jip_aan, sensor.paneel_jip_resterend,
#   timer.paneel_jip_timer, script.paneel_jip_timer_starten, script.paneel_jip_uit,
#   input_boolean.jip_niet_storen, script.intercom_zend, script.intercom_bel,
#   input_text.intercom_log, input_text.nieuws_display, input_text.display_roast,
#   input_text.server_info_display, input_text.server_hist_cpu,
#   input_text.server_hist_temp, input_text.weer_uren_display,
#   input_text.weer_dagen_display, input_text.ochtend_info_display,
#   input_text.ochtend_agenda_display, sensor.neerslag_buienradar_regen_data,
#   System Monitor-sensoren, script.lampen_random_kleuren en
#   /config/www/robobooz/ (krrrcht_in.mp3, intro_5..8.mp3, intro_12.mp3, advert-hoes).
# =====================================================================

esphome:
  name: display-jip
  friendly_name: Display Jip
  min_version: 2025.7.0
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    - priority: -200
      then:
        - delay: 45s
        - script.execute: fav_fetch
    # grote beeldbuffers direct bij het opstarten reserveren, voordat het PSRAM versnipperd raakt
    - priority: 800
      then:
        - lambda: |-
            id(big_buf) = (uint16_t *) heap_caps_malloc(210 * 210 * 2, MALLOC_CAP_SPIRAM);   // hoes in kader 210x210 (was 480x480: 372 KB te veel)
    - priority: -100
      then:
        - lambda: |-
            ESP_LOGI("geheugen", "hoofdtaak: minimaal %u bytes stapel vrij gebleven; intern RAM vrij %u KB",
                     (unsigned) uxTaskGetStackHighWaterMark(nullptr), (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024));
            ESP_LOGI("geheugen", "hoesbuffer %s, PSRAM vrij %u KB, grootste blok %u KB",
                     id(big_buf) ? "ok" : "MISLUKT",
                     (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024),
                     (unsigned) (heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM) / 1024));
            // klok/temperatuur over de hoes: wit + zwarte rand samen ~65% dekkend (0-255)
            lv_obj_set_style_opa_layered(id(mp_big_clock_box), 166, 0);

# grote LVGL-config: zonder dit faalt het linken met
# "dangerous relocation: l32r: literal target out of range".
# Vereist de map components/ (uit de repo) naast deze yaml.
external_components:
  - source:
      type: local
      path: components
    components: [robobooz_build]

robobooz_build:

# ---------------------------------------------------------------- hardware
# Guition ESP32-S3-4848S040 (overgenomen uit esphome-modular-lvgl-buttons)
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  # opstarten (alle LVGL-pagina's aanmaken) duurt langer dan de standaard 5 s
  watchdog_timeout: 30s
  framework:
    type: esp-idf
    advanced:
      # hoofdtaak 16 KB i.p.v. 8 KB: het aanmaken van alle pagina's in één keer liet de
      # standaardstapel overlopen (crash 'Abort' op core 1 bij het opstarten)
      loop_task_stack_size: 16384
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      # gewone malloc/new mag PSRAM gebruiken (anders loopt het interne RAM vol bij het decoderen van hoesjes)
      CONFIG_SPIRAM_USE_MALLOC: y
      # alleen allocaties tot 512 bytes intern; de rest (strings, JSON, favorieten) naar PSRAM.
      # Bij 4096 liep het interne RAM vol (9-16 KB vrij) en faalde elke https-download (esp-aes).
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "512"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "49152"
      # https (iTunes-hoesjes e.d.) mag zijn geheugen uit het PSRAM halen; anders faalt TLS bij krap intern RAM
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: y
      # AES in software: hardware-AES vraagt een intern DMA-buffer en faalde met "esp-aes: Failed to allocate memory"
      CONFIG_MBEDTLS_HARDWARE_AES: n
      # TLS-buffers alleen vasthouden zolang een verbinding ze nodig heeft
      CONFIG_MBEDTLS_DYNAMIC_BUFFER: y

psram:
  mode: octal
  speed: 80MHz

preferences:
  flash_write_interval: 5min

logger:
  level: INFO

api:
  encryption:
    key: !secret plate03_api_key

ota:
  - platform: esphome
    password: !secret plate03_ota_password
    on_begin:
      then:
        - light.turn_off: display_backlight
        - lvgl.pause:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Plate02 Fallback Hotspot"
    password: !secret plate03_ap_password

captive_portal:

output:
  - platform: ledc
    pin: GPIO38
    id: gpio_backlight_pwm
    frequency: 100Hz

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Schermverlichting
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 400ms

i2c:
  - id: bus_a
    sda:
      number: 19
    scl:
      number: 45
      ignore_strapping_warning: true

touchscreen:
  platform: gt911
  id: my_touchscreen
  display: my_display
  i2c_id: bus_a
  # nieuw paneel: GT911 geeft 0..479 door maar meldt 1024x600; vast bereik instellen
  calibration:
    x_min: 0
    x_max: 479
    y_min: 0
    y_max: 479
  on_touch:
    # scherm gedimd/uit: deze tik alleen om wakker te maken (LVGL negeert hem tot loslaten)
    - lambda: |-
          auto &bl = id(display_backlight).current_values;
          bool slaap = !bl.is_on() || bl.get_brightness() < 0.99f || id(lvgl_main)->is_paused();
          if (slaap) {
            lv_indev_t *in = lv_indev_get_next(nullptr);
            if (in != nullptr) lv_indev_wait_release(in);
          }
    - lvgl.resume:
    - light.turn_on:
        id: display_backlight
        brightness: 100%

spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

display:
  - platform: st7701s
    id: my_display
    update_interval: never
    auto_clear_enabled: false
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: false
    dimensions:
      width: 480
      height: 480
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    pclk_frequency: 12MHz
    pclk_inverted: false
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]
    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]

time:
  - platform: homeassistant
    id: system_time

