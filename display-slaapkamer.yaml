                      action: script.turn_on
                      data:
                        entity_id: script.wekker_slaapkamer_sluimer
                  - lambda: |-
                      auto t = id(system_time).now();
                      int m = (int) lroundf(std::isnan(id(wk_sluimer).state) ? 5.0f : id(wk_sluimer).state);
                      if (t.is_valid()) id(sluimer_tot) = (t.hour * 60 + t.minute + m) % 1440;
                  - lvgl.widget.hide: ring
                  - script.execute: wk_render
                widgets:
                  - label: {x: 16, y: 25, text: "${ic_snooze}", text_font: f_ic30}
