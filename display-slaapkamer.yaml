                  bg_color: ${c_inkbg}
                  bg_opa: COVER
                  text_color: ${c_papert}
                  pressed:
                    bg_color: ${c_blue}
                  on_click:
                    - homeassistant.action:
                        action: light.turn_off
                        data:
                          entity_id: light.slaapkamer_jeroen_maartje
                  widgets:
                    - label: {align: CENTER, y: -9, text: "${ic_power}", text_font: f_ic22}
                    - label: {align: CENTER, y: 16, styles: st_mono11, text: "LICHT UIT"}
              # BEDTIJD: rest van het huis uit en de thermostaat op 15 (script.bedtijd in HA)
              - button:
                  x: 380
                  y: 106
                  width: 80
                  height: 80
                  radius: 40
                  bg_color: ${c_blue}
                  bg_opa: COVER
                  text_color: ${c_papert}
                  pressed:
                    bg_color: ${c_blue}
                  # 2 seconden vasthouden: het rondje loopt vol met zwart, dan pas uitvoeren
                  on_press:
                    - lambda: |-
                        lv_obj_t *arc = id(bd_arc);
                        lv_anim_t a;
                        lv_anim_init(&a);
                        lv_anim_set_var(&a, arc);
                        lv_anim_set_values(&a, 0, 100);
                        lv_anim_set_duration(&a, 2000);
                        lv_anim_set_exec_cb(&a, [](void *o, int32_t v) { lv_arc_set_value((lv_obj_t *) o, v); });
                        lv_anim_start(&a);
                    - lvgl.label.update: {id: h_ok, text: "BEDTIJD: 2 SECONDEN VASTHOUDEN..."}
                    - lvgl.widget.show: h_ok
                    - script.execute: bd_hold
                  on_release:
                    - lambda: |-
                        lv_obj_t *arc = id(bd_arc);
                        lv_anim_delete(arc, nullptr);
                        lv_arc_set_value(arc, 0);
                    - if:
                        condition:
                          script.is_running: bd_hold
                        then:
                          - script.stop: bd_hold
                          - lvgl.widget.hide: h_ok
                  widgets:
                    # vult zich in 2 s als een taartpunt (onder de tekst)
                    - arc:
                        id: bd_arc
                        align: CENTER
                        width: 80
                        height: 80
                        min_value: 0
                        max_value: 100
                        value: 0
                        rotation: 270
                        start_angle: 0
                        end_angle: 360
                        adjustable: false
                        clickable: false
                        arc_opa: TRANSP
                        pad_all: 0
                        indicator:
                          arc_color: ${c_inkbg}
                          arc_width: 40
                          arc_rounded: false
                        knob:
                          bg_opa: TRANSP
                          pad_all: 0
