    internal: true
    on_value:
      - lambda: |-
          int h = 0, m = 0;
          if (!id(wk_dirty) && sscanf(x.c_str(), "%d:%d", &h, &m) == 2) id(wk_min) = h * 60 + m;
      - script.execute: wk_render
  - platform: homeassistant
