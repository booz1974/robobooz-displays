interval:
  # elke 3 s: deurbelscherm open? camerabeeld verversen
  - interval: 3s
    then:
      - if:
          condition:
            lambda: 'return id(cur_page) == 11 && id(display_backlight).current_values.is_on();'
          then:
            - component.update: cam_img
  # elke 3 s: is HA verbonden (met statusabonnement, dus echt HA en niet de logviewer)?
  - interval: 3s
    then:
      - lambda: |-
          bool nu = esphome::api::global_api_server != nullptr &&
                    esphome::api::global_api_server->is_connected(true);
          if (nu == id(ha_ok)) return;
          id(ha_ok) = nu;
          id(wk_render).execute();
          // een wekkertijd die niet aankwam (HA was weg) alsnog sturen
          if (nu && id(wk_dirty)) id(wk_send).execute();

# ---------------------------------------------------------------- scripts
script:
  # ---- deurbel: kop van het scherm
  - id: deur_render
    then:
      - lambda: |-
          bool bel = !id(deur_tijd).empty();
          lv_label_set_text(id(dr_time), bel ? id(deur_tijd).c_str() : "");
          lv_label_set_text(id(dr_title), bel ? "Er wordt aangebeld" : "Voordeur");
  # ---- goedemorgen: datum, buiten, afspraken van vandaag
  - id: gm_render
    then:
      - lambda: |-
          lv_obj_t *tm[] = {id(gm_t0), id(gm_t1), id(gm_t2)};
          lv_obj_t *tx[] = {id(gm_x0), id(gm_x1), id(gm_x2)};
          lv_obj_t *rw[] = {id(gm_r0), id(gm_r1), id(gm_r2)};
          std::string a = id(gm_agenda).state;
          bool geen = a.empty() || a == "geen" || a == "unknown" || a == "unavailable";
          size_t q = 0;
          for (int k = 0; k < 3; k++) {
            std::string part;
            if (!geen && q != std::string::npos && q < a.size()) {
              size_t r = a.find(';', q);
              part = a.substr(q, r == std::string::npos ? std::string::npos : r - q);
              q = r == std::string::npos ? std::string::npos : r + 1;
            }
            size_t bar = part.find('|');
            if (bar == std::string::npos) { lv_obj_add_flag(rw[k], LV_OBJ_FLAG_HIDDEN); continue; }
            lv_obj_clear_flag(rw[k], LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(tm[k], part.substr(0, bar).c_str());
            lv_label_set_text(tx[k], part.substr(bar + 1).c_str());
          }
          lv_label_set_text(id(gm_none), geen ? "Geen afspraken vandaag" : "");
  # ---- BEDTIJD: pas na 2 s vasthouden uitvoeren
  - id: bd_hold
    then:
      - delay: 2s
      - script.execute: bd_go
  - id: bd_go
    then:
      - homeassistant.action:
          action: script.turn_on
          data:
            entity_id: script.bedtijd
      - lvgl.label.update: {id: h_ok, text: "BEDTIJD: HUIS UIT · TV UIT · THERMOSTAAT 15°"}
      - lvgl.widget.show: h_ok
      - delay: 6s
      - lvgl.widget.hide: h_ok
  # ---- favorieten: lijsten ophalen uit Music Assistant (meest gespeeld bovenaan)
  - id: fav_fetch
    mode: single
    then:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 60s
      - lambda: 'id(fav_new).clear(); id(fav_ok) = true;'
      - script.execute: {id: fav_get, kind: radio}
      - script.wait: fav_get
      - script.execute: {id: fav_get, kind: playlist}
      - script.wait: fav_get
      - lambda: |-
          if (id(fav_ok) && !id(fav_new).empty()) { id(fav_list) = id(fav_new); id(fav_ms) = millis(); }
          id(fav_new).clear();
      - script.execute: fav_build
  # ---- één lijst ophalen (kind = radio of playlist); alleen naam en uri, geen hoesjes
  - id: fav_get
    parameters:
      kind: string
    then:
      - http_request.post:
          url: "${ma_url}/api"
          request_headers:
            Content-Type: application/json
            Authorization: "Bearer ${ma_token}"
          body: !lambda |-
            return std::string("{\"message_id\": \"fav_") + kind + "\", \"command\": \"music/" + kind + "s/library_items\", \"args\": {\"favorite\": true, \"order_by\": \"play_count_desc\", \"limit\": 60}}";
          capture_response: true
          max_response_buffer_size: 262144
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    ESP_LOGW("fav", "%s: HTTP %d", kind.c_str(), response->status_code);
                    id(fav_ok) = false;
                    return;
                  }
                  bool arr = false;
                  for (char c : body) {
                    if (c == ' ' || c == '\n' || c == '\r' || c == '\t') continue;
                    arr = (c == '[');
                    break;
                  }
                  JsonDocument filter;
                  JsonObject ef = arr ? filter.add<JsonObject>() : filter["items"].add<JsonObject>();
                  ef["name"] = true;
                  ef["uri"] = true;
                  ef["item_id"] = true;
                  JsonDocument doc;
                  if (deserializeJson(doc, body, DeserializationOption::Filter(filter))) {
                    ESP_LOGW("fav", "%s: JSON-fout", kind.c_str());
                    id(fav_ok) = false;
                    return;
                  }
                  JsonArray lst = arr ? doc.as<JsonArray>() : doc["items"].as<JsonArray>();
                  int k = 0;
                  for (JsonObject it : lst) {
                    std::string uri = it["uri"] | "";
                    if (uri.empty()) {
                      std::string iid = it["item_id"] | "";
                      if (iid.empty()) continue;
                      uri = std::string("library://") + kind + "/" + iid;
                    }
                    id(fav_new).push_back(it["name"] | "");
                    id(fav_new).push_back(uri);
                    id(fav_new).push_back(kind == "radio" ? "r" : "p");
                    k++;
                  }
                  ESP_LOGI("fav", "%s: %d favorieten", kind.c_str(), k);
          on_error:
            then:
              - lambda: 'id(fav_ok) = false;'
  # ---- tegels opbouwen voor de gekozen soort (radio of playlists)
  - id: fav_build
    then:
      - lambda: |-
          lv_obj_t *box = id(fav_box);
          lv_obj_clean(box);
          lv_obj_set_layout(box, LV_LAYOUT_FLEX);
          lv_obj_set_flex_flow(box, LV_FLEX_FLOW_ROW_WRAP);
          lv_obj_set_style_pad_row(box, 6, 0);
          lv_obj_set_style_pad_column(box, 9, 0);
          const lv_font_t *f15 = lv_obj_get_style_text_font(id(fav_f15), LV_PART_MAIN);
          const lv_font_t *fm = lv_obj_get_style_text_font(id(fav_fm), LV_PART_MAIN);
          bool radio = id(fav_kind) == 0;
          // tabbladen
