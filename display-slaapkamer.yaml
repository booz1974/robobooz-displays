globals:
  - id: cur_page        # 0 thuis, 1 licht, 2 sfeer, 3 muziek, 4 kamer, 5 weer, 6 menu, 7 wekker, 8 wekkergeluid, 9 nachtstand, 10 favorieten, 11 deurbel, 12 goedemorgen
    type: int
    initial_value: '0'
  - id: sf_idx          # laatste sfeerkeuze (-1 = nog niets)
    type: int
    restore_value: true
    initial_value: '-1'
  - id: vol_local       # volume 0..100 (direct bijgewerkt bij -/+)
    type: int
    initial_value: '-1'
  - id: wk_min          # wekkertijd in minuten na middernacht (direct bijgewerkt bij -/+)
    type: int
    initial_value: '420'
  - id: wk_dirty        # wekkertijd nog niet bij HA aangekomen (HA was weg)
    type: bool
    initial_value: 'false'
  - id: vol_ts          # laatste volumetik (ms): HA-updates even negeren
    type: uint32_t
    initial_value: '0'
  - id: sluimer_tot     # sluimert tot (minuten na middernacht, -1 = niet)
    type: int
    initial_value: '-1'
  - id: ha_ok           # verbonden met Home Assistant
    type: bool
    initial_value: 'false'
  - id: tijd_gezet      # eerste tijdsynchronisatie gehad
    type: bool
    initial_value: 'false'
  # ---- favorieten uit Music Assistant (radio en playlists)
  - id: fav_new         # binnenkomende lijst: naam, uri, soort (r/p) achter elkaar
    type: std::vector<std::string>
  - id: fav_list        # huidige lijst, zelfde opbouw
    type: std::vector<std::string>
  - id: fav_kind        # 0 = radio, 1 = playlists
    type: int
    initial_value: '0'
  - id: fav_sel         # uri van wat het laatst gekozen is
    type: std::string
  - id: fav_click
    type: int
    initial_value: '-1'
  - id: fav_ok
    type: bool
    initial_value: 'false'
  - id: fav_ms          # wanneer de lijst voor het laatst is opgehaald
    type: uint32_t
    initial_value: '0'
  - id: deur_tijd       # tijd van het laatste aanbellen (tekst), leeg = handmatig geopend
    type: std::string
  - id: avond           # avondstand: donker kleurenschema
    type: bool
    restore_value: true
    initial_value: 'false'

