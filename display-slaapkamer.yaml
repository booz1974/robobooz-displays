  # avondstand: donker kleurenschema "warm donker" (vervangt het omdraaien van de kleuren).
  # Een kleurfilter op elk onderdeel zet elke lichte kleur om naar zijn donkere tegenhanger;
  # wat niet in de lijst staat wordt 40% donkerder. Zwart en de nachtklok blijven gelijk.
  - id: avond_apply
    then:
      - lambda: |-
          static lv_color_filter_dsc_t f;
          static bool klaar = false;
          if (!klaar) {
            lv_color_filter_dsc_init(&f, [](const lv_color_filter_dsc_t *, lv_color_t c, lv_opa_t) -> lv_color_t {
              switch (lv_color_to_u32(c) & 0xFFFFFF) {
                case ${c_paper}:  return lv_color_hex(0x151210);   // achtergrond
                case ${c_ink}:    return lv_color_hex(0xD2C6B8);   // tekst en klok (licht zand)
                case ${c_inkbg}:  return lv_color_hex(0x2A2420);   // gekozen knop / donker vlak
                case ${c_papert}: return lv_color_hex(0xD2C6B8);   // tekst op een donker vlak
                case ${c_tile}:   return lv_color_hex(0x1E1A17);   // tegel
                case ${c_tile2}:  return lv_color_hex(0x2A2420);
                case ${c_line}:   return lv_color_hex(0x2A2420);
                case ${c_sub}:    return lv_color_hex(0x948A7F);   // grijze tekst
                case ${c_red}:    return lv_color_hex(0x5A221A);   // diep rood
                case ${c_redt}:   return lv_color_hex(0xC0604F);   // rode tekst (leesbaar)
                case ${c_blue}:   return lv_color_hex(0x1E2A4F);   // diep blauw
                case ${c_grey}:   return lv_color_hex(0x948A7F);
                case ${c_dline}:  return lv_color_hex(0x2A2420);
                case ${c_off}:    return lv_color_hex(0x3A332E);   // schakelaar uit
                case 0xFFFFFF:    return lv_color_hex(0xD2C6B8);
                case ${c_night}:  return c;                        // nachtklok blijft zoals hij is
                default:          return lv_color_make(c.red * 3 / 5, c.green * 3 / 5, c.blue * 3 / 5);
              }
            });
            klaar = true;
          }
          struct W {
            static void zet(lv_obj_t *o, lv_part_t pt, bool aan) {
              if (aan) {
                lv_obj_set_style_color_filter_dsc(o, &f, pt);
                lv_obj_set_style_color_filter_opa(o, LV_OPA_COVER, pt);
              } else {
                lv_obj_remove_local_style_prop(o, LV_STYLE_COLOR_FILTER_OPA, pt);
                lv_obj_remove_local_style_prop(o, LV_STYLE_COLOR_FILTER_DSC, pt);
              }
            }
            static void loop(lv_obj_t *o, bool aan) {
              zet(o, LV_PART_MAIN, aan);
              if (lv_obj_check_type(o, &lv_switch_class) || lv_obj_check_type(o, &lv_slider_class) ||
                  lv_obj_check_type(o, &lv_arc_class) || lv_obj_check_type(o, &lv_bar_class)) {
                zet(o, LV_PART_INDICATOR, aan);
                zet(o, LV_PART_KNOB, aan);
              }
              uint32_t n = lv_obj_get_child_count(o);
              for (uint32_t i = 0; i < n; i++) loop(lv_obj_get_child(o, i), aan);
            }
          };
          bool aan = id(avond);
          lv_obj_t *root[] = {id(p_home)->obj, id(p_licht)->obj, id(p_sfeer)->obj, id(p_muziek)->obj,
                              id(p_klimaat)->obj, id(p_weer)->obj, id(p_menu)->obj, id(p_wekker)->obj,
                              id(p_wgeluid)->obj, id(p_fav)->obj, id(p_deur)->obj, id(p_gm)->obj,
                              id(p_nacht)->obj, lv_layer_top()};
          for (auto *o : root) { W::loop(o, aan); lv_obj_invalidate(o); }
          ESP_LOGI("avond", "donker schema %s", aan ? "aan" : "uit");
          if (aan) lv_obj_add_state(id(qp_avond), LV_STATE_CHECKED); else lv_obj_clear_state(id(qp_avond), LV_STATE_CHECKED);

  # Thuis: cirkel en kwartcirkel op een willekeurige plek en grootte; het kwart komt
  # elke keer in een ander kwadrant (elk kwartier en na het opstarten)
  - id: deco_mix
    then:
      - lambda: |-
          static int vorig = -1;
          int d = 140 + random_uint32() % 151;          // cirkel 140..290 px
          int cx = random_uint32() % 481, cy = random_uint32() % 401;
          lv_obj_t *c = id(h_circ);
          lv_obj_set_size(c, d, d);
          lv_obj_set_style_radius(c, d / 2, 0);
          lv_obj_set_pos(c, cx - d / 2, cy - d / 2);
          int q = random_uint32() % 3;                  // 0..3, maar nooit hetzelfde als vorige keer
          if (vorig >= 0 && q >= vorig) q++;
          if (vorig < 0) q = random_uint32() % 4;
          vorig = q;
          int k = 70 + random_uint32() % 91;            // kwartcirkel 70..160 px
          lv_obj_t *b = id(h_qbox), *r = id(h_qcirc);
          lv_obj_set_size(b, k, k);
          lv_obj_set_pos(b, random_uint32() % (481 - k), random_uint32() % (401 - k));
          lv_obj_set_size(r, 2 * k, 2 * k);
          lv_obj_set_style_radius(r, k, 0);
          // het vierkant laat één kwart van de cirkel zien: 0 linksboven, 1 rechtsboven, 2 linksonder, 3 rechtsonder
          lv_obj_set_pos(r, (q == 1 || q == 3) ? -k : 0, (q == 2 || q == 3) ? -k : 0);

  # ---- wekker: tijd, aan/uit, dagen, geluid, zonsopgang + tegel en nachtstand
  - id: wk_render
    then:
      - lambda: |-
          char t[8]; snprintf(t, sizeof(t), "%02d:%02d", id(wk_min) / 60, id(wk_min) % 60);
          bool aan = id(wk_aan).state == "on";
          bool bekend = id(ha_ok) && (id(wk_aan).state == "on" || id(wk_aan).state == "off");
          char sl[32] = "";
          if (id(sluimer_tot) >= 0) snprintf(sl, sizeof(sl), "SLUIMERT TOT %02d:%02d", id(sluimer_tot) / 60, id(sluimer_tot) % 60);
          lv_label_set_text(id(wk_big), t);
          lv_obj_set_style_text_color(id(wk_big), lv_color_hex(aan ? ${c_ink} : ${c_off}), 0);
          if (aan) lv_obj_add_state(id(wk_sw), LV_STATE_CHECKED); else lv_obj_clear_state(id(wk_sw), LV_STATE_CHECKED);
          lv_label_set_text(id(wk_sw_l), !bekend ? "?" : (aan ? "AAN" : "UIT"));
          lv_label_set_text(id(tl_wekker), !bekend ? "?" : (aan ? t : "Uit"));
          // nachtstand: klein de wekkertijd (of sluimeren), en een waarschuwing als HA weg is
          std::string nl = sl[0] ? std::string(sl) : (aan ? std::string("WEKKER ") + t : std::string(""));
          if (!id(ha_ok)) nl += nl.empty() ? "GEEN VERBINDING MET HA" : " · GEEN VERBINDING";
          lv_label_set_text(id(n_wekker), nl.c_str());
          if (id(ha_ok)) lv_obj_add_flag(id(h_ha), LV_OBJ_FLAG_HIDDEN); else lv_obj_clear_flag(id(h_ha), LV_OBJ_FLAG_HIDDEN);
          // dagen
          static const char *dg[] = {"Werkdagen", "Elke dag", "Weekend"};
          lv_obj_t *db[] = {id(wk_d0), id(wk_d1), id(wk_d2)};
          for (int k = 0; k < 3; k++) {
            bool sel = id(wk_dagen).state == dg[k];
            lv_obj_set_style_bg_color(db[k], lv_color_hex(sel ? ${c_inkbg} : ${c_tile}), 0);
            lv_obj_set_style_text_color(db[k], lv_color_hex(sel ? ${c_papert} : ${c_ink}), 0);
          }
          std::string dg_l = id(wk_dagen).state;
          std::string info = !id(ha_ok) ? std::string("Geen verbinding met HA") :
                             (sl[0] ? std::string("Sluimert tot ") + (sl + 13) :
                             (!bekend ? std::string("Wekker: onbekend") : (aan ? "Wekker aan · " + dg_l : std::string("Wekker uit"))));
          lv_label_set_text(id(wk_info), info.c_str());
          lv_obj_set_style_text_color(id(wk_info), lv_color_hex(id(ha_ok) ? ${c_sub} : ${c_redt}), 0);
          // geluid
          std::string g = id(wk_geluid).state;
          lv_label_set_text(id(wk_g_name), g.c_str());
          static const char *gn[] = {"Fluisterwekker", "Wekkerbrigade", "Zoemer", "Klassieke wekker", "Alarm",
                                     "Rustig wekken", "Muziek", "Natuurgeluiden", "Alleen licht"};
          lv_obj_t *gb[] = {id(wg_0), id(wg_1), id(wg_2), id(wg_3), id(wg_4), id(wg_5), id(wg_6), id(wg_7), id(wg_8)};
          lv_obj_t *gs[] = {id(wg_s0), id(wg_s1), id(wg_s2), id(wg_s3), id(wg_s4), id(wg_s5), id(wg_s6), id(wg_s7), id(wg_s8)};
          for (int k = 0; k < 9; k++) {
            bool sel = g == gn[k];
            lv_obj_set_style_bg_color(gb[k], lv_color_hex(sel ? ${c_inkbg} : ${c_tile}), 0);
            lv_obj_set_style_text_color(gb[k], lv_color_hex(sel ? ${c_papert} : ${c_ink}), 0);
            lv_obj_set_style_text_color(gs[k], lv_color_hex(sel ? ${c_grey} : ${c_sub}), 0);
          }
          bool lamp = id(wk_lampen).state == "on";
          if (lamp) lv_obj_add_state(id(wk_lamp_sw), LV_STATE_CHECKED); else lv_obj_clear_state(id(wk_lamp_sw), LV_STATE_CHECKED);
  - id: wk_step
    parameters:
      d: int
    then:
      - lambda: |-
          id(wk_min) = ((id(wk_min) + d) % 1440 + 1440) % 1440;
          id(wk_dirty) = true;   // tot HA hem heeft
      - script.execute: wk_render
      - script.execute: wk_send
  # pas 1,5 s na de laatste tik naar HA sturen (snel tikken = één keer opslaan)
  - id: wk_send
    mode: restart
    then:
      - delay: 1500ms
      - if:
          condition:
            lambda: 'return id(ha_ok);'
          then:
            - homeassistant.action:
                action: input_datetime.set_datetime
                data:
                  entity_id: input_datetime.wekker_slaapkamer_tijd
                  time: !lambda 'char b[12]; snprintf(b, sizeof(b), "%02d:%02d:00", id(wk_min) / 60, id(wk_min) % 60); return std::string(b);'
            - delay: 3s
            - lambda: 'id(wk_dirty) = false;'
          # HA weg: onthouden en sturen zodra de verbinding terug is (api: on_client_connected)
      - script.execute: wk_render
  - id: wk_pick
    parameters:
      i: int
    then:
      - homeassistant.action:
          action: input_select.select_option
          data:
            entity_id: input_select.wekker_slaapkamer_geluid
            option: !lambda |-
              static const char *gn[] = {"Fluisterwekker", "Wekkerbrigade", "Zoemer", "Klassieke wekker", "Alarm",
                                         "Rustig wekken", "Muziek", "Natuurgeluiden", "Alleen licht"};
              return std::string(gn[std::max(0, std::min(8, i))]);
  - id: wk_days
    parameters:
      i: int
    then:
      - homeassistant.action:
          action: input_select.select_option
          data:
            entity_id: input_select.wekker_slaapkamer_dagen
            option: !lambda 'return std::string(i == 1 ? "Elke dag" : (i == 2 ? "Weekend" : "Werkdagen"));'
  - id: lt_render
    then:
      - lambda: |-
          lv_obj_t *sw[] = {id(lt_sw0), id(lt_sw1), id(lt_sw2)};
          lv_obj_t *sl[] = {id(lt_sl0), id(lt_sl1), id(lt_sl2)};
          lv_obj_t *pc[] = {id(lt_pc0), id(lt_pc1), id(lt_pc2)};
          std::string st[] = {id(lt_s0).state, id(lt_s1).state, id(lt_s2).state};
          float br[] = {id(lt_b0).state, id(lt_b1).state, id(lt_b2).state};
          int aan = 0;
          for (int k = 0; k < 3; k++) {
            bool on = st[k] == "on";
            if (on) aan++;
            if (on) lv_obj_add_state(sw[k], LV_STATE_CHECKED); else lv_obj_clear_state(sw[k], LV_STATE_CHECKED);
            int pct = (on && !std::isnan(br[k])) ? std::max(1, (int) lroundf(br[k] * 100.0f / 255.0f)) : 0;
            if (!lv_obj_has_state(sl[k], LV_STATE_PRESSED)) lv_slider_set_value(sl[k], pct, LV_ANIM_OFF);
            char t[8]; if (on) snprintf(t, sizeof(t), "%d%%", pct); else snprintf(t, sizeof(t), "%s", st[k] == "off" ? "UIT" : "–");
            lv_label_set_text(pc[k], t);
          }
          char c[16];
          if (aan == 0) snprintf(c, sizeof(c), "Alles uit"); else snprintf(c, sizeof(c), "%d aan", aan);
          lv_label_set_text(id(lt_count), c);
          lv_label_set_text(id(tl_licht), c);
  - id: lt_switch
    parameters:
      i: int
      aan: bool   # niet "on": YAML leest dat als true
    then:
      - homeassistant.action:
          action: !lambda 'return std::string(aan ? "light.turn_on" : "light.turn_off");'
          data:
            entity_id: !lambda 'return std::string(i == 1 ? "light.slaapkamer_jeroen_en_maartje" : (i == 2 ? "light.slaapkamer_lichtstrip" : "light.slaapkamer_jeroen_maartje"));'
  - id: lt_set
    parameters:
      i: int
      pct: int
    then:
      - if:
          condition:
            lambda: 'return pct <= 0;'
          then:
            - homeassistant.action:
                action: light.turn_off
                data:
                  entity_id: !lambda 'return std::string(i == 1 ? "light.slaapkamer_jeroen_en_maartje" : (i == 2 ? "light.slaapkamer_lichtstrip" : "light.slaapkamer_jeroen_maartje"));'
          else:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda 'return std::string(i == 1 ? "light.slaapkamer_jeroen_en_maartje" : (i == 2 ? "light.slaapkamer_lichtstrip" : "light.slaapkamer_jeroen_maartje"));'
                  brightness_pct: !lambda 'return std::to_string(pct);'

  # ---- sfeer: laatste keuze zwart, naam op de tegel van Thuis
  - id: sf_mark
    then:
      - lambda: |-
          lv_obj_t *b[] = {id(sf_0), id(sf_1), id(sf_2), id(sf_3), id(sf_4), id(sf_5), id(sf_6), id(sf_7)};
          lv_obj_t *s[] = {id(sf_s0), id(sf_s1), id(sf_s2), id(sf_s3), id(sf_s4), id(sf_s5), id(sf_s6), id(sf_s7)};
          static const char *naam[] = {"Helder", "Gedimd", "Lezen", "Ontspannen", "Nachtlampje", "Lentebloesem", "Savanne", "Alles uit"};
          for (int k = 0; k < 8; k++) {
            bool on = k == id(sf_idx);
            lv_obj_set_style_bg_color(b[k], lv_color_hex(on ? ${c_inkbg} : ${c_tile}), 0);
            lv_obj_set_style_text_color(b[k], lv_color_hex(on ? ${c_papert} : ${c_ink}), 0);
            lv_obj_set_style_text_color(s[k], lv_color_hex(on ? ${c_grey} : ${c_sub}), 0);
          }
          lv_label_set_text(id(tl_sfeer), id(sf_idx) >= 0 && id(sf_idx) < 8 ? naam[id(sf_idx)] : "Kies");
  - id: sf_scene
    parameters:
      i: int
      ent: string
    then:
      - lambda: 'id(sf_idx) = i;'
      - script.execute: sf_mark
      - homeassistant.action:
          action: scene.turn_on
          data:
            entity_id: !lambda 'return ent;'

  # ---- muziek
  - id: mp_render
    then:
      - lambda: |-
          std::string s = id(mp_st).state;
          bool speelt = s == "playing";
          auto ok = [](const std::string &v) { return !(v.empty() || v == "unknown" || v == "unavailable" || v == "None"); };
          std::string ti = ok(id(mp_title).state) ? id(mp_title).state : std::string(s == "playing" || s == "paused" ? "Woonkamer" : (s == "unavailable" || s == "unknown" || s.empty() ? "–" : "Er speelt niets"));
          std::string ar = ok(id(mp_artist).state) ? id(mp_artist).state : std::string("");
          std::string al = ok(id(mp_album).state) ? id(mp_album).state : std::string("");
          lv_label_set_text(id(mi_title), ti.c_str());
          lv_label_set_text(id(mu_title), ti.c_str());
          std::string sub = ar;
          for (auto &c : sub) c = toupper((unsigned char) c);
          sub = sub.empty() ? std::string("WOONKAMER") : sub + " · WOONKAMER";
          lv_label_set_text(id(mi_sub), sub.c_str());
          std::string aa = ar.empty() ? al : (al.empty() ? ar : ar + " — " + al);
          lv_label_set_text(id(mu_sub), aa.c_str());
          lv_label_set_text(id(mi_play_i), speelt ? "${ic_pause}" : "${ic_play}");
          lv_label_set_text(id(mu_play_i), speelt ? "${ic_pause}" : "${ic_play}");
          int v = id(vol_local);
          char t[8]; if (v < 0) snprintf(t, sizeof(t), "–"); else snprintf(t, sizeof(t), "%d%%", v);
          lv_label_set_text(id(mi_vol), t);
          lv_label_set_text(id(mu_vol), t);
          int vv = std::max(0, std::min(100, v));
          lv_obj_set_width(id(mi_volbar), std::max(1, vv * 40 / 100));
          lv_obj_set_width(id(mu_volbar), std::max(1, vv * 70 / 100));
      - script.execute: mini_vis
  - id: mp_volume
    parameters:
      d: int
    then:
      - lambda: |-
          int v = id(vol_local) < 0 ? 30 : id(vol_local);
          id(vol_local) = std::max(0, std::min(100, v + d));
          id(vol_ts) = millis();
      - script.execute: mp_render
      - homeassistant.action:
          action: media_player.volume_set
          data:
            entity_id: ${speler}
            volume_level: !lambda 'char b[8]; snprintf(b, sizeof(b), "%.2f", id(vol_local) / 100.0f); return std::string(b);'
  - id: mp_cmd
    parameters:
      a: string
    then:
      - homeassistant.action:
          action: !lambda 'return a;'
          data:
            entity_id: ${speler}

  # ---- kamer (slaapkamer): temperatuur, vocht en een korte slaapregel
  - id: cl_render
    then:
      - lambda: |-
          float f = id(cl_cur).state, h = id(cl_hum).state;
          char c[16];
          if (std::isnan(f)) snprintf(c, sizeof(c), "–");
          else { snprintf(c, sizeof(c), "%.1f°", f); for (char *q = c; *q; q++) if (*q == '.') *q = ','; }
          lv_label_set_text(id(cl_now), c);
          char v[24];
          if (std::isnan(h)) snprintf(v, sizeof(v), "Vocht –"); else snprintf(v, sizeof(v), "Vocht %d%%", (int) lroundf(h));
          lv_label_set_text(id(cl_want), v);
          const char *r = "";
          if (!std::isnan(f)) r = f < 15.0f ? "FRIS · EXTRA DEKEN?" : (f <= 19.0f ? "PRIMA OM TE SLAPEN" : (f <= 22.0f ? "WAT WARM" : "WARM · RAAM OPEN?"));
          lv_label_set_text(id(cl_mode_l), r);

  # ---- weer (Thuis-regel, Weer-pagina, regenbalkjes en komende uren)
  - id: wx_render
    then:
      - lambda: |-
          auto naam = [](const std::string &c) -> const char * {
            if (c == "sunny") return "zonnig";
            if (c == "clear-night") return "helder";
            if (c == "partlycloudy") return "half bewolkt";
            if (c == "cloudy") return "bewolkt";
            if (c == "rainy") return "regen";
            if (c == "pouring") return "zware regen";
            if (c == "fog") return "mist";
            if (c == "snowy") return "sneeuw";
            if (c == "snowy-rainy") return "natte sneeuw";
            if (c == "lightning" || c == "lightning-rainy") return "onweer";
            if (c == "windy" || c == "windy-variant") return "harde wind";
            if (c == "hail") return "hagel";
            if (c == "exceptional") return "bijzonder weer";
            return "";
          };
          auto icoon = [](const std::string &c) -> const char * {
            if (c == "sunny") return "${ic_sunny}";
            if (c == "clear-night") return "${ic_clear}";
            if (c == "partlycloudy") return "${ic_pcloudy}";
            if (c == "cloudy") return "${ic_cloudy}";
            if (c == "rainy") return "${ic_rain}";
            if (c == "pouring") return "${ic_pouring}";
            if (c == "fog") return "${ic_fog}";
            if (c == "snowy") return "${ic_snowy}";
            if (c == "snowy-rainy") return "${ic_snowrain}";
            if (c == "lightning" || c == "lightning-rainy") return "${ic_lightning}";
            if (c == "windy" || c == "windy-variant") return "${ic_windy}";
            if (c == "hail") return "${ic_hail}";
            return "${ic_cloudy}";
          };
          std::string cond = id(wx_cond).state;
          float tmp = id(wx_temp).state;
          char ts[12];
          if (std::isnan(tmp)) snprintf(ts, sizeof(ts), "–"); else snprintf(ts, sizeof(ts), "%d°", (int) lroundf(tmp));

          // regen: Buienradar-waarde 0..255 per 5 min
          std::string s = id(wx_regen).state;
          int val[24]; std::string tm[24]; int n = 0;
          size_t a = 0;
          while (n < 24 && a < s.size()) {
            size_t b = s.find(' ', a); std::string e = s.substr(a, b == std::string::npos ? std::string::npos : b - a);
            size_t p = e.find('|');
            if (p != std::string::npos) { val[n] = atoi(e.substr(0, p).c_str()); tm[n] = e.substr(p + 1); n++; }
            if (b == std::string::npos) break;
            a = b + 1;
          }
          lv_obj_t *rb[] = {id(rb_0), id(rb_1), id(rb_2), id(rb_3), id(rb_4), id(rb_5), id(rb_6), id(rb_7), id(rb_8), id(rb_9), id(rb_10), id(rb_11)};
          for (int k = 0; k < 12; k++) {
            int v0 = 2 * k < n ? val[2 * k] : 0, v1 = 2 * k + 1 < n ? val[2 * k + 1] : 0;
            int v = std::max(v0, v1);
            lv_obj_set_height(rb[k], v <= 0 ? 0 : std::max(4, std::min(56, (v - 60) * 56 / 100)));
          }
          std::string kort, lang;
          if (n == 0) { kort = "geen regendata"; lang = "GEEN REGENDATA"; }
          else if (val[0] > 0) {
            int e = -1; for (int k = 1; k < n; k++) if (val[k] <= 0) { e = k; break; }
            kort = e < 0 ? "regen houdt aan" : "droog om " + tm[e];
            lang = e < 0 ? "HET REGENT · HOUDT AAN" : "HET REGENT · DROOG OM " + tm[e];
          } else {
            int b = -1; for (int k = 1; k < n; k++) if (val[k] > 0) { b = k; break; }
            if (b < 0) { kort = "droog"; lang = "DROOG KOMENDE 2 UUR"; }
            else {
              char m[40]; snprintf(m, sizeof(m), "regen over %d min", b * 5); kort = m;
              snprintf(m, sizeof(m), "REGEN OVER %d MIN", b * 5); lang = m;
            }
          }
          lv_label_set_text(id(wx_tip), lang.c_str());
          // regel op Thuis + tegel
          std::string regel = std::string(ts);
          if (*naam(cond)) regel += std::string(" · ") + naam(cond);
          regel += " · " + kort;
          lv_label_set_text(id(h_wx), regel.c_str());
          std::string buiten = std::string(ts) + " · " + kort;
          lv_label_set_text(id(gm_out), buiten.c_str());
          lv_label_set_text(id(h_wx_i), icoon(cond));
          std::string tegel = kort.rfind("regen over ", 0) == 0 ? "Regen " + kort.substr(11) : kort;
          if (!tegel.empty()) tegel[0] = toupper((unsigned char) tegel[0]);
          lv_label_set_text(id(tl_weer), tegel.c_str());
          // weerpagina
          lv_label_set_text(id(wx_big), ts);
          std::string nm = naam(cond); if (!nm.empty()) nm[0] = toupper((unsigned char) nm[0]);
          lv_label_set_text(id(wx_name), nm.c_str());
          float w = id(wx_wind).state, h = id(wx_hum).state;
          static const float bft[] = {1, 6, 12, 20, 29, 39, 50, 62, 75, 89, 103, 118};
          char ex[48] = "";
          if (!std::isnan(w)) {
            int bf = 0; while (bf < 12 && w >= bft[bf]) bf++;
            if (!std::isnan(h)) snprintf(ex, sizeof(ex), "WIND %d BFT · VOCHT %d%%", bf, (int) lroundf(h));
            else snprintf(ex, sizeof(ex), "WIND %d BFT", bf);
          }
          lv_label_set_text(id(wx_extra), ex);
          // komende 6 uur: "uur|conditie|temp;..."
          lv_obj_t *hu[] = {id(wh_u0), id(wh_u1), id(wh_u2), id(wh_u3), id(wh_u4), id(wh_u5)};
          lv_obj_t *hi[] = {id(wh_i0), id(wh_i1), id(wh_i2), id(wh_i3), id(wh_i4), id(wh_i5)};
          lv_obj_t *ht[] = {id(wh_t0), id(wh_t1), id(wh_t2), id(wh_t3), id(wh_t4), id(wh_t5)};
          std::string hs = id(wx_hours).state;
          size_t q = 0;
          for (int k = 0; k < 6; k++) {
            std::string part;
            if (q != std::string::npos && q < hs.size()) {
              size_t r = hs.find(';', q);
              part = hs.substr(q, r == std::string::npos ? std::string::npos : r - q);
              q = r == std::string::npos ? std::string::npos : r + 1;
            }
            size_t p1 = part.find('|'), p2 = p1 == std::string::npos ? std::string::npos : part.find('|', p1 + 1);
            if (p2 == std::string::npos) { lv_label_set_text(hu[k], ""); lv_label_set_text(hi[k], ""); lv_label_set_text(ht[k], ""); continue; }
            std::string u = part.substr(0, p1) + ":00";
            std::string c = part.substr(p1 + 1, p2 - p1 - 1);
            std::string t = part.substr(p2 + 1) + "°";
            lv_label_set_text(hu[k], u.c_str());
            lv_label_set_text(hi[k], icoon(c));
            lv_label_set_text(ht[k], t.c_str());
          }

# ---------------------------------------------------------------- scherm


lvgl:
  id: lvgl_main
  buffer_size: 25%
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  page_wrap: false
  style_definitions:
    - id: st_page
      bg_color: ${c_paper}
      bg_opa: COVER
      pad_all: 0
      text_color: ${c_ink}
      text_font: f_15
    # tegel / knop zonder rand
    - id: st_tile
      bg_color: ${c_tile}
      bg_opa: COVER
      radius: 0
      border_width: 0
      shadow_width: 0
      pad_all: 0
    # omlijnde knop
    - id: st_outline
      bg_opa: TRANSP
      radius: 0
      border_width: 1
      border_color: ${c_ink}
      shadow_width: 0
      pad_all: 0
    # vlakje/cirkel als versiering (niet aanraakbaar)
    - id: st_deco
      bg_opa: COVER
      border_width: 0
      pad_all: 0
      radius: 0
    - id: st_mono11
      text_font: f_m11
      text_letter_space: 1
    - id: st_mono12
      text_font: f_m12
      text_letter_space: 1
  theme:
    obj:
      border_width: 0
      scrollable: false
      pad_all: 0
      bg_opa: TRANSP
      radius: 0
    button:
      shadow_width: 0
      border_width: 0
      radius: 0
      bg_color: ${c_tile}
      text_color: ${c_ink}
      pressed:
        bg_color: ${c_inkbg}
        text_color: ${c_papert}
  on_idle:
    # 's nachts: na 1 min niets aanraken SLAPEN (een tik geeft dan eerst de nachtstand);
    # overdag 65%. Nooit tijdens de nachtstand of als de wekker afgaat.
    - timeout: 1min
      then:
        - if:
            condition:
              lambda: 'return id(display_backlight).current_values.is_on() && id(cur_page) != 9 && id(wk_af).state != "on";'
            then:
              - if:
                  condition:
                    lambda: |-
                      auto t = id(system_time).now();
                      return t.is_valid() && (t.hour >= 21 || t.hour < 6);
                  then:
                    - lvgl.widget.hide: qp
                    - light.turn_off: display_backlight
                    - lvgl.page.show: p_nacht
                  else:
                    - light.turn_on: {id: display_backlight, brightness: 65%}
    - timeout: 2min
      then:
        - if:
            condition:
              lambda: 'return id(display_backlight).current_values.is_on() && id(cur_page) != 9 && id(wk_af).state != "on";'
            then:
              # in het donkere schema niet lager dan de nachthelderheid (anders onleesbaar)
              - light.turn_on: {id: display_backlight, brightness: !lambda 'return id(avond) ? ${nacht_hl}f : 0.35f;'}
    # overdag na 30 min SLAPEN
    - timeout: 30min
      then:
        - if:
            condition:
              lambda: 'return id(cur_page) != 9 && id(wk_af).state != "on";'
            then:
              - lvgl.widget.hide: qp
              - light.turn_off: display_backlight
              - lvgl.page.show: p_nacht

  # ---- vaste lagen over alle schermen: spelerbalk (boven), paneel LICHT & SCHERM,
  #      onderbalk (y 416) en het wekkerscherm (alles bedekkend)
  top_layer:
    widgets:
      # ======== spelerbalk bovenin (68 px)
      - obj:
          id: mini
          x: 0
          y: 0
          width: 480
          height: 68
          bg_color: ${c_inkbg}
          bg_opa: COVER
          text_color: ${c_papert}
          hidden: true
          widgets:
            # hoes + titel: tik = Nu speelt
            - obj:
                x: 0
                y: 0
                width: 284
                height: 68
                on_click:
                  - lvgl.page.show: p_muziek
                widgets:
                  - obj:
                      x: 0
                      y: 0
                      width: 68
                      height: 68
                      styles: st_deco
                      bg_color: ${c_blue}
                      clickable: false
                      widgets:
                        - obj: {x: 28, y: -10, width: 50, height: 50, radius: 25, styles: st_deco, bg_color: "${c_red}", clickable: false}
                        - obj: {x: 0, y: 46, width: 68, height: 22, styles: st_deco, bg_color: "${c_paper}", clickable: false}
                  # dezelfde hoes als op Nu speelt (176 px), verkleind tot 68 px en bijgesneden
                  - obj:
                      x: 0
                      y: 0
                      width: 68
                      height: 68
                      clickable: false
                      widgets:
                        - image: {id: mi_cover, x: -54, y: -54, src: cov_big, scale: 0.39, hidden: true, clickable: false}
                  - label:
                      id: mi_title
                      x: 80
                      y: 13
                      width: 200
                      long_mode: DOT
                      text_font: f_15
                      text: "Woonkamer"
                  - label:
                      id: mi_sub
                      x: 80
                      y: 40
                      width: 200
                      long_mode: DOT
                      styles: st_mono11
                      text_color: ${c_grey}
                      text: "WOONKAMER"
            - button:
                x: 288
                y: 12
                width: 44
                height: 44
                radius: 22
                bg_color: ${c_red}
                bg_opa: COVER
                pressed:
                  bg_color: ${c_paper}
                on_click:
                  - script.execute: {id: mp_cmd, a: "media_player.media_play_pause"}
                widgets:
                  - label: {id: mi_play_i, align: CENTER, text: "${ic_pause}", text_font: f_ic22, text_color: "${c_ink}"}
            - button:
                x: 340
                y: 12
                width: 40
                height: 44
                bg_opa: TRANSP
                border_width: 1
                border_color: ${c_dline}
                pressed:
                  bg_color: ${c_dline}
                on_click:
                  - script.execute: {id: mp_volume, d: -5}
                widgets:
                  - label: {align: CENTER, text: "${ic_minus}", text_font: f_ic22, text_color: "${c_papert}"}
            - label:
                id: mi_vol
                x: 382
                y: 18
                width: 44
                text_align: CENTER
                text_font: f_m12
                text: "–"
            - obj: {x: 384, y: 40, width: 40, height: 3, styles: st_deco, bg_color: "${c_dline}", clickable: false}
            - obj: {id: mi_volbar, x: 384, y: 40, width: 14, height: 3, styles: st_deco, bg_color: "${c_red}", clickable: false}
            - button:
                x: 428
                y: 12
                width: 40
                height: 44
                bg_opa: TRANSP
                border_width: 1
                border_color: ${c_dline}
                pressed:
                  bg_color: ${c_dline}
                on_click:
                  - script.execute: {id: mp_volume, d: 5}
                widgets:
                  - label: {align: CENTER, text: "${ic_plus}", text_font: f_ic22, text_color: "${c_papert}"}

      # ======== paneel LAMPEN & SCHERM (knop LICHT rechts in de onderbalk)
      - obj:
          id: qp
          x: 0
          y: 0
          width: 480
          height: 416
          bg_color: ${c_paper}
          bg_opa: COVER
          text_color: ${c_ink}
          hidden: true
          widgets:
            - obj: {x: 330, y: 250, width: 220, height: 220, radius: 110, styles: st_deco, bg_color: "${c_blue}", clickable: false}
            - obj: {x: 0, y: 47, width: 480, height: 1, styles: st_deco, bg_color: "${c_line}", clickable: false}
            - label: {x: 24, y: 17, styles: st_mono12, text_color: "${c_redt}", text: "LICHT"}
            - label: {x: 76, y: 17, styles: st_mono12, text: "LAMPEN & SCHERM"}
            - label: {id: hd_tq, x: 300, y: 17, width: 96, text_align: RIGHT, styles: st_mono12, text: "--:--"}
            - button:
                x: 412
                y: 4
                width: 56
                height: 40
                bg_opa: TRANSP
                on_click:
                  - lvgl.widget.hide: qp
                widgets:
                  - label: {align: CENTER, text: "${ic_close}", text_font: f_ic22}
            # lampen (slaapkamer Maartje en Jeroen)
            - label: {x: 24, y: 64, styles: st_mono11, text_color: "${c_sub}", text: "LAMPEN"}
            - button:
                x: 24
                y: 82
                width: 138
                height: 64
                styles: st_tile
                on_click:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: light.slaapkamer_jeroen_maartje
                        brightness_pct: "100"
                widgets:
                  - label: {x: 12, y: 10, text: "${ic_bulb}", text_font: f_ic22}
                  - label: {x: 12, y: 40, styles: st_mono11, text: "AAN"}
            - button:
                x: 171
                y: 82
                width: 138
                height: 64
                styles: st_tile
                on_click:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: light.slaapkamer_jeroen_maartje
                        brightness_pct: "20"
                        transition: "2"
                widgets:
                  - label: {x: 12, y: 10, text: "${ic_dim}", text_font: f_ic22}
                  - label: {x: 12, y: 40, styles: st_mono11, text: "GEDIMD 20%"}
            - button:
                x: 318
                y: 82
                width: 138
                height: 64
                bg_color: ${c_inkbg}
                bg_opa: COVER
                text_color: ${c_papert}
                pressed:
                  bg_color: ${c_red}
                on_click:
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: light.slaapkamer_jeroen_maartje
                widgets:
                  - label: {x: 12, y: 10, text: "${ic_power}", text_font: f_ic22}
                  - label: {x: 12, y: 40, styles: st_mono11, text: "UIT"}
            # scherm
            - label: {x: 24, y: 164, styles: st_mono11, text_color: "${c_sub}", text: "SCHERM"}
            - button:
                x: 24
                y: 182
                width: 138
                height: 64
                styles: st_tile
                on_click:
                  # NORMAAL: overdag 100%, 's nachts 60% (donker schema; 35% was onleesbaar)
                  - light.turn_on:
                      id: display_backlight
                      brightness: !lambda |-
                        auto t = id(system_time).now();
                        return (t.is_valid() && (t.hour >= 21 || t.hour < 6)) ? ${nacht_hl}f : 1.0f;
                  - lvgl.widget.hide: qp
                widgets:
                  - label: {x: 12, y: 10, text: "${ic_brightness}", text_font: f_ic22}
                  - label: {x: 12, y: 40, styles: st_mono11, text: "NORMAAL"}
            - button:
                x: 171
                y: 182
                width: 138
                height: 64
                styles: st_tile
                on_click:
                  - lvgl.widget.hide: qp
                  - lvgl.page.show: p_nacht
                  - light.turn_on: {id: display_backlight, brightness: 40%}
                widgets:
