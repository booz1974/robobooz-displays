# =====================================================================
# ROBOBOOZ - RASTER & CIRKEL (nieuwe stijl) voor ESPHome / LVGL
# Ontwerp en bouw: Jeroen van Sonsbeek
#
# display-slaapkamer - Guition ESP32-S3-4848S040 (480x480, 1 relais) -
#   slaapkamerpaneel (begonnen als display-test),
#   voor de slaapkamer van Maartje en Jeroen (licht en sfeer van de slaapkamer;
#   muziek en klimaat nog van de woonkamer).
#   Versie 0.21 (25-11-2026): klok onleesbaar in het donkere schema: gewone scherm 's nachts
#   en gedimd in het donkere schema nu 60% (was 35%; door de gamma gaf dat bijna geen licht).
#   Tekst en klok in het donkere schema lichter (licht zand 0xD2C6B8, grijs 0x948A7F).
#   Versie 0.20 (25-11-2026): donker schema werkte niet: het kleurfilter van LVGL staat
#   standaard uit; nu aangezet met build_flags -DLV_USE_COLOR_FILTER=1.
#   Versie 0.19 (25-11-2026): avondstand is nu een DONKER KLEURENSCHEMA ("warm donker":
#   bruin-zwart, zandkleurige letters, diep rood en blauw) in plaats van omgedraaide
#   kleuren; vanzelf aan van 20:00 tot 09:00 (nachttijd voor dimmen/uit blijft 21-06).
#   Thuis: cirkel en kwartcirkel staan elk kwartier op een andere plek en in een andere
#   grootte; het kwart komt steeds in een ander kwadrant. Hoes: zoom -> scale.
#   Versie 0.18 (25-11-2026): BEDTIJD pas na 2 s vasthouden (het rondje loopt vol met
#   zwart); DEURBEL (09): bij aanbellen vanzelf het camerabeeld van de voordeur
#   (ververst elke 3 s), "Er wordt aangebeld" + tijd, LAMP HAL AAN en SLUITEN; ook via
#   Menu -> Voordeur (vervangt Nachtstand, die zit in LICHT). GOEDEMORGEN: na STOP van
#   de wekker datum, tijd, buiten en de afspraken van vandaag (sensor.agenda_vandaag_display).
#   Versie 0.17 (25-11-2026): knop BEDTIJD op Thuis (onder LICHT UIT): lampen badkamer,
#   hal, toilet, overloop, zolderoverloop, studio en deze slaapkamer uit, alleen de
#   e-deken-smartplug uit (als hij aan staat), thermostaat woonkamer op 15 °C
#   (script.bedtijd in HA). Korte bevestiging onder het weer.
#   Versie 0.16 (25-11-2026): eenmalige use_address: display-test.local weggehaald
#   (het display heeft de nieuwe naam display-slaapkamer).
#   Versie 0.15 (25-11-2026): FAVORIETEN (08): radio en playlists uit Music
#   Assistant (meest gespeeld bovenaan), tabbladen RADIO / PLAYLISTS, tik = afspelen
#   op de speler (playlists op shuffle). Via Nu speelt en via Menu (vervangt Thuis).
#   Versie 0.14 (25-11-2026): HA-verbinding elke 3 s gecontroleerd (de melding
#   "geen verbinding" bleef staan als de ESPHome-logviewer werd gesloten).
#   Apparaat heet nu ook display-slaapkamer (was
#   display-test).
#   Entiteit: light.display_slaapkamer_schermverlichting.
#   Versie 0.13 (25-11-2026): bestand heet nu display-slaapkamer.yaml; het apparaat
#   heet in ESPHome/HA nog display-test (zo blijven draadloos bijwerken en de
#   entiteiten in HA gewoon werken). Zichtbare naam: Display slaapkamer.
#   Versie 0.12 (25-11-2026): adres van HA uit secrets.yaml (ha_url) i.p.v. in de code.
#   Versie 0.11 (25-11-2026): na review tester/ontwikkelaar/gebruiker:
#   - nachtstand-klok echt zichtbaar (40%; de schermverlichting heeft een
#     gamma-curve, 15% was bijna uit) + kleine wekkertijd/sluimerregel; blijft staan
#   - SLAPEN blijft uit (ging overdag na 1 min weer aan); wekkerscherm dimt nooit
#   - herstart 's nachts: niet fel, avondstand en nachtstand na de tijdsynchronisatie
#   - geheugen zoals woonkamer/Jip; hoes één keer ophalen; http-timeout 6 s
#   - zichtbaar als HA weg is; wekkertijd wordt alsnog gestuurd als HA terug is
#   - "?" / "–" bij onbekende stand i.p.v. "Uit"; volume springt niet terug
#   - onderbalk LICHT (was DIM) opent LAMPEN & SCHERM, met PER LAMP ›
#   - LICHT UIT-knop op Thuis; Kamer (slaapkamer-thermometer) i.p.v. Klimaat woonkamer
#   - grotere dagknoppen en wekkerregel; bevestiging "Sluimert tot ..."
#   - Probeer nu zwart (gaat meteen af); schermnummers 00-07 doorlopend; Latin-1-letters
#   Versie 0.10 (25-11-2026): tik op SLAPEN (scherm uit) = altijd eerst de
#   nachtstand, tik op de nachtstand = NORMAAL (ook overdag).
#   Versie 0.9 (25-11-2026): DIM-paneel, standen van het scherm heten nu NORMAAL,
#   NACHTSTAND en SLAPEN.
#   Versie 0.8 (25-11-2026): licht, sfeer en DIM-lampen naar de slaapkamer van
#   Maartje en Jeroen (Alles, Plafond, Ledstrip; scènes slaapkamer_jeroen_maartje_*).
#   Versie 0.7 (25-11-2026): nachtstand-klok weer zichtbaar: scherm 15% (was 6%)
#   en klok gedempt rood 0x9A3422 (was te donker).
#   Versie 0.6 (25-11-2026): nacht (21-6): na 1 min niets aanraken scherm uit;
#   eerste tik = nachtstand (alleen een donkere klok, 15%), volgende tik = gewone
#   scherm in de avondstand, gedimd (35%); nachtstand gaat na 20 s weer uit.
#   Avondstand vanzelf om 21:00 aan en om 06:00 uit; in de nachtstand nooit omgedraaid.
#   Versie 0.5 (25-11-2026): wekkerscherm met sluimertijd - / + (5..30 min,
#   standaard 5); volume 20% -> 50% in 1 min -> 80% na 5 min (Alarm 60%, de lampen
#   knipperen fel wit als er na 1 min nog niet op STOP of SLUIMER is getikt).
#   Versie 0.4 (25-11-2026): avondstand werkt: de SPI naar het scherm wordt
#   eerst weer aangemeld (de driver geeft hem na het opstarten vrij).
#   Versie 0.3 (25-11-2026): spelerbalk hoger (68 px, hoes 68x68) zodat titel en
#   artiest niet meer wegvallen; wekkerpagina 4 px opgeschoven.
#   Versie 0.2 (25-11-2026): spelerbalk bovenin met echte hoes, hoes op
#   Nu speelt, nieuw menu, WEKKER (+ wekkergeluid, afgaan-scherm), DIM-paneel
#   (lampen aan/dimmen/uit, scherm normaal/nachtstand/slapen, avondstand),
#   nachtstand-scherm en avondstand (alle kleuren omgedraaid).
#   Versie 0.1 (25-11-2026): stap 1 van de mockups "Woonkamer display – nieuwe stijl".
# Stijl: warm papierwit, zwarte strakke letters (Inter Tight), kleine labels in
#   typemachineletter (IBM Plex Mono), vlakken en cirkels in vermiljoen en
#   ultramarijn. Elk scherm: nummer + titel linksboven, tijd rechtsboven.
# Pagina's: Thuis | 01 Licht | 02 Sfeer | 03 Nu speelt | 04 Kamer | 05 Weer |
#   06 Wekker | 07 Wekkergeluid | 08 Favorieten | 09 Deurbel | Goedemorgen |
#   Nachtstand | 00 Menu.
# Favorieten: radio en playlists uit Music Assistant (${ma_url}, token ma_api_token),
#   opgehaald 45 s na het opstarten en opnieuw als de lijst ouder is dan 15 min.
# Onderbalk (op elk scherm, behalve nachtstand): THUIS / WEKKER / MUZIEK /
#   MENU / LICHT (zwart = waar je bent). LICHT opent het paneel LAMPEN & SCHERM:
#   lampen AAN / GEDIMD (20%) / UIT, scherm NORMAAL / NACHTSTAND (alleen de klok,
#   gedimd) / SLAPEN (scherm helemaal uit) en
#   AVONDSTAND aan/uit (de hele kleurenset omgedraaid via het scherm zelf).
# Spelerbalk: bovenin (68 px) zolang de woonkamer speelt of gepauzeerd is:
#   hoes, titel (tik = Nu speelt), pauze, volume - en +. De schermen schuiven
#   dan 68 px omlaag. Niet op Nu speelt en niet in de nachtstand.
# Hoes: entity_picture_local van de speler via HA (online_image, AUTO-formaat);
#   lukt het downloaden niet, dan blijft de abstracte hoes staan.
# Thuis: datum, grote klok, LICHT UIT (slaapkamer) en BEDTIJD (rest van het huis uit,
#   thermostaat 15 °C), weer + regen in één regel, vier tegels:
#   Licht (aantal aan), Sfeer (laatste keuze), Wekker (tijd of Uit), Weer.
# Licht: slaapkamer: Alles, Plafond en Ledstrip: schakelaar = aan/uit, balk = helderheid
#   (slepen en loslaten), ALLES AAN / ALLES UIT.
# Sfeer: 7 scènes van de slaapkamer (Helder, Gedimd, Lezen, Ontspannen, Nachtlampje,
#   Lentebloesem, Savanne) en ALLES UIT.
# Nu speelt: hoes, titel, artiest - album, vorige / pauze / volgende,
#   volume - en +. Speler: media_player.yamaha_living_2 (woonkamer).
# Kamer: temperatuur en vocht van de slaapkamer (thermometer), met een korte
#   regel (fris / prima om te slapen / warm).
# Weer: temperatuur, omschrijving, wind (Bft) en vocht, regen komende 2 uur
#   (12 balkjes van 10 min, Buienradar) en de komende 6 uur.
# Wekker: tijd -/+ uur en -/+ 5 min, aan/uit, WERKDAGEN / ELKE DAG / WEEKEND,
#   geluid (aparte pagina) en zonsopgang-licht. Wekkergeluid: Fluisterwekker,
#   Wekkerbrigade (ElevenLabs, zoals de intercom), Zoemer, Klassieke wekker,
#   Alarm (mp3 in /config/www/robobooz/), Rustig wekken, Muziek (NPO Radio 2),
#   Natuurgeluiden, Alleen licht; PROBEER NU laat hem meteen afgaan.
#   Gaat hij af: volledig scherm met klok, SLUIMER (- / + per 5 min, standaard 5)
#   en STOP. Volume (regelt HA, script.wekker_afgaan): 20%, in 1 minuut 50%, na
#   5 minuten 80%; Alarm meteen 60% en na 1 minuut zonder reactie knipperen de
#   lampen fel wit. Licht in 20 stapjes naar 100% in 5 minuten. STOP en SLUIMER
#   werken meteen. Speelde er al muziek, dan pauzeert die en gaat
#   na STOP verder op het oude volume (dat regelt HA, niet het display).
# Tikken: SLAPEN (scherm uit) -> tik -> NACHTSTAND (zwart, alleen een gedempt
#   rode klok, 15%) -> tik -> NORMAAL. Dat geldt altijd, ook overdag.
# Nacht (21:00-06:00): na 1 min niets aanraken gaat het scherm uit (slapen).
#   Eerste tik = nachtstand, volgende tik = gewone scherm (avondstand, 35%);
#   de nachtstand gaat na 20 s vanzelf weer uit.
# Scherm overdag: eerste tik maakt alleen wakker; na 1 min 65%, na 2 min 35%,
#   na 30 min uit. Avondstand vanzelf aan om 21:00, uit om 06:00.
# Hardware: touch met vaste kalibratie 0..479 (zoals Jip: de touchchip van dit
#   paneel meldt 1024x600). Relais niet in gebruik en bewust niet ingesteld.
#   Avondstand stuurt INVON/INVOFF (0x21/0x20) naar de ST7701S.
# secrets.yaml: wifi_ssid, wifi_password, ha_url, ma_url, ma_api_token, plate04_api_key,
#   plate04_ota_password, plate04_ap_password (zie secrets.example.yaml).
#
# Vereist in Home Assistant: ESPHome-integratie -> Display slaapkamer -> Configureren ->
# "Sta het apparaat toe Home Assistant-acties uit te voeren" AAN.
# Gebruikt in Home Assistant: light.slaapkamer_jeroen_maartje (groep),
#   light.slaapkamer_jeroen_en_maartje, light.slaapkamer_lichtstrip,
#   scene.slaapkamer_jeroen_maartje_helder / _gedimd / _lezen / _ontspannen /
#   _nachtlampje / _lentebloesem / _savanne_zonsondergang, media_player.yamaha_living_2 (+ entity_picture_local),
#   sensor.thermo_slaapkamer_jeroen_maartje_temperatuur_3 / _luchtvochtigheid_3,
#   weather.de_scholekster,
#   sensor.neerslag_buienradar_regen_data, input_text.weer_uren_display.
# Wekker in HA: input_datetime.wekker_slaapkamer_tijd,
#   input_boolean.wekker_slaapkamer_aan / _lampen / _gaat_af,
#   input_select.wekker_slaapkamer_dagen / _geluid,
#   input_number.wekker_slaapkamer_sluimertijd (5..30 min, stap 5),
#   input_boolean.wekker_slaapkamer_muziek_hervatten, input_number.wekker_slaapkamer_oud_volume,
#   input_text.wekker_slaapkamer_speaker (nu media_player.yamaha_living_2),
#   script.wekker_slaapkamer_afgaan / _stop / _sluimer, automation.wekker_slaapkamer,
#   script.bedtijd (knop BEDTIJD, 2 s vasthouden), camera.voordeur +
#   binary_sensor.voordeur_ringing (deurbel), sensor.agenda_vandaag_display (goedemorgen),
#   light.slaapkamer_jeroen_maartje (zonsopgang), script.intercom_zend,
#   /config/www/robobooz/wekker_zoemer.mp3, wekker_klassiek.mp3,
#   wekker_alarm.mp3, wekker_rustig.mp3.
# =====================================================================

esphome:
  name: display-slaapkamer
  friendly_name: Display slaapkamer
  min_version: 2025.7.0
  platformio_options:
    board_build.flash_mode: dio
  # kleurfilter van LVGL aanzetten (staat standaard uit); nodig voor het donkere schema
  build_flags:
    - -DLV_USE_COLOR_FILTER=1
  on_boot:
    - priority: -100
      then:
        - script.execute: clock_render
        - script.execute: deco_mix
        - script.execute: {id: nav_mark, p: 0}
        # bewaarde avondstand = waarschijnlijk nacht: gedimd beginnen (de klok volgt bij tijdsync)
        - light.turn_on:
            id: display_backlight
            brightness: !lambda 'return id(avond) ? 0.40f : 1.0f;'
        - delay: 2s
        - script.execute: avond_apply
    - priority: -200
      then:
        - delay: 45s
        - script.execute: fav_fetch

external_components:
  - source:
      type: local
      path: components
    components: [robobooz_build]

robobooz_build:

# ---------------------------------------------------------------- hardware
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  watchdog_timeout: 30s
  framework:
    type: esp-idf
    advanced:
      loop_task_stack_size: 16384
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_SPIRAM_USE_MALLOC: y
      # zoals woonkamer/Jip: alleen kleine allocaties intern, de rest naar PSRAM,
      # en 48 KB intern vrijhouden (anders loopt het interne RAM vol bij hoesjes)
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "512"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "49152"

psram:
  mode: octal
  speed: 80MHz

preferences:
  flash_write_interval: 5min

logger:
  level: INFO

api:
  encryption:
    key: !secret plate04_api_key
  # verbinding met HA: zie 'interval' (ha_check). Niet via on_client_connected/
  # disconnected: ook de logviewer van ESPHome is een client, en als die sloot
  # leek HA weg terwijl HA gewoon verbonden was.

ota:
  - platform: esphome
    password: !secret plate04_ota_password
    on_begin:
      then:
        - light.turn_off: display_backlight
        - lvgl.pause:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Display slaapkamer Fallback"
    password: !secret plate04_ap_password

captive_portal:

output:
  - platform: ledc
    pin: GPIO38
    id: gpio_backlight_pwm
    frequency: 100Hz

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Schermverlichting
    id: display_backlight
    restore_mode: ALWAYS_OFF   # aan via on_boot (gedimd als het nacht was)
    default_transition_length: 400ms

i2c:
  - id: bus_a
    sda:
      number: 19
    scl:
      number: 45
      ignore_strapping_warning: true

touchscreen:
  platform: gt911
  id: my_touchscreen
  display: my_display
  i2c_id: bus_a
  # dit paneel: GT911 geeft 0..479 door maar meldt 1024x600; vast bereik instellen
  calibration:
    x_min: 0
    x_max: 479
    y_min: 0
    y_max: 479
  on_touch:
    # eerste tik bij een gedimd/uit scherm of in de nachtstand: alleen wakker maken,
    # zodat je niet per ongeluk een knop raakt
    - lambda: |-
          auto &bl = id(display_backlight).current_values;
          auto t = id(system_time).now();
          bool nacht = t.is_valid() && (t.hour >= 21 || t.hour < 6);
          float vol = nacht ? ${nacht_hl}f : 1.0f;   // 's nachts is het gewone scherm gedimd
          bool wekker = id(wk_af).state == "on";
          bool slaap = !bl.is_on() || id(lvgl_main)->is_paused() ||
                       (!wekker && (bl.get_brightness() < vol - 0.01f || id(cur_page) == 9));
          if (slaap) {
            lv_indev_t *in = lv_indev_get_next(nullptr);
            if (in != nullptr) lv_indev_wait_release(in);
          }
    - if:
        condition:
          lambda: 'return id(wk_af).state == "on";'
        # de wekker gaat af: scherm vol aan, verder niets (STOP en SLUIMER werken direct)
        then:
          - lvgl.resume:
          - light.turn_on: {id: display_backlight, brightness: 100%}
        else:
          - if:
              condition:
                lambda: 'return !id(display_backlight).current_values.is_on();'
              # SLAPEN (scherm uit) -> tik -> NACHTSTAND (alleen de klok, gedimd)
              then:
                - lvgl.resume:
                - lvgl.widget.hide: qp
                - lvgl.page.show: p_nacht
                - light.turn_on: {id: display_backlight, brightness: 40%}
              # NACHTSTAND -> tik -> NORMAAL ('s nachts omgedraaid en gedimd, 35%)
              else:
                - if:
                    condition:
                      lambda: 'return id(cur_page) == 9;'
                    then:
                      - lvgl.page.show: p_home
                - lvgl.resume:
                - light.turn_on:
                    id: display_backlight
                    brightness: !lambda |-
                      auto t = id(system_time).now();
                      return (t.is_valid() && (t.hour >= 21 || t.hour < 6)) ? ${nacht_hl}f : 1.0f;

spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

display:
  - platform: st7701s
    id: my_display
    update_interval: never
    auto_clear_enabled: false
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: false
    dimensions:
      width: 480
      height: 480
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    pclk_frequency: 12MHz
    pclk_inverted: false
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]
    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]

time:
  - platform: homeassistant
    id: system_time
    on_time_sync:
      - script.execute: clock_render
      # eerste keer de tijd binnen (na een herstart): avondstand volgens de klok,
      # en 's nachts meteen de nachtstand in plaats van een fel scherm
      - if:
          condition:
            lambda: 'return !id(tijd_gezet);'
          then:
            - lambda: |-
                id(tijd_gezet) = true;
                auto t = id(system_time).now();
                id(avond) = t.is_valid() && (t.hour >= 20 || t.hour < 9);
            - script.execute: avond_apply
            - if:
                condition:
                  lambda: |-
                    auto t = id(system_time).now();
                    return t.is_valid() && (t.hour >= 21 || t.hour < 6) && id(wk_af).state != "on";
                then:
                  - lvgl.page.show: p_nacht
                  - light.turn_on: {id: display_backlight, brightness: 40%}
    on_time:
      - seconds: 0
        then:
          - script.execute: clock_render
      # vormen op Thuis elk kwartier ergens anders
      - seconds: 0
        minutes: /15
        then:
          - script.execute: deco_mix
      # donker schema vanzelf: om 20:00 aan, om 09:00 uit (met DIM kan het altijd met de hand)
      - seconds: 0
        minutes: 0
        hours: 20
        then:
          - lambda: 'id(avond) = true;'
          - script.execute: avond_apply
      # 21:00 nachttijd: staat het gewone scherm aan, dan meteen gedimd
      - seconds: 0
        minutes: 0
        hours: 21
        then:
          # staat het gewone scherm aan: meteen naar de nachthelderheid
          - if:
              condition:
                lambda: 'return id(display_backlight).current_values.is_on() && id(cur_page) != 9 && id(wk_af).state != "on";'
              then:
                - light.turn_on: {id: display_backlight, brightness: !lambda 'return ${nacht_hl}f;'}
      - seconds: 0
        minutes: 0
        hours: 9
        then:
          - lambda: 'id(avond) = false;'
          - script.execute: avond_apply

# ---------------------------------------------------------------- kleuren en iconen

# ---------------------------------------------------------------- hoes (album art)
# (verderop ook het camerabeeld van de voordeur)
http_request:
  verify_ssl: false
  timeout: 6s
  buffer_size_rx: 2048
  buffer_size_tx: 2048

image:
  # camerabeeld voordeur (deurbelscherm); ververst elke 3 s zolang het scherm open is
  - platform: online_image
    id: cam_img
    url: "${ha_url}/local/robobooz/commercial_break_200x200bb.jpg"
    format: JPEG
    type: RGB565
    resize: 480x270
    on_download_finished:
      - lvgl.image.update: {id: dr_img, src: cam_img}
      - lvgl.widget.show: dr_img
  # grote hoes op Nu speelt (url wordt gezet zodra er een hoes is)
  - platform: online_image
    id: cov_big
    url: "${ha_url}/local/robobooz/commercial_break_200x200bb.jpg"
    format: AUTO
    type: RGB565
    resize: 176x176
    on_download_finished:
      - lvgl.image.update: {id: mu_cover, src: cov_big}
      - lvgl.image.update: {id: mi_cover, src: cov_big}
      - lvgl.widget.show: [mu_cover, mi_cover]
    on_error:
      - lvgl.widget.hide: [mu_cover, mi_cover]

substitutions:
  c_paper: "0xEEEBE4"    # papierwit (achtergrond)
