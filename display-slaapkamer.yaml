                      data:
                        entity_id: input_number.wekker_slaapkamer_sluimertijd
                widgets:
                  - label: {align: CENTER, text: "${ic_minus}", text_font: f_ic30}
            - button:
                x: 112
                y: 236
                width: 256
                height: 80
