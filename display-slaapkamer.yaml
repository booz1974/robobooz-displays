    internal: true
    on_value: {script.execute: wk_render}
  - platform: homeassistant
    id: wk_af
    entity_id: input_boolean.wekker_slaapkamer_gaat_af
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return x == "on";'
          then:
            - lambda: 'id(sluimer_tot) = -1;'
            - lvgl.resume:
            - light.turn_on: {id: display_backlight, brightness: 100%}
            - lvgl.widget.show: ring
            - script.execute: wk_render
          else:
