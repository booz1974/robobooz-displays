          lv_obj_set_style_text_color(id(fv_t0), lv_color_hex(radio ? ${c_papert} : ${c_ink}), 0);
          lv_obj_set_style_bg_color(id(fv_t1), lv_color_hex(!radio ? ${c_inkbg} : ${c_paper}), 0);
          lv_obj_set_style_text_color(id(fv_t1), lv_color_hex(!radio ? ${c_papert} : ${c_ink}), 0);
          const auto &L = id(fav_list);
          static const uint32_t dot[] = {${c_red}, ${c_blue}, ${c_inkbg}};
          int n = 0;
          for (size_t i = 0; i + 2 < L.size(); i += 3) {
            if ((L[i + 2] == "r") != radio) continue;
            bool sel = L[i + 1] == id(fav_sel);
            lv_obj_t *b = lv_button_create(box);
            lv_obj_remove_style_all(b);
            lv_obj_set_size(b, 138, 64);
            lv_obj_set_style_bg_opa(b, LV_OPA_COVER, 0);
            lv_obj_set_style_bg_color(b, lv_color_hex(sel ? ${c_inkbg} : ${c_tile}), 0);
            lv_obj_set_style_bg_color(b, lv_color_hex(${c_inkbg}), LV_STATE_PRESSED);
            lv_obj_set_style_text_color(b, lv_color_hex(sel ? ${c_papert} : ${c_ink}), 0);
            lv_obj_set_style_text_color(b, lv_color_hex(${c_papert}), LV_STATE_PRESSED);
            lv_obj_set_style_clip_corner(b, true, 0);
            // cirkeltje rechtsboven, om en om rood / blauw / zwart
            lv_obj_t *c = lv_obj_create(b);
            lv_obj_remove_style_all(c);
            lv_obj_set_size(c, 40, 40);
            lv_obj_set_pos(c, 110, -12);
            lv_obj_set_style_radius(c, 20, 0);
            lv_obj_set_style_bg_opa(c, LV_OPA_COVER, 0);
            lv_obj_set_style_bg_color(c, lv_color_hex(dot[n % 3]), 0);
            lv_obj_remove_flag(c, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_t *t = lv_label_create(b);
            lv_obj_set_style_text_font(t, f15, 0);
            lv_label_set_long_mode(t, LV_LABEL_LONG_DOT);
            lv_obj_set_size(t, 110, 38);
            lv_obj_set_pos(t, 10, 8);
            lv_label_set_text(t, L[i].c_str());
            lv_obj_t *k = lv_label_create(b);
            lv_obj_set_style_text_font(k, fm, 0);
            lv_obj_set_style_text_letter_space(k, 1, 0);
            lv_obj_set_style_text_opa(k, LV_OPA_60, 0);
            lv_obj_set_pos(k, 10, 46);
            lv_label_set_text(k, sel ? "SPEELT" : (radio ? "RADIO" : "PLAYLIST"));
            lv_obj_add_event_cb(b, [](lv_event_t *e) {
              id(fav_click) = (int) (intptr_t) lv_event_get_user_data(e);
              id(fav_tap).execute();
            }, LV_EVENT_CLICKED, (void *) (intptr_t) i);
            n++;
          }
          lv_label_set_text(id(fav_empty), n > 0 ? "" : (L.empty() ? "Favorieten worden opgehaald..." : (radio ? "Geen favoriete zenders" : "Geen favoriete playlists")));
          if (id(avond)) id(avond_apply).execute();   // nieuwe tegels ook in het donkere schema
  # ---- tik op een favoriet: afspelen op de speler (playlists in willekeurige volgorde)
