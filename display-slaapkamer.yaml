binary_sensor:
  - platform: homeassistant
    id: deur_bel
    entity_id: binary_sensor.voordeur_ringing
    internal: true
    on_press:
      - lambda: |-
          auto t = id(system_time).now();
          char b[8] = "";
          if (t.is_valid()) snprintf(b, sizeof(b), "%02d:%02d", t.hour, t.minute);
          id(deur_tijd) = b;
      - if:
          condition:
            lambda: 'return id(wk_af).state != "on";'
          then:
            - lvgl.resume:
            - lvgl.widget.hide: qp
            - lvgl.page.show: p_deur
            - light.turn_on: {id: display_backlight, brightness: 100%}

