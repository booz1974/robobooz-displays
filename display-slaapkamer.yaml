          data:
            entity_id: ${speler}
            media_id: !lambda 'return id(fav_sel);'
            media_type: !lambda 'int i = id(fav_click); return std::string(i >= 0 && i + 2 < (int) id(fav_list).size() && id(fav_list)[i + 2] == "p" ? "playlist" : "radio");'
            enqueue: replace

