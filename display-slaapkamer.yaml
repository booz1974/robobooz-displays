            - label: {x: 24, y: 30, styles: st_mono12, text: "GOEDEMORGEN"}
            - label: {x: 24, y: 50, styles: st_mono11, text_color: "${c_sub}", text: "DE WEKKER GAAT AF"}
            - label: {id: r_clock, x: 18, y: 76, text_font: f_clock, text_letter_space: -6, text: "--:--"}
            # sluimertijd - / +  (stappen van 5 min, standaard 5)
            - button:
                x: 24
                y: 236
                width: 80
                height: 80
