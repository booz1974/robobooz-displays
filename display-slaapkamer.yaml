    on_value:
      - if:
          condition:
            lambda: 'return x.size() > 5 && x[0] == ''/'';'
          then:
            - online_image.set_url:
                id: cov_big
                url: !lambda 'return std::string("${ha_url}") + x;'
          else:
            - lvgl.widget.hide: [mu_cover, mi_cover]
  # ---- deurbel: camerabeeld (token wisselt, dus het adres volgen)
  - platform: homeassistant
    id: cam_pic
    entity_id: camera.voordeur
    attribute: entity_picture
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return x.size() > 5 && x[0] == ''/'';'
          then:
            - online_image.set_url:
                id: cam_img
                url: !lambda 'return std::string("${ha_url}") + x;'
