  c_blue: "0x2443C4"     # ultramarijn
  c_grey: "0xB9B4AA"     # grijze tekst op zwart
  c_dline: "0x3A3936"    # lijntjes op zwart
  c_off: "0xC9C3B7"      # schakelaar uit
  speler: "media_player.yamaha_living_2"
  ic_home: "\U000F02DC"
