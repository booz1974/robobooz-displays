# =====================================================================
# ROBOBOOZ - RASTER & CIRKEL (nieuwe stijl) voor ESPHome / LVGL
# Ontwerp en bouw: Jeroen van Sonsbeek
#
# display-test - Guition ESP32-S3-4848S040 (480x480, 1 relais) - testpaneel
#   Versie 0.1 (25-11-2026): stap 1 van de nieuwe stijl uit de mockups
#   "Woonkamer display – nieuwe stijl". Gebruikt de entiteiten van de woonkamer.
# Stijl: warm papierwit, zwarte strakke letters (Inter Tight), kleine labels in
#   typemachineletter (IBM Plex Mono), vlakken en cirkels in vermiljoen en
#   ultramarijn. Elk scherm: nummer + titel linksboven, tijd rechtsboven.
# Pagina's: Thuis | 01 Licht | 02 Sfeer | 03 Nu speelt | 05 Klimaat | 06 Weer |
#   00 Menu. Overige schermen uit de mockups volgen in latere stappen.
# Navigatie: onderbalk THUIS / LICHT / MUZIEK / MENU op elk scherm
#   (zwart = waar je bent). Alles in hoogstens twee tikken.
# Spelerbalk: zwarte balk boven de onderbalk zolang de woonkamer speelt of
#   gepauzeerd is: titel (tik = Nu speelt), pauze, volume - en +.
#   Niet zichtbaar op Nu speelt zelf.
# Thuis: datum, grote klok, weer + regen in één regel, vier tegels:
#   Licht (aantal aan), Sfeer (laatste keuze), Klimaat (kamer), Weer (regen).
# Licht: woonkamer, eettafel en keuken: schakelaar = aan/uit, balk = helderheid
#   (slepen en loslaten), ALLES AAN / ALLES UIT.
# Sfeer: 6 scènes, RANDOM KLEUREN (script.lampen_random_kleuren) en ALLES UIT.
#   De laatste keuze wordt zwart.
# Nu speelt: abstracte hoes, titel, artiest - album, vorige / pauze / volgende,
#   volume - en +. Speler: media_player.yamaha_living_2 (woonkamer).
# Klimaat: kamertemperatuur, gewenste temperatuur -/+ (0,5 °C), verwarming
#   aan/uit (climate.living_room).
# Weer: temperatuur, omschrijving, wind (Bft) en vocht, regen komende 2 uur
#   (12 balkjes van 10 min, Buienradar) en de komende 6 uur.
# Menu: tegels naar alle schermen + NACHT (scherm uit; tik = weer aan).
# Scherm: eerste tik maakt alleen wakker; na 1 min 65%, na 2 min 35%,
#   na 30 min uit.
# Hardware: touch met vaste kalibratie 0..479 (zoals Jip: de touchchip van dit
#   paneel meldt 1024x600). Relais niet in gebruik en bewust niet ingesteld.
# secrets.yaml: wifi_ssid, wifi_password, plate04_api_key,
#   plate04_ota_password, plate04_ap_password (zie secrets.example.yaml).
#
# Vereist in Home Assistant: ESPHome-integratie -> display-test -> Configureren ->
# "Sta het apparaat toe Home Assistant-acties uit te voeren" AAN.
# Gebruikt in Home Assistant: light.woonkamer, light.eettafel, light.keuken,
#   scene.woonkamer_woonkamer, scene.keuken_keuken_totaal, scene.eettafel_tafel,
#   scene.woonkamer_woonkamer_eettafel, scene.woonkamer_herfst_goud,
#   scene.woonkamer_tafel, scene.woonkamer_concentreren, scene.woonkamer_fairfax,
#   script.lampen_random_kleuren, media_player.yamaha_living_2,
#   climate.living_room, weather.de_scholekster,
#   sensor.neerslag_buienradar_regen_data, input_text.weer_uren_display.
# =====================================================================

esphome:
  name: display-test
  friendly_name: display test
  min_version: 2025.7.0
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    - priority: -100
      then:
        - script.execute: clock_render
        - script.execute: {id: nav_mark, p: 0}

# grote LVGL-config: voorkomt "dangerous relocation: l32r" bij het linken
external_components:
  - source:
      type: local
      path: components
    components: [robobooz_build]

robobooz_build:

# ---------------------------------------------------------------- hardware
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  watchdog_timeout: 30s
  framework:
    type: esp-idf
    advanced:
      loop_task_stack_size: 16384
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_SPIRAM_USE_MALLOC: y

psram:
  mode: octal
  speed: 80MHz

preferences:
  flash_write_interval: 5min

logger:
  level: INFO

api:
  encryption:
    key: !secret plate04_api_key

ota:
  - platform: esphome
    password: !secret plate04_ota_password
    on_begin:
      then:
        - light.turn_off: display_backlight
        - lvgl.pause:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "display test Fallback Hotspot"
    password: !secret plate04_ap_password

captive_portal:

output:
  - platform: ledc
    pin: GPIO38
    id: gpio_backlight_pwm
    frequency: 100Hz

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Schermverlichting
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 400ms

i2c:
  - id: bus_a
    sda:
      number: 19
    scl:
      number: 45
      ignore_strapping_warning: true

touchscreen:
  platform: gt911
  id: my_touchscreen
  display: my_display
  i2c_id: bus_a
  # dit paneel: GT911 geeft 0..479 door maar meldt 1024x600; vast bereik instellen
  calibration:
    x_min: 0
    x_max: 479
    y_min: 0
    y_max: 479
  on_touch:
    # scherm gedimd/uit: deze tik alleen om wakker te maken
    - lambda: |-
          auto &bl = id(display_backlight).current_values;
          bool slaap = !bl.is_on() || bl.get_brightness() < 0.99f || id(lvgl_main)->is_paused();
          if (slaap) {
            lv_indev_t *in = lv_indev_get_next(nullptr);
            if (in != nullptr) lv_indev_wait_release(in);
          }
    - lvgl.resume:
    - light.turn_on:
        id: display_backlight
        brightness: 100%

spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

display:
  - platform: st7701s
    id: my_display
    update_interval: never
    auto_clear_enabled: false
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: false
    dimensions:
      width: 480
      height: 480
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    pclk_frequency: 12MHz
    pclk_inverted: false
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]
    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]

time:
  - platform: homeassistant
    id: system_time
    on_time_sync:
      - script.execute: clock_render
    on_time:
      - seconds: 0
        then:
          - script.execute: clock_render

# ---------------------------------------------------------------- kleuren en iconen
substitutions:
  c_paper: "0xEEEBE4"    # papierwit (achtergrond)
  c_ink: "0x121212"      # zwart
  c_tile: "0xE3DED4"     # tegel
  c_tile2: "0xD6D0C4"    # vlak in een tegel
  c_line: "0xCFC9BE"     # lijntjes
  c_sub: "0x57534D"      # grijze tekst
  c_red: "0xE4472B"      # vermiljoen
  c_redt: "0xB3311A"     # vermiljoen voor tekst
  c_blue: "0x2443C4"     # ultramarijn
  c_grey: "0xB9B4AA"     # grijze tekst op zwart
  c_dline: "0x3A3936"    # lijntjes op zwart
  c_off: "0xC9C3B7"      # schakelaar uit
  speler: "media_player.yamaha_living_2"
  ic_home: "\U000F02DC"
  ic_bulb: "\U000F0335"
  ic_palette: "\U000F03D8"
  ic_thermo: "\U000F050F"
  ic_rain: "\U000F0597"
