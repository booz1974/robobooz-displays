  ic_prev: "\U000F04AE"
  ic_next: "\U000F04AD"
  ic_minus: "\U000F0374"
  ic_plus: "\U000F0415"
  ic_night: "\U000F0594"
  ic_power: "\U000F0425"
  ic_sunny: "\U000F0599"
  ic_clear: "\U000F0594"
  ic_pcloudy: "\U000F0595"
  ic_npcloudy: "\U000F0F31"
  ic_cloudy: "\U000F0590"
  ic_pouring: "\U000F0596"
  ic_snowy: "\U000F0598"
  ic_snowrain: "\U000F067F"
  ic_fog: "\U000F0591"
  ic_lightning: "\U000F0593"
