    size: 132
    bpp: 4
    glyphs: "0123456789:"
  - file: {type: gfonts, family: Inter Tight, weight: 600}
    id: f_72
    size: 72
    bpp: 4
    glyphs: "0123456789,-–°"
  - file: {type: gfonts, family: Inter Tight, weight: 600}
    id: f_44
    size: 44
    bpp: 4
    glyphs: &txt ' !"#%&''()*+,-./0123456789:;?@ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°·—–éèëïöüÉ’'
  - file: {type: gfonts, family: Inter Tight, weight: 600}
    id: f_26
    size: 26
    bpp: 4
    glyphs: *txt
  - file: {type: gfonts, family: Inter Tight, weight: 600}
    id: f_17
    size: 17
    bpp: 4
    glyphs: *txt
  - file: {type: gfonts, family: Inter Tight, weight: 500}
    id: f_15
    size: 15
    bpp: 4
    glyphs: *txt
  - file: {type: gfonts, family: IBM Plex Mono, weight: 500}
    id: f_m12
    size: 12
    bpp: 4
    glyphs: *txt
  - file: {type: gfonts, family: IBM Plex Mono, weight: 400}
    id: f_m11
    size: 11
    bpp: 4
    glyphs: *txt
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: f_ic22
    size: 22
    bpp: 4
    glyphs: &icons
      - "${ic_home}"
      - "${ic_bulb}"
      - "${ic_palette}"
      - "${ic_thermo}"
      - "${ic_rain}"
      - "${ic_music}"
      - "${ic_grid}"
      - "${ic_play}"
      - "${ic_pause}"
      - "${ic_prev}"
      - "${ic_next}"
      - "${ic_minus}"
      - "${ic_plus}"
      - "${ic_night}"
      - "${ic_power}"
      - "${ic_sunny}"
      - "${ic_pcloudy}"
      - "${ic_npcloudy}"
      - "${ic_cloudy}"
      - "${ic_pouring}"
      - "${ic_snowy}"
