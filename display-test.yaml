globals:
  - id: cur_page        # 0 thuis, 1 licht, 2 sfeer, 3 muziek, 4 klimaat, 5 weer, 6 menu, 7 wekker, 8 wekkergeluid, 9 nachtstand
    type: int
    initial_value: '0'
  - id: sf_idx          # laatste sfeerkeuze (-1 = nog niets)
    type: int
    restore_value: true
    initial_value: '-1'
  - id: vol_local       # volume 0..100 (direct bijgewerkt bij -/+)
    type: int
    initial_value: '-1'
  - id: wk_min          # wekkertijd in minuten na middernacht (direct bijgewerkt bij -/+)
    type: int
    initial_value: '420'
  - id: avond           # avondstand: kleuren omgedraaid
    type: bool
    restore_value: true
    initial_value: 'false'

text_sensor:
  - platform: homeassistant
    id: lt_s0
    entity_id: light.woonkamer
    internal: true
    on_value: {script.execute: lt_render}
  - platform: homeassistant
    id: lt_s1
    entity_id: light.eettafel
    internal: true
    on_value: {script.execute: lt_render}
  - platform: homeassistant
    id: lt_s2
    entity_id: light.keuken
    internal: true
    on_value: {script.execute: lt_render}
  - platform: homeassistant
    id: mp_st
    entity_id: ${speler}
    internal: true
    on_value: {script.execute: mp_render}
  - platform: homeassistant
    id: mp_title
    entity_id: ${speler}
    attribute: media_title
    internal: true
    on_value: {script.execute: mp_render}
  - platform: homeassistant
    id: mp_artist
    entity_id: ${speler}
    attribute: media_artist
    internal: true
    on_value: {script.execute: mp_render}
  - platform: homeassistant
    id: mp_album
    entity_id: ${speler}
    attribute: media_album_name
    internal: true
    on_value: {script.execute: mp_render}
  - platform: homeassistant
    id: wx_cond
    entity_id: weather.de_scholekster
    internal: true
    on_value: {script.execute: wx_render}
  # regen komende 2 uur: "VVV|HH:MM VVV|HH:MM ..." per 5 minuten (Buienradar)
  - platform: homeassistant
    id: wx_regen
    entity_id: sensor.neerslag_buienradar_regen_data
    attribute: data
    internal: true
    on_value: {script.execute: wx_render}
  # "uur|conditie|temp;..." (automatisering "Weer voor displays bijwerken")
  - platform: homeassistant
    id: wx_hours
    entity_id: input_text.weer_uren_display
    internal: true
    on_value: {script.execute: wx_render}
  - platform: homeassistant
    id: cl_mode
    entity_id: climate.living_room
    internal: true
    on_value: {script.execute: cl_render}
  # hoes van de speler (HA-proxy, lokaal)
  - platform: homeassistant
    id: mp_pic
    entity_id: ${speler}
    attribute: entity_picture_local
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return x.size() > 5 && x[0] == ''/'';'
          then:
            - online_image.set_url:
                id: cov_big
                url: !lambda 'return std::string("${ha_url}") + x;'
            - online_image.set_url:
                id: cov_mini
                url: !lambda 'return std::string("${ha_url}") + x;'
          else:
            - lvgl.widget.hide: [mu_cover, mi_cover]
  # ---- wekker
  - platform: homeassistant
    id: wk_tijd
    entity_id: input_datetime.wekker_slaapkamer_tijd
    internal: true
    on_value:
      - lambda: |-
          int h = 0, m = 0;
          if (sscanf(x.c_str(), "%d:%d", &h, &m) == 2) id(wk_min) = h * 60 + m;
      - script.execute: wk_render
  - platform: homeassistant
    id: wk_aan
    entity_id: input_boolean.wekker_slaapkamer_aan
    internal: true
    on_value: {script.execute: wk_render}
  - platform: homeassistant
    id: wk_dagen
    entity_id: input_select.wekker_slaapkamer_dagen
    internal: true
    on_value: {script.execute: wk_render}
  - platform: homeassistant
    id: wk_geluid
    entity_id: input_select.wekker_slaapkamer_geluid
    internal: true
    on_value: {script.execute: wk_render}
  - platform: homeassistant
    id: wk_lampen
    entity_id: input_boolean.wekker_slaapkamer_lampen
    internal: true
    on_value: {script.execute: wk_render}
  - platform: homeassistant
    id: wk_af
    entity_id: input_boolean.wekker_slaapkamer_gaat_af
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return x == "on";'
          then:
            - lvgl.resume:
            - light.turn_on: {id: display_backlight, brightness: 100%}
            - lvgl.widget.show: ring
          else:
            - lvgl.widget.hide: ring

sensor:
  - platform: homeassistant
    id: wk_sluimer
    entity_id: input_number.wekker_slaapkamer_sluimertijd
    internal: true
    on_value:
      - lambda: |-
          char t[24]; snprintf(t, sizeof(t), "Sluimer %d min", std::isnan(x) ? 5 : (int) lroundf(x));
          lv_label_set_text(id(r_sluimer), t);
  - platform: homeassistant
    id: lt_b0
    entity_id: light.woonkamer
    attribute: brightness
    internal: true
    on_value: {script.execute: lt_render}
  - platform: homeassistant
    id: lt_b1
    entity_id: light.eettafel
    attribute: brightness
    internal: true
    on_value: {script.execute: lt_render}
  - platform: homeassistant
    id: lt_b2
    entity_id: light.keuken
    attribute: brightness
    internal: true
    on_value: {script.execute: lt_render}
  - platform: homeassistant
    id: mp_vol
    entity_id: ${speler}
    attribute: volume_level
    internal: true
    on_value:
      - lambda: 'if (!std::isnan(x)) id(vol_local) = (int) lroundf(x * 100.0f);'
      - script.execute: mp_render
  - platform: homeassistant
    id: wx_temp
    entity_id: weather.de_scholekster
    attribute: temperature
    internal: true
    on_value: {script.execute: wx_render}
  - platform: homeassistant
    id: wx_wind
    entity_id: weather.de_scholekster
    attribute: wind_speed
    internal: true
    on_value: {script.execute: wx_render}
  - platform: homeassistant
    id: wx_hum
    entity_id: weather.de_scholekster
    attribute: humidity
    internal: true
    on_value: {script.execute: wx_render}
  - platform: homeassistant
    id: cl_cur
    entity_id: climate.living_room
    attribute: current_temperature
    internal: true
    on_value: {script.execute: cl_render}
  - platform: homeassistant
    id: cl_target
    entity_id: climate.living_room
    attribute: temperature
    internal: true
    on_value: {script.execute: cl_render}

# ---------------------------------------------------------------- scripts


# ---------------------------------------------------------------- scripts
script:
  # tijd en datum op alle schermen
  - id: clock_render
    then:
      - lambda: |-
          auto t = id(system_time).now();
          if (!t.is_valid()) return;
          char hm[8]; snprintf(hm, sizeof(hm), "%02d:%02d", t.hour, t.minute);
          lv_label_set_text(id(h_clock), hm);
          lv_label_set_text(id(n_clock), hm);
          lv_label_set_text(id(r_clock), hm);
          lv_obj_t *hl[] = {id(hd_t1), id(hd_t2), id(hd_t3), id(hd_t4), id(hd_t5), id(hd_t6), id(hd_t7), id(hd_t8), id(hd_tq)};
          for (auto *l : hl) lv_label_set_text(l, hm);
          static const char *dag[] = {"ZONDAG", "MAANDAG", "DINSDAG", "WOENSDAG", "DONDERDAG", "VRIJDAG", "ZATERDAG"};
          static const char *mnd[] = {"JANUARI", "FEBRUARI", "MAART", "APRIL", "MEI", "JUNI", "JULI",
                                      "AUGUSTUS", "SEPTEMBER", "OKTOBER", "NOVEMBER", "DECEMBER"};
          char d[40]; snprintf(d, sizeof(d), "%s %d %s", dag[(t.day_of_week + 6) % 7], t.day_of_month, mnd[(t.month + 11) % 12]);
          lv_label_set_text(id(h_date), d);
          lv_label_set_text(id(n_date), d);

  # onderbalk: zwart = huidige plek; spelerbalk bovenin als er muziek is
  - id: nav_mark
    parameters:
      p: int
    then:
      - lambda: |-
          id(cur_page) = p;
          int dk = p == 0 ? 0 : ((p == 7 || p == 8) ? 1 : (p == 3 ? 2 : (p == 6 ? 3 : -1)));
          lv_obj_t *b[] = {id(dk_0), id(dk_1), id(dk_2), id(dk_3)};
          for (int k = 0; k < 4; k++) {
            bool sel = k == dk;
            lv_obj_set_style_bg_color(b[k], lv_color_hex(sel ? ${c_ink} : ${c_paper}), 0);
            lv_obj_set_style_text_color(b[k], lv_color_hex(sel ? ${c_paper} : ${c_ink}), 0);
          }
          // nachtstand: geen onderbalk en geen paneel
          if (p == 9) { lv_obj_add_flag(id(dock), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(qp), LV_OBJ_FLAG_HIDDEN); }
          else lv_obj_clear_flag(id(dock), LV_OBJ_FLAG_HIDDEN);
      - script.execute: mini_vis

  - id: mini_vis
    then:
      - lambda: |-
          std::string s = id(mp_st).state;
          bool muziek = (s == "playing" || s == "paused") && id(cur_page) != 3 && id(cur_page) != 9;
          if (muziek) lv_obj_clear_flag(id(mini), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(mini), LV_OBJ_FLAG_HIDDEN);
          lv_obj_t *pg[] = {id(pg_home), id(pg_licht), id(pg_sfeer), id(pg_klimaat), id(pg_weer), id(pg_menu), id(pg_wekker), id(pg_wgeluid)};
          for (auto *o : pg) lv_obj_set_y(o, muziek ? 68 : 0);

  # avondstand: het scherm zelf keert alle kleuren om (ST7701S INVON 0x21 / INVOFF 0x20)
  - id: avond_apply
    then:
      - lambda: |-
          // zelfde als write_command_ van de driver (geen DC-pin: 9-bits SPI, bit 8 = 0 = commando).
          // De driver geeft de SPI na het opstarten vrij (spi_teardown), dus eerst weer aanmelden.
          using SD = esphome::spi::SPIDevice<esphome::spi::BIT_ORDER_MSB_FIRST, esphome::spi::CLOCK_POLARITY_LOW,
                                             esphome::spi::CLOCK_PHASE_LEADING, esphome::spi::DATA_RATE_1MHZ>;
          SD *spi = id(my_display);
          spi->spi_setup();
          spi->enable();
          spi->write(id(avond) ? 0x21 : 0x20, 9);
          spi->disable();
          spi->spi_teardown();
          ESP_LOGI("avond", "avondstand %s (INV%s)", id(avond) ? "aan" : "uit", id(avond) ? "ON" : "OFF");
          if (id(avond)) lv_obj_add_state(id(qp_avond), LV_STATE_CHECKED); else lv_obj_clear_state(id(qp_avond), LV_STATE_CHECKED);

  # ---- wekker: tijd, aan/uit, dagen, geluid, zonsopgang + tegel en nachtstand
  - id: wk_render
    then:
      - lambda: |-
          char t[8]; snprintf(t, sizeof(t), "%02d:%02d", id(wk_min) / 60, id(wk_min) % 60);
          bool aan = id(wk_aan).state == "on";
          lv_label_set_text(id(wk_big), t);
          lv_obj_set_style_text_color(id(wk_big), lv_color_hex(aan ? ${c_ink} : ${c_off}), 0);
          if (aan) lv_obj_add_state(id(wk_sw), LV_STATE_CHECKED); else lv_obj_clear_state(id(wk_sw), LV_STATE_CHECKED);
          lv_label_set_text(id(wk_sw_l), aan ? "AAN" : "UIT");
          lv_label_set_text(id(tl_wekker), aan ? t : "Uit");
          std::string nl = aan ? std::string("WEKKER ") + t : std::string("");
          lv_label_set_text(id(n_wekker), nl.c_str());
          // dagen
          static const char *dg[] = {"Werkdagen", "Elke dag", "Weekend"};
          lv_obj_t *db[] = {id(wk_d0), id(wk_d1), id(wk_d2)};
          for (int k = 0; k < 3; k++) {
            bool sel = id(wk_dagen).state == dg[k];
            lv_obj_set_style_bg_color(db[k], lv_color_hex(sel ? ${c_ink} : ${c_tile}), 0);
            lv_obj_set_style_text_color(db[k], lv_color_hex(sel ? ${c_paper} : ${c_ink}), 0);
          }
          std::string dsub = id(wk_dagen).state;
          for (auto &c : dsub) c = toupper((unsigned char) c);
          lv_label_set_text(id(wk_info), aan ? (std::string("WEKKER AAN · ") + dsub).c_str() : "WEKKER UIT");
          // geluid
          std::string g = id(wk_geluid).state;
          lv_label_set_text(id(wk_g_name), g.c_str());
          static const char *gn[] = {"Fluisterwekker", "Wekkerbrigade", "Zoemer", "Klassieke wekker", "Alarm",
                                     "Rustig wekken", "Muziek", "Natuurgeluiden", "Alleen licht"};
          lv_obj_t *gb[] = {id(wg_0), id(wg_1), id(wg_2), id(wg_3), id(wg_4), id(wg_5), id(wg_6), id(wg_7), id(wg_8)};
          lv_obj_t *gs[] = {id(wg_s0), id(wg_s1), id(wg_s2), id(wg_s3), id(wg_s4), id(wg_s5), id(wg_s6), id(wg_s7), id(wg_s8)};
          for (int k = 0; k < 9; k++) {
            bool sel = g == gn[k];
            lv_obj_set_style_bg_color(gb[k], lv_color_hex(sel ? ${c_ink} : ${c_tile}), 0);
            lv_obj_set_style_text_color(gb[k], lv_color_hex(sel ? ${c_paper} : ${c_ink}), 0);
            lv_obj_set_style_text_color(gs[k], lv_color_hex(sel ? ${c_grey} : ${c_sub}), 0);
          }
          bool lamp = id(wk_lampen).state == "on";
          if (lamp) lv_obj_add_state(id(wk_lamp_sw), LV_STATE_CHECKED); else lv_obj_clear_state(id(wk_lamp_sw), LV_STATE_CHECKED);
  - id: wk_step
    parameters:
      d: int
    then:
      - lambda: |-
          id(wk_min) = ((id(wk_min) + d) % 1440 + 1440) % 1440;
      - script.execute: wk_render
      - script.execute: wk_send
  # pas 1,5 s na de laatste tik naar HA sturen (snel tikken = één keer opslaan)
  - id: wk_send
    mode: restart
    then:
      - delay: 1500ms
      - homeassistant.action:
          action: input_datetime.set_datetime
          data:
            entity_id: input_datetime.wekker_slaapkamer_tijd
            time: !lambda 'char b[12]; snprintf(b, sizeof(b), "%02d:%02d:00", id(wk_min) / 60, id(wk_min) % 60); return std::string(b);'
  - id: wk_pick
    parameters:
      i: int
    then:
      - homeassistant.action:
          action: input_select.select_option
          data:
            entity_id: input_select.wekker_slaapkamer_geluid
            option: !lambda |-
              static const char *gn[] = {"Fluisterwekker", "Wekkerbrigade", "Zoemer", "Klassieke wekker", "Alarm",
                                         "Rustig wekken", "Muziek", "Natuurgeluiden", "Alleen licht"};
              return std::string(gn[std::max(0, std::min(8, i))]);
  - id: wk_days
    parameters:
      i: int
    then:
      - homeassistant.action:
          action: input_select.select_option
          data:
            entity_id: input_select.wekker_slaapkamer_dagen
            option: !lambda 'return std::string(i == 1 ? "Elke dag" : (i == 2 ? "Weekend" : "Werkdagen"));'
  - id: lt_render
    then:
      - lambda: |-
          lv_obj_t *sw[] = {id(lt_sw0), id(lt_sw1), id(lt_sw2)};
          lv_obj_t *sl[] = {id(lt_sl0), id(lt_sl1), id(lt_sl2)};
          lv_obj_t *pc[] = {id(lt_pc0), id(lt_pc1), id(lt_pc2)};
          std::string st[] = {id(lt_s0).state, id(lt_s1).state, id(lt_s2).state};
          float br[] = {id(lt_b0).state, id(lt_b1).state, id(lt_b2).state};
          int aan = 0;
          for (int k = 0; k < 3; k++) {
            bool on = st[k] == "on";
            if (on) aan++;
            if (on) lv_obj_add_state(sw[k], LV_STATE_CHECKED); else lv_obj_clear_state(sw[k], LV_STATE_CHECKED);
            int pct = (on && !std::isnan(br[k])) ? std::max(1, (int) lroundf(br[k] * 100.0f / 255.0f)) : 0;
            if (!lv_obj_has_state(sl[k], LV_STATE_PRESSED)) lv_slider_set_value(sl[k], pct, LV_ANIM_OFF);
            char t[8]; if (on) snprintf(t, sizeof(t), "%d%%", pct); else snprintf(t, sizeof(t), "UIT");
            lv_label_set_text(pc[k], t);
          }
          char c[16];
          if (aan == 0) snprintf(c, sizeof(c), "Alles uit"); else snprintf(c, sizeof(c), "%d aan", aan);
          lv_label_set_text(id(lt_count), c);
          lv_label_set_text(id(tl_licht), c);
  - id: lt_switch
    parameters:
      i: int
      aan: bool   # niet "on": YAML leest dat als true
    then:
      - homeassistant.action:
          action: !lambda 'return std::string(aan ? "light.turn_on" : "light.turn_off");'
          data:
            entity_id: !lambda 'return std::string(i == 1 ? "light.eettafel" : (i == 2 ? "light.keuken" : "light.woonkamer"));'
  - id: lt_set
    parameters:
      i: int
      pct: int
    then:
      - if:
          condition:
            lambda: 'return pct <= 0;'
          then:
            - homeassistant.action:
                action: light.turn_off
                data:
                  entity_id: !lambda 'return std::string(i == 1 ? "light.eettafel" : (i == 2 ? "light.keuken" : "light.woonkamer"));'
          else:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda 'return std::string(i == 1 ? "light.eettafel" : (i == 2 ? "light.keuken" : "light.woonkamer"));'
                  brightness_pct: !lambda 'return std::to_string(pct);'

  # ---- sfeer: laatste keuze zwart, naam op de tegel van Thuis
  - id: sf_mark
    then:
      - lambda: |-
          lv_obj_t *b[] = {id(sf_0), id(sf_1), id(sf_2), id(sf_3), id(sf_4), id(sf_5), id(sf_6), id(sf_7)};
          lv_obj_t *s[] = {id(sf_s0), id(sf_s1), id(sf_s2), id(sf_s3), id(sf_s4), id(sf_s5), id(sf_s6), id(sf_s7)};
          static const char *naam[] = {"Woonkamer", "WK + eettafel", "Herfstgoud", "Tafel", "Concentreren", "Fairfax", "Random", "Alles uit"};
          for (int k = 0; k < 8; k++) {
            bool on = k == id(sf_idx);
            lv_obj_set_style_bg_color(b[k], lv_color_hex(on ? ${c_ink} : ${c_tile}), 0);
            lv_obj_set_style_text_color(b[k], lv_color_hex(on ? ${c_paper} : ${c_ink}), 0);
            lv_obj_set_style_text_color(s[k], lv_color_hex(on ? ${c_grey} : ${c_sub}), 0);
          }
          lv_label_set_text(id(tl_sfeer), id(sf_idx) >= 0 && id(sf_idx) < 8 ? naam[id(sf_idx)] : "Kies");
  - id: sf_scene
    parameters:
      i: int
      ent: string
    then:
      - lambda: 'id(sf_idx) = i;'
      - script.execute: sf_mark
      - homeassistant.action:
          action: scene.turn_on
          data:
            entity_id: !lambda 'return ent;'

  # ---- muziek
  - id: mp_render
    then:
      - lambda: |-
          std::string s = id(mp_st).state;
          bool speelt = s == "playing";
          auto ok = [](const std::string &v) { return !(v.empty() || v == "unknown" || v == "unavailable" || v == "None"); };
          std::string ti = ok(id(mp_title).state) ? id(mp_title).state : std::string(s == "idle" || s == "off" ? "Er speelt niets" : "Woonkamer");
          std::string ar = ok(id(mp_artist).state) ? id(mp_artist).state : std::string("");
          std::string al = ok(id(mp_album).state) ? id(mp_album).state : std::string("");
          lv_label_set_text(id(mi_title), ti.c_str());
          lv_label_set_text(id(mu_title), ti.c_str());
          std::string sub = ar;
          for (auto &c : sub) c = toupper((unsigned char) c);
          sub = sub.empty() ? std::string("WOONKAMER") : sub + " · WOONKAMER";
          lv_label_set_text(id(mi_sub), sub.c_str());
          std::string aa = ar.empty() ? al : (al.empty() ? ar : ar + " — " + al);
          lv_label_set_text(id(mu_sub), aa.c_str());
          lv_label_set_text(id(mi_play_i), speelt ? "${ic_pause}" : "${ic_play}");
          lv_label_set_text(id(mu_play_i), speelt ? "${ic_pause}" : "${ic_play}");
          int v = id(vol_local);
          char t[8]; if (v < 0) snprintf(t, sizeof(t), "–"); else snprintf(t, sizeof(t), "%d%%", v);
          lv_label_set_text(id(mi_vol), t);
          lv_label_set_text(id(mu_vol), t);
          int vv = std::max(0, std::min(100, v));
          lv_obj_set_width(id(mi_volbar), std::max(1, vv * 40 / 100));
          lv_obj_set_width(id(mu_volbar), std::max(1, vv * 70 / 100));
      - script.execute: mini_vis
  - id: mp_volume
    parameters:
      d: int
    then:
      - lambda: |-
          int v = id(vol_local) < 0 ? 30 : id(vol_local);
          id(vol_local) = std::max(0, std::min(100, v + d));
      - script.execute: mp_render
      - homeassistant.action:
          action: media_player.volume_set
          data:
            entity_id: ${speler}
            volume_level: !lambda 'char b[8]; snprintf(b, sizeof(b), "%.2f", id(vol_local) / 100.0f); return std::string(b);'
  - id: mp_cmd
    parameters:
      a: string
    then:
      - homeassistant.action:
          action: !lambda 'return a;'
          data:
            entity_id: ${speler}

  # ---- klimaat
  - id: cl_render
    then:
      - lambda: |-
          auto fmt = [](float f, char *b, size_t n) {
            if (std::isnan(f)) { snprintf(b, n, "–"); return; }
            snprintf(b, n, "%.1f°", f);
            for (char *p = b; *p; p++) if (*p == '.') *p = ',';
          };
          char c[16], g[16];
          fmt(id(cl_cur).state, c, sizeof(c));
          fmt(id(cl_target).state, g, sizeof(g));
          lv_label_set_text(id(cl_now), c);
          lv_label_set_text(id(cl_want), g);
          bool aan = id(cl_mode).state != "off";
          lv_label_set_text(id(cl_mode_l), aan ? "VERWARMING AAN" : "VERWARMING UIT");
          lv_obj_set_style_bg_color(id(cl_mode_b), lv_color_hex(aan ? ${c_red} : ${c_tile}), 0);
  - id: cl_step
    parameters:
      d: float
    then:
      - lambda: |-
          float t = id(cl_target).state;
          if (std::isnan(t)) t = 20.0f;
          t = std::max(5.0f, std::min(30.0f, t + d));
          id(cl_target).publish_state(t);
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: climate.living_room
            temperature: !lambda 'char b[8]; snprintf(b, sizeof(b), "%.1f", id(cl_target).state); return std::string(b);'

  # ---- weer (Thuis-regel, Weer-pagina, regenbalkjes en komende uren)
  - id: wx_render
    then:
      - lambda: |-
          auto naam = [](const std::string &c) -> const char * {
            if (c == "sunny") return "zonnig";
            if (c == "clear-night") return "helder";
            if (c == "partlycloudy") return "half bewolkt";
            if (c == "cloudy") return "bewolkt";
            if (c == "rainy") return "regen";
            if (c == "pouring") return "zware regen";
            if (c == "fog") return "mist";
            if (c == "snowy") return "sneeuw";
            if (c == "snowy-rainy") return "natte sneeuw";
            if (c == "lightning" || c == "lightning-rainy") return "onweer";
            if (c == "windy" || c == "windy-variant") return "harde wind";
            if (c == "hail") return "hagel";
            if (c == "exceptional") return "bijzonder weer";
            return "";
          };
          auto icoon = [](const std::string &c) -> const char * {
            if (c == "sunny") return "${ic_sunny}";
            if (c == "clear-night") return "${ic_clear}";
            if (c == "partlycloudy") return "${ic_pcloudy}";
            if (c == "cloudy") return "${ic_cloudy}";
            if (c == "rainy") return "${ic_rain}";
            if (c == "pouring") return "${ic_pouring}";
            if (c == "fog") return "${ic_fog}";
            if (c == "snowy") return "${ic_snowy}";
            if (c == "snowy-rainy") return "${ic_snowrain}";
            if (c == "lightning" || c == "lightning-rainy") return "${ic_lightning}";
            if (c == "windy" || c == "windy-variant") return "${ic_windy}";
            if (c == "hail") return "${ic_hail}";
            return "${ic_cloudy}";
          };
          std::string cond = id(wx_cond).state;
          float tmp = id(wx_temp).state;
          char ts[12];
          if (std::isnan(tmp)) snprintf(ts, sizeof(ts), "–"); else snprintf(ts, sizeof(ts), "%d°", (int) lroundf(tmp));

          // regen: Buienradar-waarde 0..255 per 5 min
          std::string s = id(wx_regen).state;
          int val[24]; std::string tm[24]; int n = 0;
          size_t a = 0;
          while (n < 24 && a < s.size()) {
            size_t b = s.find(' ', a); std::string e = s.substr(a, b == std::string::npos ? std::string::npos : b - a);
            size_t p = e.find('|');
            if (p != std::string::npos) { val[n] = atoi(e.substr(0, p).c_str()); tm[n] = e.substr(p + 1); n++; }
            if (b == std::string::npos) break;
            a = b + 1;
          }
          lv_obj_t *rb[] = {id(rb_0), id(rb_1), id(rb_2), id(rb_3), id(rb_4), id(rb_5), id(rb_6), id(rb_7), id(rb_8), id(rb_9), id(rb_10), id(rb_11)};
          for (int k = 0; k < 12; k++) {
            int v0 = 2 * k < n ? val[2 * k] : 0, v1 = 2 * k + 1 < n ? val[2 * k + 1] : 0;
            int v = std::max(v0, v1);
            lv_obj_set_height(rb[k], v <= 0 ? 0 : std::max(4, std::min(56, (v - 60) * 56 / 100)));
          }
          std::string kort, lang;
          if (n == 0) { kort = "geen regendata"; lang = "GEEN REGENDATA"; }
          else if (val[0] > 0) {
            int e = -1; for (int k = 1; k < n; k++) if (val[k] <= 0) { e = k; break; }
            kort = e < 0 ? "regen houdt aan" : "droog om " + tm[e];
            lang = e < 0 ? "HET REGENT · HOUDT AAN" : "HET REGENT · DROOG OM " + tm[e];
          } else {
            int b = -1; for (int k = 1; k < n; k++) if (val[k] > 0) { b = k; break; }
            if (b < 0) { kort = "droog"; lang = "DROOG KOMENDE 2 UUR"; }
            else {
              char m[40]; snprintf(m, sizeof(m), "regen over %d min", b * 5); kort = m;
              snprintf(m, sizeof(m), "REGEN OVER %d MIN", b * 5); lang = m;
            }
          }
          lv_label_set_text(id(wx_tip), lang.c_str());
          // regel op Thuis + tegel
          std::string regel = std::string(ts);
          if (*naam(cond)) regel += std::string(" · ") + naam(cond);
          regel += " · " + kort;
          lv_label_set_text(id(h_wx), regel.c_str());
          lv_label_set_text(id(h_wx_i), icoon(cond));
          std::string tegel = kort; if (!tegel.empty()) tegel[0] = toupper((unsigned char) tegel[0]);
          lv_label_set_text(id(tl_weer), tegel.c_str());
          // weerpagina
          lv_label_set_text(id(wx_big), ts);
          std::string nm = naam(cond); if (!nm.empty()) nm[0] = toupper((unsigned char) nm[0]);
          lv_label_set_text(id(wx_name), nm.c_str());
          float w = id(wx_wind).state, h = id(wx_hum).state;
          static const float bft[] = {1, 6, 12, 20, 29, 39, 50, 62, 75, 89, 103, 118};
          char ex[48] = "";
          if (!std::isnan(w)) {
            int bf = 0; while (bf < 12 && w >= bft[bf]) bf++;
            if (!std::isnan(h)) snprintf(ex, sizeof(ex), "WIND %d BFT · VOCHT %d%%", bf, (int) lroundf(h));
            else snprintf(ex, sizeof(ex), "WIND %d BFT", bf);
          }
          lv_label_set_text(id(wx_extra), ex);
          // komende 6 uur: "uur|conditie|temp;..."
          lv_obj_t *hu[] = {id(wh_u0), id(wh_u1), id(wh_u2), id(wh_u3), id(wh_u4), id(wh_u5)};
          lv_obj_t *hi[] = {id(wh_i0), id(wh_i1), id(wh_i2), id(wh_i3), id(wh_i4), id(wh_i5)};
          lv_obj_t *ht[] = {id(wh_t0), id(wh_t1), id(wh_t2), id(wh_t3), id(wh_t4), id(wh_t5)};
          std::string hs = id(wx_hours).state;
          size_t q = 0;
          for (int k = 0; k < 6; k++) {
            std::string part;
            if (q != std::string::npos && q < hs.size()) {
              size_t r = hs.find(';', q);
              part = hs.substr(q, r == std::string::npos ? std::string::npos : r - q);
              q = r == std::string::npos ? std::string::npos : r + 1;
            }
            size_t p1 = part.find('|'), p2 = p1 == std::string::npos ? std::string::npos : part.find('|', p1 + 1);
            if (p2 == std::string::npos) { lv_label_set_text(hu[k], ""); lv_label_set_text(hi[k], ""); lv_label_set_text(ht[k], ""); continue; }
            std::string u = part.substr(0, p1) + ":00";
            std::string c = part.substr(p1 + 1, p2 - p1 - 1);
            std::string t = part.substr(p2 + 1) + "°";
            lv_label_set_text(hu[k], u.c_str());
            lv_label_set_text(hi[k], icoon(c));
            lv_label_set_text(ht[k], t.c_str());
          }

# ---------------------------------------------------------------- scherm


lvgl:
  id: lvgl_main
  buffer_size: 25%
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  page_wrap: false
  style_definitions:
    - id: st_page
      bg_color: ${c_paper}
      bg_opa: COVER
      pad_all: 0
      text_color: ${c_ink}
      text_font: f_15
    # tegel / knop zonder rand
    - id: st_tile
      bg_color: ${c_tile}
      bg_opa: COVER
      radius: 0
      border_width: 0
      shadow_width: 0
      pad_all: 0
    # omlijnde knop
    - id: st_outline
      bg_opa: TRANSP
      radius: 0
      border_width: 1
      border_color: ${c_ink}
      shadow_width: 0
      pad_all: 0
    # vlakje/cirkel als versiering (niet aanraakbaar)
    - id: st_deco
      bg_opa: COVER
      border_width: 0
      pad_all: 0
      radius: 0
    - id: st_mono11
      text_font: f_m11
      text_letter_space: 1
    - id: st_mono12
      text_font: f_m12
      text_letter_space: 1
  theme:
    obj:
      border_width: 0
      scrollable: false
      pad_all: 0
      bg_opa: TRANSP
      radius: 0
    button:
      shadow_width: 0
      border_width: 0
      radius: 0
      bg_color: ${c_tile}
      text_color: ${c_ink}
      pressed:
        bg_color: ${c_ink}
        text_color: ${c_paper}
  on_idle:
    - timeout: 1min
      then:
        - if:
            condition:
              lambda: 'return id(cur_page) != 9;'
            then:
              - light.turn_on: {id: display_backlight, brightness: 65%}
    - timeout: 2min
      then:
        - if:
            condition:
              lambda: 'return id(cur_page) != 9;'
            then:
              - light.turn_on: {id: display_backlight, brightness: 35%}
    - timeout: 30min
      then:
        - if:
            condition:
              lambda: 'return id(cur_page) != 9 && id(wk_af).state != "on";'
            then:
              - light.turn_off: display_backlight
              - lvgl.widget.hide: qp
              - lvgl.page.show: p_home

  # ---- vaste lagen over alle schermen: spelerbalk (boven), paneel LICHT & SCHERM,
